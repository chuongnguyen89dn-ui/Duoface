name: DuoFace VisualTest12 historical core source census
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duoface-visualtest12-history-source-audit.yml'
      - 'migration/full_payload/native_test/audit_visualtest12_historical_sources.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visualtest12-history-sources
  cancel-in-progress: false
jobs:
  source-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all DuoFace branches and exact historical objects
        run: |
          set -euo pipefail
          git fetch --all --prune --tags
          python3 -m py_compile migration/full_payload/native_test/audit_visualtest12_historical_sources.py
      - name: Scan historical source blobs without modifying build binaries
        run: |
          set -euo pipefail
          python3 migration/full_payload/native_test/audit_visualtest12_historical_sources.py --output audit/payload-migration/VISUALTEST12_HISTORICAL_CORE_SOURCES.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("audit/payload-migration/VISUALTEST12_HISTORICAL_CORE_SOURCES.json").read_text())
          assert a["read_only"] and not a["binary_modified"]
          assert not a["hub_modified"] and not a["deb_built"] and not a["sileo_deployed"]
          assert a["source_blobs_inspected"]>0
          print("VISUALTEST12_HISTORICAL_SOURCES_QA_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualtest12-historical-sources-readonly
          path: audit/payload-migration/VISUALTEST12_HISTORICAL_CORE_SOURCES.json
          if-no-files-found: warn
      - name: Persist source census on DuoFace feature branch
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/VISUALTEST12_HISTORICAL_CORE_SOURCES.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: VisualTest12 full Git history source census [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
