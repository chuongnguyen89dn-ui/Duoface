      - name: Audit every packaged file against source contracts and export aggregate summary only
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sideplay/tools/tests -p 'test_audit_integrated_deb.py' -v
          DEB_SHA="$(shasum -a 256 "$QA172W_PRIVATE_OUTPUT" | awk '{print $1}')"
          if ! python3 sideplay/tools/audit_integrated_deb.py \
            --deb "$QA172W_PRIVATE_OUTPUT" --out "$RUNNER_TEMP/wakefix4-audit" \
            --expected-sha256 "$DEB_SHA" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/wakefix4-audit-console.log" 2>&1; then
            echo 'WHOLE_DEB_STATIC_AUDIT_FAILED; detailed report remains runner-local'
            exit 1
          fi
          python3 - "$RUNNER_TEMP/wakefix4-audit" "$RUNNER_TEMP/wakefix4-audit-summary.json" <<'PY_AUDIT'
          import json, pathlib, plistlib, sys
          current=pathlib.Path(sys.argv[1])
          read=lambda p:json.loads(p.read_text())
          new=read(current/'audit.json')
          assert new['package']=='com.duoface.jb.embedded'
          assert new['version']=='0.0.172~wakefix4'
          assert new['static_integrity_pass'] and new['expected_sha256_verified']
          expected_counts={'payload_regular_files':40,'control_regular_files':3,
                           'mach_o_files':11,'mach_o_slices':14,'plists':12,
                           'png_files':15,'compiled_nibs':2,'links':0}
          assert {key:new['counts'][key] for key in expected_counts}==expected_counts, 'Package counts changed'
          host=pathlib.Path('sideplay/duoface-native-scene-host')
          filter_sources={name:host/(name+'.plist') for name in (
              'DF155GeneralAppStateRelay','DFCarPlayDockOwner','DFGofaMapResize141',
              'DFGofaSpeedSource162','DFTouchOwnerProbe','DFYouTubeOrientationRelay')}
          filter_sources.update({
              'DFNativeMapPaneCoordinator':pathlib.Path('sideplay/native-carplay-scene-v1/DFNativeMapPaneCoordinator.plist'),
              'DFFirstPartyAdmission':pathlib.Path('sideplay/firstparty-carplay-admission/DFFirstPartyAdmission.plist'),
              'DFNativeDashboardBridgeQA':pathlib.Path('sideplay/mytweak-native-bridgeqa/DFNativeDashboardBridgeQA.plist'),
              'DFV1APreflight':pathlib.Path('sideplay/mytweak-independent-v1a/DFV1APreflight.plist')})
          lib='var/jb/Library/MobileSubstrate/DynamicLibraries/'
          expected_filters={lib+name+'.plist':plistlib.loads(path.read_bytes())['Filter'] for name,path in filter_sources.items()}
          actual_filters={entry['path']:entry['filter'] for entry in new['injection_filters']}
          assert len(actual_filters)==len(new['injection_filters'])==10
          assert actual_filters==expected_filters, 'Injection filters differ from checked-in source'
          app='var/jb/Applications/DuoFaceNativeHost.app/DuoFaceNativeHost'
          expected_binaries={app}|{lib+name+'.dylib' for name in filter_sources}
          assert {binary['path'] for binary in new['binaries']}==expected_binaries
          app_entitlements=plistlib.loads((host/'entitlements.plist').read_bytes())
          assert not any(o['code']=='temporary_install_name' for o in new['observations'])
          for binary in new['binaries']:
              report=read(current/binary['report'])
              assert report['slices'], 'Missing Mach-O slice'
              expected_entitlements=app_entitlements if binary['path']==app else {}
              for item in report['slices']:
                  assert item['build_versions'] and all(v['platform']=='iOS' and v['minimum_os_raw']==(16<<16) for v in item['build_versions']), 'Minimum iOS differs from source target'
                  signature=item['code_signature']
                  assert signature['all_code_pages_match'] and signature['all_available_special_slots_match']
                  assert signature.get('entitlements',{})==expected_entitlements, 'Entitlements differ from source'
                  assert signature.get('der_entitlements',expected_entitlements)==expected_entitlements
                  if binary['path'].endswith('.dylib'):
                      assert item['install_name']=='@rpath/'+pathlib.PurePosixPath(binary['path']).name
          # Deliberate export allowlist: no payload paths, symbols, strings, or dependencies.
          summary={'package':new['package'],'version':new['version'],'deb_sha256':new['deb_sha256'],
                   'counts':{key:new['counts'][key] for key in expected_counts},
                   'static_integrity_pass':True,'expected_sha256_verified':True,
                   'package_contract_pass':True,'injection_filters_match_source':True,
                   'binary_roster_matches_source':True,'entitlements_match_source':True,
                   'minimum_ios16_pass':True,'stable_dylib_install_names_pass':True,
                   'code_signature_hashes_pass':True,'device_tested':False}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('WAKEFIX4_FULL_DEB_STATIC_AUDIT_PASS_AGGREGATE_SUMMARY_ONLY_DEVICE_UNTESTED')
          PY_AUDIT
          mkdir -p "$RUNNER_TEMP/wakefix4-deliverable"
          cp "$QA172W_PRIVATE_OUTPUT" "$RUNNER_TEMP/wakefix4-deliverable/"
          cp sideplay/jb-embedded-appbridge/packages/PACKAGING_PROVENANCE.json "$RUNNER_TEMP/wakefix4-deliverable/"
          cp "$RUNNER_TEMP/wakefix4-audit-summary.json" "$RUNNER_TEMP/wakefix4-deliverable/audit-summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: QA172-wakefix4-UNPUBLISHED
          path: |
            ${{ runner.temp }}/wakefix4-deliverable/com.duoface.jb.embedded_0.0.172~wakefix4_iphoneos-arm64.deb
            ${{ runner.temp }}/wakefix4-deliverable/PACKAGING_PROVENANCE.json
            ${{ runner.temp }}/wakefix4-deliverable/audit-summary.json
          if-no-files-found: error
      - name: Archive private signed candidate with SHA to actual DuoFace repo, NEVER carplaydsp
        run: |
          set -euo pipefail
          BRANCH='feature/sideplay-wakefix4-20261106'
          ART='com.duoface.jb.embedded_0.0.172~wakefix4_iphoneos-arm64.deb'
          for n in 1 2 3 4; do
            git fetch --no-tags origin "$BRANCH"
            DIR="$(mktemp -d)"
            git worktree add --detach "$DIR" FETCH_HEAD
            OUT="$DIR/sideplay/jb-embedded-appbridge/evidence/runs/$GITHUB_RUN_ID"
            mkdir -p "$OUT"
            cp "$QA172W_PRIVATE_OUTPUT" "$OUT/$ART"
            ( cd "$OUT" && shasum -a 256 "$ART" > SHA256SUMS.txt && shasum -a 256 -c SHA256SUMS.txt )
            cp sideplay/jb-embedded-appbridge/packages/PACKAGING_PROVENANCE.json "$OUT/"
            cp "$RUNNER_TEMP/wakefix4-audit-summary.json" "$OUT/audit-summary.json"
            printf 'BUILD=success\nSIGNED=true\nWHOLE_DEB_STATIC_AUDIT=pass\nSOURCE_SHA=%s\nRUN_ID=%s\nSILEO_PUBLISHED=false\nGOFA_REAL_ROAD_ALERTS_CONNECTED=false\nGOFA_REAL_NAVIGATION_TURNS_CONNECTED=false\nGOFA_RUNTIME_PROBE_VERIFIED=false\nDEVICE_TESTED=false\nDO_NOT_INSTALL_REPEATEDLY=true\nHOME_STANDALONE_OPTIN_DEFAULT_OFF=true\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$OUT/CI_RESULT.txt"
            git -C "$DIR" config user.name 'github-actions[bot]'
            git -C "$DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$DIR" add "sideplay/jb-embedded-appbridge/evidence/runs/$GITHUB_RUN_ID/"
            git -C "$DIR" commit -m 'qa172 wakefix4: archive audited private repair candidate, device test pending [skip ci]'
            if git -C "$DIR" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$DIR"
              git fetch origin "$BRANCH"
              git cat-file -e "FETCH_HEAD:sideplay/jb-embedded-appbridge/evidence/runs/$GITHUB_RUN_ID/SHA256SUMS.txt"
              echo QA172W_PRIVATE_SIGNED_ARCHIVE_SAVED_NO_SILEO
              exit 0
            fi
            git worktree remove --force "$DIR"
          done
          exit 1
