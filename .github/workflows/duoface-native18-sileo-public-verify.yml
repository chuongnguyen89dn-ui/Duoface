name: DuoFace native18 verify public Sileo APT and exact DEB
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duoface-native18-sileo-public-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for published APT index and verify native18 without touching installed devices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native18-public"
          cd "$RUNNER_TEMP/native18-public"
          base='https://chuongnguyen89dn-ui.github.io/carplaydsp'
          for n in $(seq 1 55); do
            curl --fail --location --retry 2 "$base/Packages" -o Packages || true
            if grep -Fq 'Version: 0.1.0~native18' Packages 2>/dev/null; then break; fi
            echo "Awaiting native18 Pages publication $n"
            sleep 12
          done
          curl --fail --location "$base/Packages.gz" -o Packages.gz
          gzip -dc Packages.gz > Packages.uncompressed
          cmp Packages Packages.uncompressed
          python3 - <<'PY'
          import pathlib
          txt=pathlib.Path('Packages').read_text()
          entries=[]
          for para in txt.strip().split('\n\n'):
              o={}
              for line in para.splitlines():
                  if ': ' in line and not line.startswith(' '):
                      k,v=line.split(': ',1);o[k]=v
              if o.get('Package'):entries.append(o)
          native=[o for o in entries if o['Package']=='com.duoface.independent']
          old=[o for o in entries if o['Package']=='com.duonavi.app']
          assert len(native)==1, native
          assert len(old)==1, old
          pkg=native[0]
          assert pkg['Version']=='0.1.0~native18', pkg
          assert pkg['Architecture']=='iphoneos-arm64'
          assert pkg['SHA256']=='dfbcde5a309f7e90c414c2a10385e96aab3f17ebab0c7dd491313c9ef6a63503'
          assert pkg['Filename'].endswith('/com.duoface.independent_0.1.0~native18_iphoneos-arm64.deb')
          pathlib.Path('metadata.txt').write_text(str(pkg))
          print('APT_NATIVE18_METADATA_AND_LEGACY_PACKAGE_PRESERVED_PASS')
          PY
          curl --fail --location --retry 5 --retry-delay 4             "$base/debs/com.duoface.independent_0.1.0~native18_iphoneos-arm64.deb" -o native18.deb
          printf '%s  %s\n' 'dfbcde5a309f7e90c414c2a10385e96aab3f17ebab0c7dd491313c9ef6a63503' native18.deb | sha256sum -c -
          test "$(dpkg-deb -f native18.deb Package)" = com.duoface.independent
          test "$(dpkg-deb -f native18.deb Version)" = '0.1.0~native18'
          dpkg-deb -c native18.deb > contents.txt
          for name in DuoFaceSmartConnection DuoFaceInCarAddApps DuoFaceDashboard DuoFaceFullscreenBridge DuoFaceVisualHook DuoFaceLogoGripOnly DuoFaceSettingsUIRestore; do
            grep -F "$name.dylib" contents.txt
          done
          ! grep -F 'A_DuoFaceNativeNoLease' contents.txt
          # Do not rely only on package index; inspect downloaded live release payload.
          mkdir -p extracted
          dpkg-deb -x native18.deb extracted
          pref='extracted/var/jb/Library/MobileSubstrate/DynamicLibraries'
          printf '%s  %s\n' 'cb40346d8ca504cb399abe31367847b4f980a01ba93810986ce1acf1fbe9eef9' extracted/var/jb/Applications/DuoFaceUI.app/DuoFaceUI | sha256sum -c -
          printf '%s  %s\n' '9e02a4bcee98fb703777122c67286158d9ca9cfa3088887b5ca280c580a695ea' "$pref/DuoFaceDashboard.dylib" | sha256sum -c -
          printf '%s  %s\n' '0986cf70b4c613ad011520204337e1e2b403d24111f39f14f70628fb57e61d50' "$pref/DuoFaceSmartConnection.dylib" | sha256sum -c -
          printf '%s  %s\n' 'e23a6a653874ff05542f75d0f97e4b8b4603d0a2d60f36a3dabc8a32036e57b1' "$pref/DuoFaceInCarAddApps.dylib" | sha256sum -c -
          printf '%s  %s\n' '680f79a1bb4d58a3bf277f7ed253f88627459390599a0818660f89dabe2e629f' "$pref/DuoFaceSettingsUIRestore.dylib" | sha256sum -c -
          echo 'NATIVE18_RELEASE_PAYLOAD_NATIVE12_CORE_TWO_FEATURES_UI_ONLY_HASH_PASS'
          echo 'PUBLIC_SILEO_NATIVE18_EXACT_SHA_TEST_ARTIFACT_VERIFIED_NOT_DEVICE_TESTED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-native18-public-sileo-proof
          path: |
            ${{ runner.temp }}/native18-public/Packages
            ${{ runner.temp }}/native18-public/Packages.gz
            ${{ runner.temp }}/native18-public/contents.txt
            ${{ runner.temp }}/native18-public/metadata.txt
          if-no-files-found: warn
