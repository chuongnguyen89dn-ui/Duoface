name: DuoFace independent CarPlay template scene candidate (isolated DEB)
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - '.github/workflows/duoface-native-template-smoke.yml'
      - 'sideplay/duoface-native-scene-host/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-native-template-smoke
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated CarPlay scene contract
        # Validate split UI and safe independent session-based input-owner wiring.
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_*.py' -v
      - name: Install rootless artifact tools
        run: |
          set -euo pipefail
          brew install ldid dpkg
      - name: Build and verify genuine CarPlay template host
        run: |
          set -euo pipefail
          bash sideplay/duoface-native-scene-host/build.sh
          FILE='sideplay/duoface-native-scene-host/packages/com.duoface.carplay.nativescenehost_0.1.7~nativecore1_iphoneos-arm64.deb'
          test -s "$FILE"
          test "$(dpkg-deb -f "$FILE" Package)" = com.duoface.carplay.nativescenehost
          test "$(dpkg-deb -f "$FILE" Version)" = '0.1.7~nativecore1'
          test "$(dpkg-deb -f "$FILE" Architecture)" = iphoneos-arm64
          ! dpkg-deb -f "$FILE" | grep -Eq '^(Conflicts|Replaces|Breaks|Provides):'
          OUT="$RUNNER_TEMP/nativehost-check"
          mkdir -p "$OUT"
          dpkg-deb -x "$FILE" "$OUT"
          APP="$OUT/var/jb/Applications/DuoFaceNativeHost.app"
          test -s "$APP/DuoFaceNativeHost"
          PROBE="$OUT/var/jb/Library/MobileSubstrate/DynamicLibraries"
          test -s "$PROBE/DFTouchOwnerProbe.dylib"
          # The actual embedded binary must include our new native control owner,
          # rather than merely compiling a visual-only CPWindow placeholder.
          strings "$PROBE/DFTouchOwnerProbe.dylib" | grep -F 'native12-chrome-start'
          strings "$PROBE/DFTouchOwnerProbe.dylib" | grep -F 'divider-pan-end'
          strings "$PROBE/DFTouchOwnerProbe.dylib" | grep -F 'logo-reposition-long-hold'
          strings "$PROBE/DFTouchOwnerProbe.dylib" | grep -F 'FocusRight'
          test -s "$PROBE/DFTouchOwnerProbe.plist"
          ldid -e "$PROBE/DFTouchOwnerProbe.dylib" > "$RUNNER_TEMP/touchowner-entitlements.xml"
          grep -F 'com.duoface.native.scenehost' "$APP/Info.plist"
          ! grep -Fq 'com.apple.CarPlayApp' "$PROBE/DFTouchOwnerProbe.plist"
          ldid -e "$APP/DuoFaceNativeHost" > "$RUNNER_TEMP/nativehost-entitlements.xml"
          grep -F 'com.apple.developer.carplay-maps' "$RUNNER_TEMP/nativehost-entitlements.xml"
          grep -F 'platform-application' "$RUNNER_TEMP/nativehost-entitlements.xml"
          APP_PATH="$APP" python3 - <<'PY'
          import plistlib,os
          from pathlib import Path
          app=Path(os.environ["APP_PATH"])
          with (app/"Info.plist").open("rb") as f: info=plistlib.load(f)
          assert info["CFBundleIdentifier"]=="com.duoface.native.scenehost"
          scenes=info["UIApplicationSceneManifest"]["UISceneConfigurations"]
          native=scenes["CPTemplateApplicationSceneSessionRoleApplication"][0]
          assert native["UISceneClassName"]=="CPTemplateApplicationScene"
          assert native["UISceneDelegateClassName"]=="DFNativeHostTemplateSceneDelegate"
          assert scenes["UIWindowSceneSessionRoleCarPlay"][0]["UISceneClassName"]=="UIWindowScene"
          print("DUOFACE_CPTEMPLATE_MANIFEST_PASS")
          PY
          mkdir -p sideplay/duoface-native-scene-host/packages
          (cd sideplay/duoface-native-scene-host && shasum -a 256 packages/*.deb > packages/SHA256SUMS.txt)
          printf 'SOURCE_SHA=%s\nRUN_ID=%s\nBUILD_AND_SIGNATURE=PASS\nSILEO_PUBLISHED=false\nHOME_ICON_DEVICE_VERIFIED=false\nCARPLAY_SCENE_DEVICE_VERIFIED=false\nDUAL_APP_TOUCH_VERIFIED=false\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > sideplay/duoface-native-scene-host/packages/CI_RESULT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DuoFace-Native-Template-Beta-Not-Installed
          path: |
            sideplay/duoface-native-scene-host/packages/*.deb
            sideplay/duoface-native-scene-host/packages/SHA256SUMS.txt
            sideplay/duoface-native-scene-host/packages/CI_RESULT.txt
          if-no-files-found: error
      - name: Save exact binary evidence in DuoFace feature branch
        run: |
          set -euo pipefail
          # Never rebase a generated binary onto moving CI_RESULT/SHA files:
          # it causes an add/add conflict whenever another job published first.
          BRANCH='feature/duoface-jb-embedded-appbridge-20261020'
          SUB='sideplay/duoface-native-scene-host'
          VERSION="$(awk '/^Version:/{print $2}' "$SUB/control")"
          FILE="com.duoface.carplay.nativescenehost_${VERSION}_iphoneos-arm64.deb"
          SOURCE="$(pwd)/$SUB/packages/$FILE"
          CI_SOURCE="$(pwd)/$SUB/packages/CI_RESULT.txt"
          test -s "$SOURCE"
          test -s "$CI_SOURCE"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "$BRANCH"
            CURRENT="$(mktemp -d)"
            git worktree add --detach "$CURRENT" FETCH_HEAD
            git -C "$CURRENT" config user.name 'github-actions[bot]'
            git -C "$CURRENT" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            TARGET="$CURRENT/$SUB/packages/$FILE"
            if test -f "$TARGET"; then
              if ! cmp -s "$SOURCE" "$TARGET"; then
                echo "Existing different binary for immutable version $VERSION — bump package version, do not overwrite" >&2
                git worktree remove --force "$CURRENT"
                rmdir "$CURRENT" 2>/dev/null || true
                exit 1
              fi
              echo "NATIVEHOST_BINARY_SAVED_TO_GITHUB=PASS already-existing-identical"
              git worktree remove --force "$CURRENT"
              rmdir "$CURRENT" 2>/dev/null || true
              exit 0
            fi
            cp "$SOURCE" "$TARGET"
            cp "$CI_SOURCE" "$CURRENT/$SUB/packages/CI_RESULT.txt"
            (cd "$CURRENT/$SUB" && shasum -a 256 packages/*.deb > packages/SHA256SUMS.txt)
            git -C "$CURRENT" add -f "$SUB/packages/$FILE" "$SUB/packages/SHA256SUMS.txt" "$SUB/packages/CI_RESULT.txt"
            git -C "$CURRENT" commit -m "build(nativehost): save immutable $VERSION signed binary and SHA [skip ci]"
            if git -C "$CURRENT" push origin "HEAD:refs/heads/$BRANCH"; then
              echo "NATIVEHOST_BINARY_SAVED_TO_GITHUB=PASS attempt=$attempt"
              git worktree remove --force "$CURRENT"
              rmdir "$CURRENT" 2>/dev/null || true
              exit 0
            fi
            git worktree remove --force "$CURRENT"
            rmdir "$CURRENT" 2>/dev/null || true
            echo "Concurrent branch update, retry safe binary save $attempt/5"
          done
          echo "Failed to save binary after 5 safe retries" >&2
          exit 1
