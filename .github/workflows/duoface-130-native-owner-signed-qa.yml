# QA130: same native-owner lease across phone lock, explicit per-UUID Home revocation.
# Preserve on-device verified QA120 native geometry and .90/.92 regressions. Retry: remove test false-positive on comment.
name: DuoFace 130 scene destroy + current owner signed staging QA
on:
  push:
    branches: [fix/duoface-qa130-verified-scene-owner-20261030]
    paths:
      - '.github/workflows/duoface-129-native-owner-signed-qa.yml'
      - 'sideplay/duoface-native-scene-host/DFSceneHost.m'
      - 'sideplay/duoface-native-scene-host/DFYouTubeOrientationRelay.m'
      - 'sideplay/duoface-native-scene-host/tests/test_evidence_owner_reflow_127.py'
      - 'sideplay/duoface-native-scene-host/DFSceneLifecycle.m'
      - 'sideplay/duoface-native-scene-host/tests/test_scene_destroy_owner_130.py'
      - 'sideplay/duoface-native-scene-host/tests/test_scene_background_owner_fix_130.py'
      - 'sideplay/duoface-native-scene-host/build.sh'
      - 'sideplay/duoface-native-scene-host/control'
      - 'sideplay/jb-embedded-appbridge/package_integrated.py'
      - 'sideplay/jb-embedded-appbridge/tests/test_integrated_package.py'
      - 'sideplay/duoface-native-scene-host/DFNativeHostAppDelegate.m'
      - 'sideplay/duoface-native-scene-host/tests/test_lock_runtime_125.py'
      - 'sideplay/duoface-native-scene-host/tests/test_native_rail_120.py'
      - 'sideplay/duoface-native-scene-host/Info.plist'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-130-scene-destroy-current-owner-signed-qa
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Validate QA130 source and updated integrated package policy
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/manual_observer_contract_test.c -o "$RUNNER_TEMP/manual-owner-contract"
          "$RUNNER_TEMP/manual-owner-contract"
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/owner_lease_policy_test.c -o "$RUNNER_TEMP/owner-policy"
          "$RUNNER_TEMP/owner-policy"
          clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation sideplay/duoface-native-scene-host/tests/owner_lease_records_test.m -o "$RUNNER_TEMP/owner-records"
          "$RUNNER_TEMP/owner-records"
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_scene_destroy_owner_130.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_scene_background_owner_fix_130.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_native_owner_contract.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_postlock_contract.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_evidence_owner_reflow_127.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_geometry_119.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_native_rail_120.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_underlock_owner_123.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_lock_runtime_125.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_inactive_lifecycle_124.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_carplay_sleep_121.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_emergency_no_wake_dock_118.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_logo_092_exact_regression.py' -v
          python3 -m unittest discover -s sideplay/jb-embedded-appbridge/tests -p 'test_integrated_package.py' -v
          grep -Fq 'VERSION="0.0.130~sceneowner1"' sideplay/jb-embedded-appbridge/package_integrated.py
          grep -Fq '0.1.130~sceneowner1' sideplay/duoface-native-scene-host/control
      - name: Install existing rootless toolchain and sign utilities
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          command -v ldid >/dev/null || brew install ldid
          command -v dpkg-deb >/dev/null || brew install dpkg
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          test -d "$(xcrun --sdk iphoneos --show-sdk-path)"
      - name: Build three original first-party rootless dependency modules
        run: |
          set -euo pipefail
          ( cd sideplay/mytweak-independent-v1a && make clean package FINALPACKAGE=1 )
          ( cd sideplay/mytweak-native-bridgeqa && make clean package FINALPACKAGE=1 )
          ( cd sideplay/firstparty-carplay-admission && make clean package FINALPACKAGE=1 )
          test -s sideplay/mytweak-independent-v1a/packages/com.duoface.mytweak.v1a.preflight_0.2.1~divider1_iphoneos-arm64.deb
          test -s sideplay/mytweak-native-bridgeqa/packages/com.duoface.carplay.nativebridgeqa_0.0.8~divider1_iphoneos-arm64.deb
          test -s sideplay/firstparty-carplay-admission/packages/com.duoface.carplay.firstpartyadmission_0.0.6~sbpair1_iphoneos-arm64.deb
      - name: Compile sign and hash .129 native host + four receiver dylibs
        run: |
          set -euo pipefail
          bash sideplay/duoface-native-scene-host/build.sh
          HOST='sideplay/duoface-native-scene-host/packages/com.duoface.carplay.nativescenehost_0.1.130~sceneowner1_iphoneos-arm64.deb'
          test "$(dpkg-deb -f "$HOST" Version)" = '0.1.130~sceneowner1'
          mkdir -p "$RUNNER_TEMP/qa-host"
          dpkg-deb -x "$HOST" "$RUNNER_TEMP/qa-host"
          for name in DFTouchOwnerProbe DFCarPlayDockOwner DFNativeMapPaneCoordinator DFYouTubeOrientationRelay; do
            D="$RUNNER_TEMP/qa-host/var/jb/Library/MobileSubstrate/DynamicLibraries/$name.dylib"
            test -s "$D"
            ldid -e "$D" >/dev/null
          done
          SHA="$(shasum -a 256 "$HOST" | awk '{print $1}')"
          echo "NATIVEHOST_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Record signed native host Mach-O UUIDs
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/QA130_MACHO_UUIDS.txt"
          for name in DFTouchOwnerProbe DFCarPlayDockOwner DFNativeMapPaneCoordinator DFYouTubeOrientationRelay; do
            D="$RUNNER_TEMP/qa-host/var/jb/Library/MobileSubstrate/DynamicLibraries/$name.dylib"
            xcrun dwarfdump --uuid "$D" | tee -a "$OUT"
          done
          test -s "$OUT"
      - name: Produce one immutable independent signed rootless .129 QA package
        run: |
          set -euo pipefail
          python3 sideplay/jb-embedded-appbridge/package_integrated.py --build \
             --expected-nativehost-sha256 "$NATIVEHOST_SHA" \
             --expected-source-sha "$GITHUB_SHA"
          OUT='sideplay/jb-embedded-appbridge/packages/com.duoface.jb.embedded_0.0.130~sceneowner1_iphoneos-arm64.deb'
          test -s "$OUT"
          test "$(dpkg-deb -f "$OUT" Version)" = '0.0.130~sceneowner1'
          test "$(dpkg-deb -f "$OUT" Package)" = 'com.duoface.jb.embedded'
          test "$(dpkg-deb -f "$OUT" Architecture)" = iphoneos-arm64
          mkdir -p "$RUNNER_TEMP/qa-integrated"
          dpkg-deb -x "$OUT" "$RUNNER_TEMP/qa-integrated"
          for name in DFTouchOwnerProbe DFCarPlayDockOwner DFNativeMapPaneCoordinator DFYouTubeOrientationRelay; do
            ldid -e "$RUNNER_TEMP/qa-integrated/var/jb/Library/MobileSubstrate/DynamicLibraries/$name.dylib" >/dev/null
          done
          shasum -a 256 "$OUT"
          echo "QA_OUTPUT=$OUT" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        id: qa
        with:
          name: DuoFace-129-Native-Owner-Source-Signed-Staging-QA
          path: sideplay/jb-embedded-appbridge/packages/com.duoface.jb.embedded_0.0.130~sceneowner1_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Archive signed QA130 bytes and provenance in DuoFace repo (not Sileo)
        env:
          QA_ARTIFACT: ${{ steps.qa.outputs.artifact-id }}
        run: |
          set -euo pipefail
          BRANCH='fix/duoface-qa130-verified-scene-owner-20261030'
          SRC="$QA_OUTPUT"
          NAME='com.duoface.jb.embedded_0.0.130~sceneowner1_iphoneos-arm64.deb'
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$BRANCH"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            DEST="$TEMP/sideplay/jb-embedded-appbridge/evidence/runs/$GITHUB_RUN_ID"
            mkdir -p "$DEST"
            cp "$SRC" "$DEST/$NAME"
            ( cd "$DEST" && shasum -a 256 "$NAME" > SHA256SUMS.txt && shasum -a 256 -c SHA256SUMS.txt )
            cp sideplay/jb-embedded-appbridge/packages/PACKAGING_PROVENANCE.json "$DEST/"
            cp "$RUNNER_TEMP/QA130_MACHO_UUIDS.txt" "$DEST/"
            printf 'BUILD=success\nSIGNED=true\nDEVICE_QA=false\nSILEO_PUBLISHED=false\nREAL_PLAY_NOT_VERIFIED=true\nSOURCE_SHA=%s\nRUN_ID=%s\nARTIFACT_ID=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$QA_ARTIFACT" > "$DEST/CI_RESULT.txt"
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$TEMP" add "sideplay/jb-embedded-appbridge/evidence/runs/$GITHUB_RUN_ID/"
            git -C "$TEMP" commit -m 'qa130: archive signed native scene destroy and exact owner staging DEB [skip ci]'
            if git -C "$TEMP" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$TEMP"
              echo SIGNED_PANE_TRACE_QA_PERSISTED
              exit 0
            fi
            git worktree remove --force "$TEMP"
          done
          exit 1
