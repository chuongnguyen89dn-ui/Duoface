name: DuoFace 106 Sileo public SHA VERIFIED — preserve existing handoff
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - '.github/workflows/duoface-106-public-sileo-handoff.yml'
      - 'sideplay/audit/duoface-sileo-106/PUBLIC_RELEASE_20261029.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-106-public-sileo-handoff
  cancel-in-progress: false
jobs:
  verify-and-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify PUBLISHED exact one Sileo record, public DEB SHA and old rollback binary
        run: |
          set -euo pipefail
          SITE='https://chuongnguyen89dn-ui.github.io/carplaydsp'
          F='com.duoface.jb.embedded_0.0.106~duodash-disc10s1_iphoneos-arm64.deb'
          SHA='3ce04db501b6f657bb3dac4eb62610787008aab741112af7929b16b6cec8aa48'
          curl -fLsS --retry 3 "$SITE/Packages" -o "$RUNNER_TEMP/Packages"
          curl -fLsS --retry 3 "$SITE/Release" -o "$RUNNER_TEMP/Release"
          grep -Fq 'SHA256:' "$RUNNER_TEMP/Release"
          FILE="$F" SHA="$SHA" python3 - <<'PY'
          from pathlib import Path
          import os
          text=Path(os.environ['RUNNER_TEMP'],'Packages').read_text()
          records=[]
          for raw in text.split('\n\n'):
             r={}
             for line in raw.splitlines():
                 if ': ' in line and not line.startswith(' '):
                     k,v=line.split(': ',1);r[k]=v
             if r.get('Package')=='com.duoface.jb.embedded':records.append(r)
          assert len(records)==1,records
          p=records[0]
          assert p['Version']=='0.0.106~duodash-disc10s1'
          assert p['Filename']=='debs/'+os.environ['FILE']
          assert p['SHA256']==os.environ['SHA']
          assert p['Architecture']=='iphoneos-arm64'
          assert p['Name']=='DuoFace Independent (Integrated CarPlay Beta)'
          print('DUOFACE_106_PUBLIC_ONE_APT_RECORD_EXACT_SHA_PASS')
          PY
          curl -fLsS --retry 3 "$SITE/debs/$F" -o "$RUNNER_TEMP/public.deb"
          printf '%s  %s\n' "$SHA" "$RUNNER_TEMP/public.deb" | sha256sum -c -
          test "$(dpkg-deb -f "$RUNNER_TEMP/public.deb" Package)" = com.duoface.jb.embedded
          test "$(dpkg-deb -f "$RUNNER_TEMP/public.deb" Version)" = '0.0.106~duodash-disc10s1'
          test "$(dpkg-deb -f "$RUNNER_TEMP/public.deb" Architecture)" = iphoneos-arm64
          echo DUOFACE_106_PUBLIC_DEB_SHA256_METADATA_VERIFIED
          for pair in '0.0.92~logo3s1 1f4a495f8b9ba91f71bac4c7abc4e064878fb8f2edd5272df3d48fef3a95e1f0' '0.0.90~nativegetters1 c9a6c8f624ce3224ec5cdc7aee9c3280306068c99c9842d4b4f802914c560f27'; do
            VER="${pair%% *}"
            HASH="${pair##* }"
            NAME="com.duoface.jb.embedded_${VER}_iphoneos-arm64.deb"
            curl -fLsS --retry 3 "$SITE/debs/$NAME" -o "$RUNNER_TEMP/$NAME"
            printf '%s  %s\n' "$HASH" "$RUNNER_TEMP/$NAME" | sha256sum -c -
          done
          echo DUOFACE_106_092_090_ROLLBACK_SHA_VERIFIED
      - name: Read current handoff, prepend final release checkpoint, and verify GitHub push
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-jb-embedded-appbridge-20261020'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "$BRANCH"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            python3 - "$TEMP/sideplay/tiep tuc du an.md" "$TEMP/sideplay/audit/duoface-sileo-106/PUBLIC_RELEASE_20261029.md" "$GITHUB_RUN_ID" <<'PY'
          from pathlib import Path
          import sys
          p,report=map(Path,sys.argv[1:3])
          run=sys.argv[3]
          assert p.is_file() and report.is_file()
          raw=report.read_text(encoding='utf8')
          assert 'PUBLIC SILEO VERIFIED' in raw
          assert '40809650669' in raw and '3ce04db501b6f657bb3dac4eb62610787008aab741112af7929b16b6cec8aa48' in raw
          marker='## CHECKPOINT 2026-10-29 DuoFace .106 PUBLIC SILEO VERIFIED'
          old=p.read_text(encoding='utf8')
          block=f"""{marker}
          
          - User explicitly authorized Sileo publication. Signed one-DEB .106 archive: sideplay/jb-embedded-appbridge/evidence/runs/40809319208/, source 98d793faf6867cb23fea6714c3d434325cb17663, archive commit 98061a8fea8888a1efc9dafecdd96289c279d310, SHA256 3ce04db501b6f657bb3dac4eb62610787008aab741112af7929b16b6cec8aa48.
          - Published same existing Sileo APT package com.duoface.jb.embedded, version 0.0.106~duodash-disc10s1, rootless iphoneos-arm64. Sileo source https://chuongnguyen89dn-ui.github.io/carplaydsp/. Direct public https://chuongnguyen89dn-ui.github.io/carplaydsp/debs/com.duoface.jb.embedded_0.0.106~duodash-disc10s1_iphoneos-arm64.deb.
          - Publisher carplaydsp/main commit 4fe98c37e5ec06a927cd1006981fb30abab892fd; GitHub Actions run 40809650669 build/deploy/verify-duoface-integrated-pages/verify-qa11-pages all SUCCESS, actionlint 40809650653 SUCCESS. Remote Packages single 0.0.106 APT record and public DEB SHA matched in publisher and this handoff action {run}. Previous .90/.92 publicly retained hash-identical.
          - Full evidence: sideplay/audit/duoface-sileo-106/PUBLIC_RELEASE_20261029.md, and GitHub run https://github.com/chuongnguyen89dn-ui/Duoface/actions/runs/{run}. No physical phone install or actual CarPlay 10s process exit/audio validation, no claim of tested Maps/Siri. Default disconnect auto-close OFF; no forced phone restart. Next user QA: refresh Sileo, install when parked, enable only if desired, unplug and test reconnect before 10s / foreground phone audio/YouTube scene, export DuoFaceDisconnectClose.log. If errors, rollback .90 or .92 from archived signed bytes; do not install via Filza.
          
          ---
          
          """
          if marker not in old:
             p.write_text(block+old,encoding='utf8')
             assert p.read_text(encoding='utf8').startswith(block)
             print('DUOFACE_106_PUBLIC_HANDOFF_READBACK_VERIFIED')
          else:
             print('DUOFACE_106_PUBLIC_HANDOFF_ALREADY_PRESENT')
          PY
            git -C "$TEMP" add 'sideplay/tiep tuc du an.md'
            if git -C "$TEMP" diff --cached --quiet; then
               git worktree remove --force "$TEMP"
               echo 'DUOFACE_106_PUBLIC_HANDOFF_IDEMPOTENT'
               exit 0
            fi
            git -C "$TEMP" commit -m 'handoff: publicly verified DuoFace 106 one-DEB Sileo SHA [skip ci]'
            if git -C "$TEMP" push origin "HEAD:refs/heads/$BRANCH"; then
               git worktree remove --force "$TEMP"
               echo 'DUOFACE_106_PUBLIC_HANDOFF_GITHUB_PUSH_CONFIRMED'
               exit 0
            fi
            git worktree remove --force "$TEMP"
          done
          exit 1
