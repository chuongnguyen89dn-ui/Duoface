name: DuoFace fullscreen test DEB
on:
  workflow_dispatch:
  push:
    paths:
      - runtime/DuoFaceFullscreenBridge.xm
      - 'runtime/fullscreen/**'
      - Makefile.fullscreen
      - DuoFaceFullscreenBridge.plist
      - .github/workflows/fullscreen-test-deb.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Install signing and packaging tools
        run: |
          brew install ldid dpkg
          command -v ldid
          command -v dpkg-deb
      - name: Compile bridge
        run: |
          cp Makefile.fullscreen Makefile
          make clean all FINALPACKAGE=1
          find .theos -type f -name 'DuoFaceFullscreenBridge.dylib' -print
      - name: Package on original v12
        shell: bash
        run: |
          set -euo pipefail
          BASE='dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb'
          test -s "$BASE"
          mkdir -p "$RUNNER_TEMP/duoface-test"
          dpkg-deb -R "$BASE" "$RUNNER_TEMP/duoface-test"
          DYLIB="$(find .theos -type f -name 'DuoFaceFullscreenBridge.dylib' | head -n 1)"
          test -s "$DYLIB"
          DST="$RUNNER_TEMP/duoface-test/var/jb/Library/MobileSubstrate/DynamicLibraries"
          install -m 755 "$DYLIB" "$DST/DuoFaceFullscreenBridge.dylib"
          python3 -c 'import os,plistlib,re; from pathlib import Path; base=Path(os.environ["RUNNER_TEMP"])/"duoface-test"; dst=base/"var/jb/Library/MobileSubstrate/DynamicLibraries"; src=Path("DuoFaceFullscreenBridge.plist"); (dst/"DuoFaceFullscreenBridge.plist").write_bytes(plistlib.dumps(plistlib.loads(src.read_bytes()))); ctrl=base/"DEBIAN/control"; ctrl.write_text(re.sub(r"(?m)^Version:.*$", "Version: 1.0.3-12+menu-zoom1", ctrl.read_text()))'
          mkdir -p artifacts
          dpkg-deb --build "$RUNNER_TEMP/duoface-test" artifacts/com.duonavi.app_1.0.3-12_menu-zoom1_iphoneos-arm64.deb
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          base = Path(os.environ["RUNNER_TEMP"]) / "duoface-test"
          p = base / "var/jb/Library/MobileSubstrate/DynamicLibraries/DuoFaceFullscreenBridge.plist"
          print("ACTUAL BRIDGE FILTER:", plistlib.loads(p.read_bytes()))
          PY
          dpkg-deb -c artifacts/*.deb | grep -E 'DuoFaceFullscreenBridge|DuoFaceDashboard.dylib'
          shasum -a 256 artifacts/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: duoface-menu-zoom1
          path: artifacts/*.deb

      - name: Persist candidate DEB in DuoFace repository (not Sileo)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/candidates/menu-zoom1
          cp artifacts/*.deb dist/candidates/menu-zoom1/
          shasum -a 256 dist/candidates/menu-zoom1/*.deb > dist/candidates/menu-zoom1/SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/candidates/menu-zoom1/
          git commit -m "artifact: retain fullscreen adapter candidate DEB [skip ci]"
          # A checkpoint can advance main while the DEB is compiling.
          # Keep the artifact commit and replay it onto the latest branch.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not persist candidate after three push attempts" >&2
          exit 1
