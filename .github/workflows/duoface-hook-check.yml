name: Compile current DuoFace visual hook
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-hook:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and sign current ARM64 hook
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$SDK"
          mkdir -p dist/current-hook
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -fno-objc-arc -fblocks -Wall -Wextra -Werror -fsyntax-only src/DuoFaceVisualHook.m
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -fno-objc-arc -fblocks -dynamiclib \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -Wl,-install_name,@rpath/DuoFaceVisualHook.dylib \
            -o dist/current-hook/DuoFaceVisualHook.dylib src/DuoFaceVisualHook.m
          ldid -S dist/current-hook/DuoFaceVisualHook.dylib
          ldid -e dist/current-hook/DuoFaceVisualHook.dylib > dist/current-hook/entitlements.plist
          file dist/current-hook/DuoFaceVisualHook.dylib
          xcrun lipo -verify_arch arm64 dist/current-hook/DuoFaceVisualHook.dylib
          shasum -a 256 src/DuoFaceVisualHook.m dist/current-hook/DuoFaceVisualHook.dylib > dist/current-hook/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > dist/current-hook/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: duoface-current-hook-${{ github.sha }}
          path: dist/current-hook/
          if-no-files-found: error
