name: Passive native Dock ABI observer compile only
on:
  push:
    branches: [feature/duoface-qa146-native-home-exit-20261031]
    paths:
      - 'sideplay/duonavi-observer/NativeDockABI.h'
      - 'sideplay/duonavi-observer/analyze_native_dock.py'
      - 'sideplay/duonavi-observer/tests/test_native_dock_capture.py'
      - '.github/workflows/duoface-native-dock-passive-abi-compile.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: passive-native-dock-abi-compile
  cancel-in-progress: false
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read-only contracts and evidence parser tests
        run: |
          set -euo pipefail
          python3 sideplay/duonavi-observer/tests/test_passive.py
          python3 sideplay/duonavi-observer/tests/test_native_dock_capture.py
      - name: Compile observer with actual iPhoneOS SDK without package or release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dock-evidence"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -fobjc-arc -fblocks -O2 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c sideplay/duonavi-observer/Observer.m -o "$RUNNER_TEMP/NativeDockObserver.o" \
            2>&1 | tee "$RUNNER_TEMP/dock-evidence/COMPILE.log"
          test -s "$RUNNER_TEMP/NativeDockObserver.o"
          printf 'RUN=%s\nSOURCE_SHA=%s\nIPHONEOS_COMPILE=success\nSIGNED=false\nDEB_BUILT=false\nSILEO_PUBLISHED=false\nDEVICE_CAPTURE=false\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$RUNNER_TEMP/dock-evidence/CI_RESULT.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passive-native-dock-abi-compile-evidence
          path: ${{ runner.temp }}/dock-evidence/
      - name: Persist compile evidence in project repository
        run: |
          set -euo pipefail
          B=feature/duoface-qa146-native-home-exit-20261031
          P="sideplay/duonavi-observer/evidence/native-dock-abi/$GITHUB_RUN_ID"
          git fetch origin "$B"
          git checkout -B capture-evidence FETCH_HEAD
          mkdir -p "$P"
          cp "$RUNNER_TEMP/dock-evidence/"* "$P/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$P"
          git commit -m 'evidence: iPhoneOS native Dock metadata observer compile, no release [skip ci]'
          git push origin "HEAD:refs/heads/$B"
