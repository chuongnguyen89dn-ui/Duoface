name: QA146 deep original integrated AppBridge vs fake CarBridge NO BUILD
on:
  push:
    branches: [feature/duoface-qa146-native-home-exit-20261031]
    paths:
      - 'sideplay/audit/qa146-native-home-dock-parity-20261031/scan_original_integrated_carbridge_deep.py'
      - '.github/workflows/duoface-qa146-integrated-carbridge-original-deb-deep.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-qa146-deep-original-appbridge-deb
  cancel-in-progress: false
jobs:
  static-exact-deb-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: SHA verify and actually read three mandatory central skill ZIPs
        shell: bash
        run: |
          set -euo pipefail
          for row in \
            '01-github-continuity.zip 80efec9a6cbbb49135eabeafb339bf13f74ff6ddef9706659871b30a2c020d7e' \
            '02-ios-deb-ipa-carplay.zip c87b5ed9ef196c13f42dd41df49a032369028742cc8f6d56569637daf76ec7cf' \
            '05-research-debug-testing.zip fcb1122412a11664c2c6b8666cbc4f76e86ad20f96e697138d96c6425137dc98'; do
            read -r name hash <<< "$row"
            curl -fLsS --retry 3 "https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills/$name" -o "$RUNNER_TEMP/$name"
            printf '%s  %s\n' "$hash" "$RUNNER_TEMP/$name" | sha256sum -c -
            unzip -t "$RUNNER_TEMP/$name" >/dev/null
            unzip -p "$RUNNER_TEMP/$name" SKILL.md | head -30
          done
          python3 -m pip install --quiet --break-system-packages capstone==5.0.7
          mkdir -p "$RUNNER_TEMP/parser"
          git fetch --no-tags --depth 1 origin feature/visual12-duodash-recovery
          git show FETCH_HEAD:migration/full_payload/native_test/audit_native12_license_class_xrefs.py > "$RUNNER_TEMP/parser/audit_native12_license_class_xrefs.py"
          python3 -m py_compile sideplay/audit/qa146-native-home-dock-parity-20261031/scan_original_integrated_carbridge_deep.py
      - name: Retrieve original SHA-locked DuoNavi and derived Native12 DEBs; no install or unpack into deployed environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs"
          cp dist/com.duonavi.app_1.0.4_iphoneos-arm64.deb "$RUNNER_TEMP/debs/duonavi.deb"
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/1286a3ef868cf7e29804bcddf7e20b2eae707ce1/dist/payload-migration/native12-speed8compact/com.duoface.independent_0.1.0~native12+speed8compact_iphoneos-arm64.deb' -o "$RUNNER_TEMP/debs/native12_derived.deb"
          printf '%s  %s\n' \
            f3f911de5db461d487ce91249aed1bb25d44f076e7ff5fb89e54b658569328dd "$RUNNER_TEMP/debs/duonavi.deb" \
            2fe8892c5ef8762e1e83b0fd6c4a029e25fc11758cc98fdbbb851bf6637e68ad "$RUNNER_TEMP/debs/native12_derived.deb" | sha256sum -c -
          dpkg-deb -f "$RUNNER_TEMP/debs/duonavi.deb" Package Provides Conflicts Replaces
      - name: Trace full original app bridge methods, native home+Dock ownership and app side process filters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-deep"
          PYTHONPATH="$RUNNER_TEMP/parser:sideplay/audit/carplay-home-icons-20261030" \
          python3 sideplay/audit/qa146-native-home-dock-parity-20261031/scan_original_integrated_carbridge_deep.py \
            --duonavi "$RUNNER_TEMP/debs/duonavi.deb" \
            --native12_derived "$RUNNER_TEMP/debs/native12_derived.deb" \
            --out "$RUNNER_TEMP/bridge-deep/ORIGINAL_DUONAVI_NATIVE12_APPBRIDGE_IMP_DEEP.json"
          python3 - "$RUNNER_TEMP/bridge-deep/ORIGINAL_DUONAVI_NATIVE12_APPBRIDGE_IMP_DEEP.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert len(x["original_bridges"])==2
          for label,source in x["original_bridges"].items():
            assert source["injection_filters"]
            assert source["methods"]["CBBridgeManagerDashboard"]
            print("DEEP_ORIGINAL_SOURCE_CONFIRMED",label,source["macho_sha256"],
                  "classCount",len(source["methods"]))
          print("ORIGINAL_DEB_BRIDGE_LIFECYCLE_AND_INJECT_FILTERS_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: QA146-original-DuoNavi-Native12-bridge-lifecycle-app-eligibility-readonly
          path: ${{ runner.temp }}/bridge-deep/ORIGINAL_DUONAVI_NATIVE12_APPBRIDGE_IMP_DEEP.json
          if-no-files-found: error
      - name: Archive findings to actual DuoFace repo (no vendor binaries), read back
        shell: bash
        run: |
          set -euo pipefail
          B=feature/duoface-qa146-native-home-exit-20261031
          REL="sideplay/audit/qa146-native-home-dock-parity-20261031/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$B"
            T="$(mktemp -d)"
            git worktree add --detach "$T" FETCH_HEAD
            mkdir -p "$T/$REL"
            cp "$RUNNER_TEMP/bridge-deep/ORIGINAL_DUONAVI_NATIVE12_APPBRIDGE_IMP_DEEP.json" "$T/$REL/"
            printf 'RUN=%s\nSOURCE_SHA=%s\nSKILL_ZIPS_SHA_CHECKED_READ=true\nORIGINAL_DUONAVI_SHA_CHECKED=true\nORIGINAL_NATIVE12_DERIVED_SHA_CHECKED=true\nCARBRIDGE_OFFICIAL_DEB_NOT_PRESENT=true\nNO_VENDOR_BINARY_COPIED=true\nNO_LICENSE_SOURCE_EXTRACTED=true\nNO_NEW_SILEO_OR_DEVICE_TEST=true\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$T/$REL/CI_RESULT.txt"
            git -C "$T" config user.name 'github-actions[bot]'
            git -C "$T" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$T" add "$REL"
            git -C "$T" commit -m 'audit(qa146): immutable original AppBridge Dock native ownership deep scan [skip ci]'
            if git -C "$T" push origin "HEAD:refs/heads/$B"; then
              git worktree remove --force "$T"
              git fetch --no-tags origin "$B"
              git cat-file -e "FETCH_HEAD:$REL/ORIGINAL_DUONAVI_NATIVE12_APPBRIDGE_IMP_DEEP.json"
              echo QA146_ORIGINAL_APPBRIDGE_DEEP_ARCHIVED_VERIFIED
              exit 0
            fi
            git worktree remove --force "$T"
          done
          exit 1
