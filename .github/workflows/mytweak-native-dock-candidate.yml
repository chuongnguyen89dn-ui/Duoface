name: DuoFace MyTweak native Apple AppDock candidate build (no publish)
on:
  push:
    branches: [feature/mytweak-native-appdock-20261019]
    paths:
      - '.github/workflows/mytweak-native-dock-candidate.yml'
      - 'sideplay/mytweak-independent-v1a/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mytweak-native-dock1
  cancel-in-progress: true
jobs:
  compile-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source test and contract
        run: |
          set -euo pipefail
          cd sideplay/mytweak-independent-v1a
          python3 -m unittest discover -s tests -v
          grep -Fq 'DFV1APreflight_FILES = V1ATweak.x MTPreflight.m MTTrialLog.m' Makefile
          grep -Fq 'MTNativeDockProbe.m MTDockLayout.m' Makefile || grep -Fq 'MTDockLayout.m MTNativeDockProbe.m' Makefile
          grep -Fq '<string>CarPlay</string>' DFV1APreflight.plist
          grep -Fq 'Version: 0.2.1~dock1' control
      - name: Install Theos iOS 16 rootless
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          brew install ldid dpkg
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build one combined DEB and inspect exact payload
        run: |
          set -euo pipefail
          cd sideplay/mytweak-independent-v1a
          make clean package FINALPACKAGE=1
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          PKG="${debs[0]}"
          test "$(dpkg-deb -f "$PKG" Package)" = 'com.duoface.mytweak.v1a.preflight'
          test "$(dpkg-deb -f "$PKG" Version)" = '0.2.1~dock1'
          test "$(dpkg-deb -f "$PKG" Architecture)" = 'iphoneos-arm64'
          ! dpkg-deb -f "$PKG" | grep -E '^(Conflicts|Replaces|Breaks):'
          dpkg-deb -c "$PKG" > /tmp/mytweak-dock-files.txt
          grep -F '/DFV1APreflight.dylib' /tmp/mytweak-dock-files.txt
          grep -F '/DFV1APreflight.plist' /tmp/mytweak-dock-files.txt
          ! grep -Ei '/(SidePlay|DuoFaceDashboard|DuoDash|Airaw|MyTweak)\.dylib' /tmp/mytweak-dock-files.txt
          mkdir -p /tmp/mytweak-dock-extract
          dpkg-deb -x "$PKG" /tmp/mytweak-dock-extract
          test "$(find /tmp/mytweak-dock-extract -type f | wc -l | tr -d ' ')" = 2
          DEST="$GITHUB_WORKSPACE/sideplay/test-artifacts/mytweak-native-dock1"
          mkdir -p "$DEST"
          cp "$PKG" "$DEST/"
          cp /tmp/mytweak-dock-files.txt "$DEST/FILE_LIST.txt"
          (cd "$DEST" && shasum -a 256 "$(basename "$PKG")" > SHA256SUMS)
          {
            echo MYTWEAK_NATIVE_DOCK_CANDIDATE_BUILD=PASS
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "TESTED_SHA=$GITHUB_SHA"
            echo "UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "PACKAGE=$(basename "$PKG")"
            echo "BYTES=$(wc -c < "$PKG" | tr -d ' ')"
            echo TEST_SCOPE=static,compiler,package-layout
            echo DEVICE_TESTED=false
            echo APP_PIXELS_VERIFIED=false
            echo SILEO_PUBLISHED=false
            echo HOST_DEFAULT_ENABLED=false
            echo QA11_NATIVE12_HUD8_UNCHANGED=true
            echo NATIVE_APPDOCK_DEVICE_TESTED=false
            echo NATIVE_APPDOCK_ACTUALLY_VISIBLE=false
            echo NATIVE_DOCK_SOURCE=CarPlay_DB_DockWindow
            echo DOCK_MOCK_RENDERING=false
          } > "$DEST/CI_RESULT.txt"
          echo MYTWEAK_NATIVE_DOCK_CANDIDATE_DEB_BUILD_AND_INSPECT_PASS
      - name: Upload GitHub Actions artifact (not Sileo)
        uses: actions/upload-artifact@v4
        with:
          name: mytweak-native-dock1-${{ github.run_id }}
          path: sideplay/test-artifacts/mytweak-native-dock1/
          if-no-files-found: error
      - name: Save DEB SHA and build result to DuoFace
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sideplay/test-artifacts/mytweak-native-dock1/
          git commit -m 'artifacts(mytweak): persist v1bc combined DEB and SHA256 [skip ci]'
          BRANCH='feature/mytweak-native-appdock-20261019'
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              git fetch origin "$BRANCH"
              test "$(git show "origin/$BRANCH:sideplay/test-artifacts/mytweak-native-dock1/CI_RESULT.txt" | grep '^MYTWEAK_NATIVE_DOCK_CANDIDATE_BUILD=')" = 'MYTWEAK_NATIVE_DOCK_CANDIDATE_BUILD=PASS'
              echo MYTWEAK_NATIVE_DOCK_CANDIDATE_GITHUB_PERSISTED
              exit 0
            fi
            sleep 2
          done
          exit 1
