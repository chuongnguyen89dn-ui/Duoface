name: DuoFace native12 Sileo source refresh diagnostics

on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duoface-native12-sileo-refresh-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Reproduce Sileo rootless source refresh requests (no publish)
        shell: bash
        run: |
          set -euo pipefail
          base='https://chuongnguyen89dn-ui.github.io/carplaydsp/'
          mkdir -p evidence
          # Wait for the newly deployed APT metadata, not an old cached Release.
          valid_release=0
          for attempt in $(seq 1 65); do
            curl -fsSL --retry 2 --retry-delay 2 "$base/Release" -o evidence/preflight-Release || true
            if grep -q '^Date:' evidence/preflight-Release 2>/dev/null && grep -q '^SHA256:' evidence/preflight-Release 2>/dev/null; then
              valid_release=1
              break
            fi
            echo "Waiting for corrected Pages Release attempt $attempt"
            sleep 6
          done
          test "$valid_release" = 1
          : > evidence/http-status.tsv
          for name in root Release InRelease Packages Packages.gz Packages.bz2 Packages.xz dists/stable/Release dists/stable/main/binary-iphoneos-arm64/Packages.gz; do
            remote="$name"
            if [ "$name" = root ]; then remote=''; fi
            safe=${name//\//_}
            printf 'PATH=%s\n' "$remote"
            code=$(curl -L -sS --connect-timeout 10 --max-time 40 --retry 3 --retry-delay 2 \
              -A 'Sileo/2.5 (APT; rootless iPhoneOS-arm64)' \
              -D "evidence/headers-$safe.txt" \
              -o "evidence/body-$safe" \
              -w '%{http_code}' "$base$remote" || true)
            printf '%s\t%s\n' "$name" "$code" | tee -a evidence/http-status.tsv
          done
          printf '\nHTTP_PROBE_DONE\n'
          cat evidence/http-status.tsv
          test "$(awk '$1=="Release" {print $2}' evidence/http-status.tsv)" = 200
          test "$(awk '$1=="Packages" {print $2}' evidence/http-status.tsv)" = 200
          test "$(awk '$1=="Packages.gz" {print $2}' evidence/http-status.tsv)" = 200
          test "$(awk '$1=="Packages.bz2" {print $2}' evidence/http-status.tsv)" = 200
          test "$(awk '$1=="Packages.xz" {print $2}' evidence/http-status.tsv)" = 200
          cmp evidence/body-Packages <(gzip -dc evidence/body-Packages.gz)
          cmp evidence/body-Packages <(bzip2 -dc evidence/body-Packages.bz2)
          cmp evidence/body-Packages <(xz -dc evidence/body-Packages.xz)
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('evidence/body-Packages').read_text()
          records=[]
          for block in p.split('\n\n'):
              d={}
              for line in block.splitlines():
                  if ': ' in line and not line.startswith(' '):
                      k,v=line.split(': ',1);d[k]=v
              if d.get('Package')=='com.duoface.independent': records.append(d)
          assert len(records)==1,records
          d=records[0]
          assert d['Version']=='0.1.0~native12',d
          assert d['SHA256']=='85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7',d
          print('NATIVE12_ONLY_APT_INDEX_PASS')
          PY
          python3 - <<'PY'
          import hashlib
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          release=Path('evidence/body-Release').read_text()
          date=next(line.split(': ',1)[1] for line in release.splitlines() if line.startswith('Date: '))
          assert parsedate_to_datetime(date).tzinfo is not None
          names=['Packages', 'Packages.gz', 'Packages.bz2', 'Packages.xz']
          for algo in ('MD5Sum', 'SHA256', 'SHA512'):
              section=release.split(algo+':\n',1)[1].split('\n',1)[0] if False else release.split(algo+':\n',1)[1]
              section=section.split('\n'+('SHA256:' if algo=='MD5Sum' else 'SHA512:' if algo=='SHA256' else 'NO_NEXT_BLOCK:'),1)[0]
              table={}
              for line in section.splitlines():
                  columns=line.split()
                  if len(columns)==3: table[columns[2]]=(columns[0],int(columns[1]))
              assert sorted(table)==sorted(names),(algo,table)
              for name in names:
                  data=Path('evidence/body-'+name).read_bytes()
                  expected=hashlib.new({'MD5Sum':'md5','SHA256':'sha256','SHA512':'sha512'}[algo],data).hexdigest()
                  assert table[name]==(expected,len(data)),(algo,name)
          print('APT_RELEASE_UTC_DATE_AND_ALL_INDEX_SHA256_SHA512_MATCH_PASS')
          PY
          curl -fsSL --retry 4 --retry-delay 3 \
            "$base/debs/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb" \
            -o evidence/actual-native12.deb
          echo '85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7  evidence/actual-native12.deb' | sha256sum -c -
          echo 'SILEO_HTTP_ALL_APT_INDEX_TYPES_AND_NATIVE12_DEB_EXACT_SHA_PASS'
      - name: Check APT client compatibility with Sileo-style flat source
        shell: bash
        run: |
          set -u
          mkdir -p evidence/lists/partial
          printf 'deb [trusted=yes] https://chuongnguyen89dn-ui.github.io/carplaydsp/ ./\n' > evidence/sileo-source.list
          apt-get update \
            -o Dir::Etc::sourcelist="$PWD/evidence/sileo-source.list" \
            -o Dir::Etc::sourceparts=- \
            -o Dir::State::lists="$PWD/evidence/lists" \
            -o APT::Get::List-Cleanup=0 \
            -o Acquire::Retries=2 \
            -o Debug::Acquire::http=true > evidence/apt-refresh.log 2>&1
          rc=$?
          cat evidence/apt-refresh.log | tail -100
          echo "APT_EXIT_CODE=$rc"
          if grep -E "No Hash entry|Invalid 'Date' entry|Hash Sum mismatch|Release file is not valid" evidence/apt-refresh.log; then
            echo 'APT_METADATA_WARNINGS_STILL_PRESENT'
            exit 1
          fi
          if [ "$rc" = 0 ]; then echo 'SILEO_APT_REFRESH_NO_RELEASE_DATE_HASH_WARNINGS_PASS'; fi
          exit "$rc"
      - name: Save evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-native12-sileo-source-diagnostics
          path: evidence/
          if-no-files-found: warn
