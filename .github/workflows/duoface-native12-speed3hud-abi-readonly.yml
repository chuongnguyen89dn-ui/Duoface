name: Native12 DuoFace actual CBWindow ABI before Speed3 HUD activation (READONLY)
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths: ['.github/workflows/duoface-native12-speed3hud-abi-readonly.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-native12:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify class owner and exact selector encodings from pinned native12
        shell: bash
        run: |
          set -euo pipefail
          python3 migration/full_payload/native_test/audit_native12_speedhud_cbwindow_abi.py \
            --deb 'dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb' \
            --out audit/speedbubble/NATIVE12_CBWINDOW_SPEEDHUD_ACTUAL_ABI.json
          grep -Fq 'PINNED_NATIVE12_CBWINDOW_ABI_EXACT_PASS' audit/speedbubble/NATIVE12_CBWINDOW_SPEEDHUD_ACTUAL_ABI.json
      - name: Save read-only evidence in DuoFace repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/speedbubble/NATIVE12_CBWINDOW_SPEEDHUD_ACTUAL_ABI.json
          git diff --cached --quiet && exit 0
          git commit -m 'audit(speedhud): actual Native12 CBWindow method type evidence [skip ci]'
          for i in 1 2 3 4; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
