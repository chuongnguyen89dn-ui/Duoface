name: DuoFace QA143 selected Home icon to first-party scene signed staging
on:
  push:
    branches: [feature/duoface-qa142-home-abi-20261031]
    paths:
      - '.github/workflows/duoface-143-home-scene-bridge-signed-staging.yml'
      - 'sideplay/duoface-native-scene-host/DFHomeLaunch143.m'
      - 'sideplay/duoface-native-scene-host/DFHomeSceneBridge143.m'
      - 'sideplay/duoface-native-scene-host/DFHomeRequestReceiver143.m'
      - 'sideplay/duoface-native-scene-host/DFTouchOwnerProbe.m'
      - 'sideplay/duoface-native-scene-host/DFNative12Chrome.h'
      - 'sideplay/duoface-native-scene-host/build.sh'
      - 'sideplay/duoface-native-scene-host/control'
      - 'sideplay/duoface-native-scene-host/Info.plist'
      - 'sideplay/duoface-native-scene-host/DFNativeDiagnostics.m'
      - 'sideplay/jb-embedded-appbridge/package_integrated.py'
      - 'sideplay/duoface-native-scene-host/tests/test_qa143_home_bridge.py'
      - 'sideplay/jb-embedded-appbridge/tests/test_integrated_package_143.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-qa143-scene-bridge-signed
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Home click to real scene bridge and baseline regression contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa143_home_bridge.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa141_map_layout.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_scoped_bks_132.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_native_owner_contract.py' -v
          python3 -m unittest discover -s sideplay/jb-embedded-appbridge/tests -p 'test_integrated_package_143.py' -v
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation sideplay/duoface-native-scene-host/tests/home_admission_141_forwarding_runtime.m -o "$RUNNER_TEMP/home141"
          "$RUNNER_TEMP/home141"
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/gofa_resize_141.c -o "$RUNNER_TEMP/gofa141"
          "$RUNNER_TEMP/gofa141"
          grep -Fq 'VERSION="0.0.143~homebridge1"' sideplay/jb-embedded-appbridge/package_integrated.py
      - name: Install existing rootless toolchain
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          command -v ldid >/dev/null || brew install ldid
          command -v dpkg-deb >/dev/null || brew install dpkg
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          test -d "$(xcrun --sdk iphoneos --show-sdk-path)"
      - name: Build three unchanged first-party rootless modules
        run: |
          set -euo pipefail
          ( cd sideplay/mytweak-independent-v1a && make clean package FINALPACKAGE=1 )
          ( cd sideplay/mytweak-native-bridgeqa && make clean package FINALPACKAGE=1 )
          ( cd sideplay/firstparty-carplay-admission && make clean package FINALPACKAGE=1 )
      - name: Build and verify signed QA143 native Home bridge
        run: |
          set -euo pipefail
          bash sideplay/duoface-native-scene-host/build.sh
          HOST='sideplay/duoface-native-scene-host/packages/com.duoface.carplay.nativescenehost_0.1.143~homebridge1_iphoneos-arm64.deb'
          test -s "$HOST"
          test "$(dpkg-deb -f "$HOST" Version)" = '0.1.143~homebridge1'
          grep -Fq '<key>CFBundleVersion</key><string>143</string>' sideplay/duoface-native-scene-host/Info.plist
          mkdir -p "$RUNNER_TEMP/native"
          dpkg-deb -x "$HOST" "$RUNNER_TEMP/native"
          for name in DFTouchOwnerProbe DFCarPlayDockOwner DFNativeMapPaneCoordinator DFYouTubeOrientationRelay DFGofaMapResize141; do
            ldid -e "$RUNNER_TEMP/native/var/jb/Library/MobileSubstrate/DynamicLibraries/$name.dylib" >/dev/null
          done
          xcrun dwarfdump --uuid "$RUNNER_TEMP/native/var/jb/Library/MobileSubstrate/DynamicLibraries/DFCarPlayDockOwner.dylib" > "$RUNNER_TEMP/QA143_UUIDS.txt"
          echo "NATIVEHOST_SHA=$(shasum -a 256 "$HOST" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Merge and verify exact signed rootless QA143 DEB
        run: |
          set -euo pipefail
          python3 sideplay/jb-embedded-appbridge/package_integrated.py --build --expected-nativehost-sha256 "$NATIVEHOST_SHA" --expected-source-sha "$GITHUB_SHA"
          OUT='sideplay/jb-embedded-appbridge/packages/com.duoface.jb.embedded_0.0.143~homebridge1_iphoneos-arm64.deb'
          test -s "$OUT"
          test "$(dpkg-deb -f "$OUT" Version)" = '0.0.143~homebridge1'
          test "$(dpkg-deb -f "$OUT" Package)" = 'com.duoface.jb.embedded'
          test "$(dpkg-deb -f "$OUT" Architecture)" = 'iphoneos-arm64'
          mkdir -p "$RUNNER_TEMP/merged"
          dpkg-deb -x "$OUT" "$RUNNER_TEMP/merged"
          for name in DFTouchOwnerProbe DFCarPlayDockOwner DFNativeMapPaneCoordinator DFYouTubeOrientationRelay DFGofaMapResize141; do
            ldid -e "$RUNNER_TEMP/merged/var/jb/Library/MobileSubstrate/DynamicLibraries/$name.dylib" >/dev/null
          done
          echo "QA_OUTPUT=$OUT" >> "$GITHUB_ENV"
          shasum -a 256 "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: DuoFace-QA143-Home-ABI-Signed-Rootless
          path: sideplay/jb-embedded-appbridge/packages/com.duoface.jb.embedded_0.0.143~homebridge1_iphoneos-arm64.deb
          if-no-files-found: error
      - name: Store immutable signed artifact and receipt in DuoFace repository
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-qa142-home-abi-20261031'
          NAME='com.duoface.jb.embedded_0.0.143~homebridge1_iphoneos-arm64.deb'
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$BRANCH"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            DEST="$TEMP/sideplay/jb-embedded-appbridge/evidence/runs/$GITHUB_RUN_ID"
            mkdir -p "$DEST"
            cp "$QA_OUTPUT" "$DEST/$NAME"
            ( cd "$DEST" && shasum -a 256 "$NAME" > SHA256SUMS.txt && shasum -a 256 -c SHA256SUMS.txt )
            cp sideplay/jb-embedded-appbridge/packages/PACKAGING_PROVENANCE.json "$DEST/"
            cp "$RUNNER_TEMP/QA143_UUIDS.txt" "$DEST/"
            printf 'BUILD=success\nSIGNED=true\nSOURCE_SHA=%s\nRUN_ID=%s\nDEVICE_HOME_TAP_TESTED=false\nSILEO_PUBLISHED=false\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$DEST/CI_RESULT.txt"
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$TEMP" add "sideplay/jb-embedded-appbridge/evidence/runs/$GITHUB_RUN_ID/"
            git -C "$TEMP" commit -m 'qa143: archive signed Home ABI rootless package and provenance [skip ci]'
            if git -C "$TEMP" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$TEMP"
              echo QA143_SIGNED_SOURCE_ARTIFACT_GITHUB_VERIFIED
              exit 0
            fi
            git worktree remove --force "$TEMP"
          done
          exit 1
