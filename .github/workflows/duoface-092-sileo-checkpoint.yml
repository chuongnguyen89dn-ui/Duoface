name: DuoFace .92 record exact published Sileo checkpoint in existing project handoff
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - 'sideplay/jb-embedded-appbridge/evidence/092-SILEO-RELEASE.md'
permissions:
  contents: write
concurrency:
  group: duoface-092-sileo-checkpoint
  cancel-in-progress: false
jobs:
  save-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed .92 archive and prepend release evidence to the existing handoff
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path('sideplay/tiep tuc du an.md')
          if not path.is_file():
              raise RuntimeError('existing handoff missing, refusing duplicate')
          folder=Path('sideplay/jb-embedded-appbridge/evidence/runs/40707934981')
          binary=folder/'com.duoface.jb.embedded_0.0.92~logo3s1_iphoneos-arm64.deb'
          expected='1f4a495f8b9ba91f71bac4c7abc4e064878fb8f2edd5272df3d48fef3a95e1f0'
          assert binary.is_file()
          assert hashlib.sha256(binary.read_bytes()).hexdigest()==expected
          assert folder.joinpath('SHA256SUMS.txt').read_text().startswith(expected+'  '+binary.name)
          assert folder.joinpath('BUILD_SOURCE.txt').read_text().startswith('SOURCE_SHA=a31eb5f6f89eb34a0faff3346c354b3125b365cb')
          before=path.read_text(encoding='utf-8')
          marker="## CHECKPOINT 2026-10-28 DuoFace .92 LIVE SILEO SHA-VERIFIED"
          checkpoint="## CHECKPOINT 2026-10-28 DuoFace .92 LIVE SILEO SHA-VERIFIED\n\n- **REQUEST COMPLETED THROUGH PUBLIC DELIVERY**: user ordered integrate audited Native12 three-second logo into one DEB. Source pin `a31eb5f6f89eb34a0faff3346c354b3125b365cb`, rootless CI `40707934981` SUCCESS; archived QA commit `a6bf5f9189c76d2f125316f462bcf04ca70b2bfc`, full source/binary record `sideplay/jb-embedded-appbridge/evidence/092-SILEO-RELEASE.md` and `evidence/runs/40707934981/`.\n- **SIGNED PACKAGE**: `com.duoface.jb.embedded_0.0.92~logo3s1_iphoneos-arm64.deb` SHA256 `1f4a495f8b9ba91f71bac4c7abc4e064878fb8f2edd5272df3d48fef3a95e1f0`. Nativehost `0.1.101~logo3s1`. Regressions / YouTube ABI + hold C behavior + four-module macOS rootless build/package PASS. Preserve YouTube rotation .90, native Dock, native Maps experiment unchanged; no vendor binary/license.\n- **SILEO PUBLIC VERIFIED**: publisher `chuongnguyen89dn-ui/carplaydsp` commit `74cc19440ed0292f4cd2d1d23c1a17fef01c3f1e`, workflow `40708684634` completed SUCCESS at 2026-10-28T14:47:28Z; exact public APT one entry, downloaded binary SHA match, .90 rollback file SHA verified. YAML `40708684682` PASS. Sileo source `https://chuongnguyen89dn-ui.github.io/carplaydsp/`, public package `https://chuongnguyen89dn-ui.github.io/carplaydsp/debs/com.duoface.jb.embedded_0.0.92~logo3s1_iphoneos-arm64.deb`.\n- **DEVICE NOT VERIFIED**: no install or physical test claimed; native map rendering and touch still pending. Next: parked-car Sileo .92 update, confirm logo long-hold/move vs ratio divider, logo tap, split/SOLO, system Dock, YouTube audio/video orientation and optional native Maps continuous route. Record screenshots/logs; rollback .90 on crash. No auto-respring/Filza.\n\n---\n\n"
          if marker in before:
              print('DUOFACE_092_SILEO_CHECKPOINT_ALREADY_PRESENT')
          else:
              path.write_text(checkpoint+before,encoding='utf-8')
              after=path.read_text(encoding='utf-8')
              assert after.startswith(checkpoint) and after.endswith(before)
              print('DUOFACE_092_SILEO_CHECKPOINT_READBACK_VERIFIED')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'sideplay/tiep tuc du an.md'
          if ! git diff --cached --quiet; then
            git commit -m 'handoff: record DuoFace .92 public Sileo verified SHA and device QA gate [skip ci]'
            git push origin HEAD:refs/heads/feature/duoface-jb-embedded-appbridge-20261020
          fi
