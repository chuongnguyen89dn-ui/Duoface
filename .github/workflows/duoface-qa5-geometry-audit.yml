name: DuoFace QA5 geometry gap audit (NOT device pass)
on:
  push:
    branches: [feature/duoface-native12-ui-on-sideplay-host]
    paths:
      - '.github/workflows/duoface-qa5-geometry-audit.yml'
      - 'sideplay/native12-display/validation/audit_qa5_geometry_coverage.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-known-gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Native12 8-layout reference (read-only)
        run: |
          set -euo pipefail
          git fetch --depth=1 origin c11ff1181eeda01dfc5e81f5166c99ba0287cfed
          git show FETCH_HEAD:replacement/visual12/engine/DFILayouts.h > "$RUNNER_TEMP/DFILayouts.h"
          test -s "$RUNNER_TEMP/DFILayouts.h"
      - name: Detect unported Native12 geometry and missing bar owner
        env:
          NATIVE12_LAYOUTS_REFERENCE_FILE: ${{ runner.temp }}/DFILayouts.h
        run: |
          set -euo pipefail
          python3 sideplay/native12-display/validation/audit_qa5_geometry_coverage.py | tee qa5-geometry-audit.json
          python3 - <<'PY'
          import json
          r=json.load(open("qa5-geometry-audit.json"))
          assert r["status"]=="NOT_NATIVE12_COMPLETE" and not r["ready_for_claim_native_parity"]
          assert len(r["blocking_gaps"])>=6
          print("AUDIT_PASSED: QA5 incomplete; must not claim UI/CarPlay bar fixed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: qa5-geometry-unported-audit
          path: qa5-geometry-audit.json
