name: Original OmniCar iPhone selected-app picker forensic (READ ONLY)
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - '.github/workflows/duoface-omnicar-original-iphone-picker-audit-20261029.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-omni-original-iphone-apps-forensic
  cancel-in-progress: false
jobs:
  audit:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: SHA-pin original OmniCar 1.0.3 and inspect every iPhone preference and Mach-O
        shell: bash
        run: |
          set -euo pipefail
          command -v dpkg-deb >/dev/null || brew install dpkg
          curl -fLsS --retry 3 \
            'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Omnicar/bafc2441d280707ac1fbfd210780a51bdf69da95/com.anlai.omnicar_1.0.3_iphoneos-arm64.deb' \
            -o "$RUNNER_TEMP/original-omnicar.deb"
          echo "d9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd  $RUNNER_TEMP/original-omnicar.deb" | shasum -a 256 -c -
          python3 - "$RUNNER_TEMP/original-omnicar.deb" "$RUNNER_TEMP/omni-audit" <<'PY'
          import hashlib,json,pathlib,plistlib,re,subprocess,sys,tempfile
          deb=pathlib.Path(sys.argv[1]);target=pathlib.Path(sys.argv[2]);target.mkdir()
          sha=hashlib.sha256(deb.read_bytes()).hexdigest()
          assert sha=="d9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd"
          rx=re.compile(r"app.?bridge|app.?picker|app.?manager|app.?list|selected.?apps|enabled.?apps|allowed.?apps|choose.?apps|app.?filter|installed.?apps|app.?catalog|preferences|settings|bundle.?id|LSApplicationWorkspace|allInstalledApplications|publishCarPlayApps|showPickerForSlot|isCarPlayApp|com\.anlai|notify|CFPreferences|whitelist|blacklist",re.I)
          def run(*cmd):
           return subprocess.run(cmd,capture_output=True,text=True,errors="replace")
          def lines(s,n):
           out=[];seen=set()
           for line in s.splitlines():
            x=line.strip()
            if len(x)>3 and len(x)<300 and rx.search(x) and x not in seen:
             seen.add(x);out.append(x)
            if len(out)>=n:break
           return out
          with tempfile.TemporaryDirectory() as temp:
           root=pathlib.Path(temp)/"root";root.mkdir()
           p=run("dpkg-deb","-x",str(deb),str(root));assert p.returncode==0,p.stderr
           files=sorted(x for x in root.rglob("*") if x.is_file())
           data={"original_deb_sha256":sha,"original_control":run("dpkg-deb","-f",str(deb),"Package","Version","Architecture").stdout,
            "user_device_report":"OmniCar iPhone Settings selects apps; only selected apps appear on CarPlay",
            "payload_inventory":[{"path":str(x.relative_to(root)),"size":x.stat().st_size} for x in files],
            "plists":[],"macho":[],"method":"Static SHA-pinned original plist/ObjC/literal audit; not live iPhone QA"}
           magic={bytes.fromhex(s) for s in ["cafebabe","bebafeca","cffaedfe","feedfacf","cefaedfe","feedface"]}
           for f in files:
            loc=str(f.relative_to(root))
            if f.suffix==".plist":
             item={"path":loc}
             try:item["content"]=repr(plistlib.loads(f.read_bytes()))[:25000]
             except Exception as e:item["error"]=str(e)
             data["plists"].append(item)
            if f.stat().st_size<24:continue
            with f.open("rb") as stream:head=stream.read(4)
            if head not in magic:continue
            item={"path":loc,"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),
                  "strings":lines(run("strings","-a",str(f)).stdout,170)}
            obj=run("xcrun","llvm-objdump","--macho","--objc-meta-data","--arch=arm64",str(f))
            if obj.returncode:obj=run("xcrun","llvm-objdump","--macho","--objc-meta-data",str(f))
            item["objc_meta_ok"]=obj.returncode==0
            item["objc_meta_error"]=obj.stderr[-350:] if obj.returncode else ""
            ls=obj.stdout.splitlines();match=[]
            for n,l in enumerate(ls):
             if rx.search(l):
              match.append({"line":n+1,"context":" | ".join(ls[max(0,n-2):n+4])[:750]})
             if len(match)>=150:break
            item["objc_selectors_context"]=match
            data["macho"].append(item)
           (target/"ORIGINAL_OMNICAR_IPHONE_PICKER.json").write_text(json.dumps(data,indent=2,ensure_ascii=False)+"\n")
           out=["# OmniCar original 1.0.3 — iPhone selected-app prefs → CarPlay picker",
            "","User confirms only iPhone-selected apps show on CarPlay; do not dismiss this device observation.",
            "SHA-pinned original DEB: "+sha,
            "Package: "+data["original_control"].replace("\n"," | "),
            "Total files: "+str(len(files))+"; plists: "+str(len(data["plists"]))+"; Mach-O: "+str(len(data["macho"])),
            "","## Original full payload"]
           out+=["- "+x["path"]+" ("+str(x["size"])+")" for x in data["payload_inventory"]]
           out+=["","## Original iPhone settings and plist entries"]
           for x in data["plists"]:out+=["### "+x["path"],x.get("content",x.get("error",""))[:6500],""]
           out+=["","## Objective-C/strings app roster evidence"]
           for x in data["macho"]:
            out+=["### "+x["path"],"SHA256: "+x["sha256"],
              "ObjC metadata OK: "+str(x["objc_meta_ok"]),"Literal matches:"]
            out+=["- "+s for s in x["strings"][:100]]
            out+=["Objective-C class/method excerpts:"]
            out+=["- "+str(i["line"])+": "+i["context"][:360] for i in x["objc_selectors_context"][:60]]
            out+=[""]
           out+=["## Remaining proof boundary","Original method strings do not by themselves prove prefs save and CarPlay filtering callback branches.",
            "Next inspect the original app manager save/filter methods and their ARM64 callsites.",
            "No DuoFace runtime changes; no DEB build or Sileo release.",""]
           (target/"REPORT.md").write_text("\n".join(out))
           print("OMNICAR_ORIGINAL_IPHONE_APP_AUDIT_PASS",len(files),len(data["plists"]),len(data["macho"]))
           for x in data["plists"]:print("PREF_PLIST",x["path"],x.get("content","")[:200])
           for x in data["macho"]:print("MACHO",x["path"],"strings",len(x["strings"]),"objcmatches",len(x["objc_selectors_context"]),"objc_ok",x["objc_meta_ok"])
          PY
      - name: Trace original OmniCar iPhone AppBridge 105 methods and CarPlay allowlist callsites
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/original-omnicar.deb" "$RUNNER_TEMP/omni-audit" <<'PY'
          import hashlib,json,pathlib,re,subprocess,sys,tempfile
          original=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2])
          original_sha=hashlib.sha256(original.read_bytes()).hexdigest()
          assert original_sha=="d9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd"
          def original_meta(path):
           p=subprocess.run(["xcrun","llvm-objdump","--macho","--objc-meta-data","--arch=arm64",str(path)],capture_output=True,text=True,errors="replace")
           assert p.returncode==0,p.stderr[-600:]
           return p.stdout.splitlines()
          def methods_for(lines,name):
           patterns=[re.compile(r"^\s*name\s+0x[0-9a-fA-F]+\s+"+re.escape(name)+r"\s*$")]
           starts=[i for i,l in enumerate(lines) if any(p.search(l) for p in patterns)]
           if not starts:return {"error":"class name not in original metadata"}
           i=starts[0]
           base=next((j for j in range(i+1,min(i+60,len(lines))) if "baseMethods" in lines[j]),None)
           if base is None:return {"error":"baseMethods metadata missing"}
           bound=next((j for j in range(base+1,min(base+2200,len(lines))) if "baseProtocols" in lines[j]),len(lines))
           selectors=[]
           for line in lines[base+1:bound]:
            m=re.match(r"^\s*name\s+0x[0-9a-fA-F]+\s+(.+?)\s*$",line)
            if m:selectors.append(m.group(1))
           return {"base_line":base+1,"selector_count":len(selectors),"selectors":selectors}
          with tempfile.TemporaryDirectory() as td:
           root=pathlib.Path(td)
           p=subprocess.run(["dpkg-deb","-x",str(original),str(root)],capture_output=True,text=True)
           assert p.returncode==0,p.stderr
           prefs=root/"var/jb/Library/PreferenceBundles/OmniCarPrefs.bundle/OmniCarPrefs"
           split=root/"var/jb/Library/MobileSubstrate/DynamicLibraries/OmniCarSplitScreen.dylib"
           assert hashlib.sha256(prefs.read_bytes()).hexdigest()=="15bca4bee19bd9e04300e2c8070f665869df93c0f8913278e87b147ebf895a76"
           assert hashlib.sha256(split.read_bytes()).hexdigest()=="f696b518579266cf99cfd46f85cb54931d18e679c793a563ee2fcc9bf8115754"
           m=original_meta(prefs);s=original_meta(split)
           phone={c:methods_for(m,c) for c in ["OMCRootListController","OMCAppBridgeAppsLinkCell","OMCAppBridgeAppsController","OMCHomeScreenController","OMCSplitScreenAppPickerController"]}
           split_cls={c:methods_for(s,c) for c in ["SCPCarSplit","SCPCarPane"]}
           assert phone["OMCAppBridgeAppsController"].get("selector_count",0)>=95,phone["OMCAppBridgeAppsController"]
           terms=re.compile(r"app|bridge|select|toggle|save|pref|reload|refresh|filter|search|table|switch|enabled|visible|allow|list|notify|update|set|allInstalled|selected",re.I)
           targeted={k:[x for x in v.get("selectors",[]) if terms.search(x)] for k,v in phone.items()}
           result={"kind":"ORIGINAL_OMNICAR_IPHONE_APP_MANAGER_METHODS_READ_ONLY",
            "original_sha256":original_sha,
            "prefs_binary_sha256":hashlib.sha256(prefs.read_bytes()).hexdigest(),
            "split_binary_sha256":hashlib.sha256(split.read_bytes()).hexdigest(),
            "iPhone_preferences_controllers":phone,
            "iPhone_selector_subset":targeted,
            "CarPlay_split_classes":split_cls,
            "reference_prefs_key":"appBridgeApps",
            "reference_change_notification":"com.anlai.omnicar/prefschanged",
            "boundary":"Selector metadata shows available methods, not a verified runtime call chain or app selection membership branch."}
           (out/"ORIGINAL_OMNICAR_APP_MANAGER_METHODS.json").write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n")
           rows=["# OmniCar original iPhone AppBridge manager exact class/method scan",
            "","Original iPhone Settings: Root.plist APPS -> OMCAppBridgeAppsController, class source Objective-C metadata.",
            "Original prefs SHA: "+result["prefs_binary_sha256"],"Original split SHA: "+result["split_binary_sha256"],
            "","## iPhone controller methods"]
           for c,v in phone.items():
            rows+=["### "+c+" ("+str(v.get("selector_count",0))+" methods)"]
            rows+=["- "+name for name in v.get("selectors",[])]
           rows+=["","## Original CarPlay owner selectors"]
           for c,v in split_cls.items():
            rows+=["### "+c+" ("+str(v.get("selector_count",0))+" methods)"]
            rows+=["- "+name for name in v.get("selectors",[]) if terms.search(name)]
           rows+=["","## Interpretation",
             "The original has a dedicated iPhone app selection preferences controller, persistent shared appBridgeApps key and app-change notification; the original split owner holds CarPlay app roster/picker selectors.",
             "Exact membership control flow and read/write notification sites require a dedicated function-body ARM64 trace; do not claim more from names alone.",
             "No new DuoFace app, source modification or DEB produced.",""]
           (out/"APP_MANAGER_METHODS.md").write_text("\n".join(rows))
           print("OMNICAR_ORIGINAL_IPHONE_APP_MANAGER_METHODS_PASS",
             phone["OMCAppBridgeAppsController"]["selector_count"],
             len(targeted["OMCAppBridgeAppsController"]))
           for sel in targeted["OMCAppBridgeAppsController"]:print("OMNI_PHONE_METHOD",sel)
          PY

      - name: Resolve original OmniCar 105 iPhone app manager methods from ARM64 pointers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/original-omnicar.deb" "$RUNNER_TEMP/omni-audit" <<'PY'
          import hashlib,json,pathlib,re,struct,subprocess,sys,tempfile
          deb=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2])
          assert hashlib.sha256(deb.read_bytes()).hexdigest()=="d9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd"
          def thin(raw):
           if struct.unpack_from(">I",raw)[0]==0xcafebabe:
            n=struct.unpack_from(">I",raw,4)[0]
            for j in range(n):
             cpu,sub,off,size,align=struct.unpack_from(">IIIII",raw,8+20*j)
             if cpu==0x0100000c and sub==0:return raw[off:off+size]
            raise RuntimeError("ARM64 fat slice unavailable")
           assert struct.unpack_from("<I",raw)[0]==0xfeedfacf
           return raw
          def cstring(b,off):
           if not 0<=off<len(b):return None
           end=b.find(b"\0",off,min(len(b),off+230))
           if end<=off:return None
           try:s=b[off:end].decode("utf8")
           except UnicodeDecodeError:return None
           return s if re.fullmatch(r"[A-Za-z_$][A-Za-z0-9_:$]*",s) else None
          def read_methods(binary,meta,cls):
           hits=[i for i,x in enumerate(meta) if re.match(r"^\s*name\s+0x[0-9a-fA-F]+\s+"+re.escape(cls)+r"\s*$",x)]
           if not hits:return {"error":"Class not found"}
           i=hits[0]
           m=next((re.search(r"baseMethods\s+0x([a-fA-F0-9]+)",x) for x in meta[i+1:i+65] if "baseMethods" in x),None)
           if m is None:return {"error":"class has no base method table"}
           tab=int(m.group(1),16)
           if tab+8>len(binary):return {"error":"baseMethods out of bounds","table":hex(tab)}
           size=struct.unpack_from("<I",binary,tab)[0]&0xffff
           count=struct.unpack_from("<I",binary,tab+4)[0]
           if count>1000 or size not in (12,24):raise RuntimeError("INVALID ORIGINAL METHOD TABLE "+cls+" "+str((size,count)))
           selectors=[]
           for j in range(count):
            entry=tab+8+size*j
            if size==12:
             rel=struct.unpack_from("<i",binary,entry)[0]
             pointer_to_string=entry+rel
             if 0<=pointer_to_string<len(binary)-8:
              ptr=struct.unpack_from("<Q",binary,pointer_to_string)[0]&((1<<48)-1)
             else:ptr=-1
             name=cstring(binary,ptr) or cstring(binary,pointer_to_string)
             imp=entry+8+struct.unpack_from("<i",binary,entry+8)[0]
            else:
             name=cstring(binary,struct.unpack_from("<Q",binary,entry)[0]&((1<<48)-1))
             imp=struct.unpack_from("<Q",binary,entry+16)[0]&((1<<48)-1)
            selectors.append({"name":name,"imp":hex(imp),"entry":hex(entry)})
           return {"method_table":hex(tab),"method_count":count,
            "decoded_names":sum(bool(x["name"]) for x in selectors),"methods":selectors}
          with tempfile.TemporaryDirectory() as td:
           root=pathlib.Path(td);p=subprocess.run(["dpkg-deb","-x",str(deb),str(root)],capture_output=True,text=True)
           assert p.returncode==0,p.stderr
           a=root/"var/jb/Library/PreferenceBundles/OmniCarPrefs.bundle/OmniCarPrefs"
           b=root/"var/jb/Library/MobileSubstrate/DynamicLibraries/OmniCarSplitScreen.dylib"
           def metadata(path):
            p=subprocess.run(["xcrun","llvm-objdump","--macho","--objc-meta-data","--arch=arm64",str(path)],capture_output=True,text=True,errors="replace")
            assert p.returncode==0,p.stderr[-500:]
            return p.stdout.splitlines()
           A=thin(a.read_bytes());B=thin(b.read_bytes())
           ma=metadata(a);mb=metadata(b)
           original_phone={n:read_methods(A,ma,n) for n in ["OMCAppBridgeAppsController","OMCRootListController","OMCHomeScreenController","OMCSplitScreenAppPickerController"]}
           original_car={n:read_methods(B,mb,n) for n in ["SCPCarSplit"]}
           manager=original_phone["OMCAppBridgeAppsController"]
           assert manager["method_count"]==105,manager
           if manager["decoded_names"]<100:raise RuntimeError("Cannot decode original phone selectors: "+str(manager["decoded_names"]))
           phonefilter=re.compile(r"app|bridge|select|save|toggle|persist|enabled|pref|refresh|reload|table|filter|search|add|remove|switch|installed|all|notification|write",re.I)
           carfilter=re.compile(r"app|bridge|publish|picker|load|filter|slot|installed|select|settings",re.I)
           report={"kind":"PINNED_ORIGINAL_OMNICAR_APP_MANAGER_RESOLVED_METHODS",
             "original_deb_sha256":hashlib.sha256(deb.read_bytes()).hexdigest(),
             "original_iPhone_owners":original_phone,"original_CarPlay_owners":original_car,
             "selector_only_not_execution":True}
           (out/"ORIGINAL_OMNICAR_RESOLVED_METHODS.json").write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
           rows=["# Original OmniCar: decoded ARM64 iPhone AppBridge settings manager method names",
            "","105 actual Objective-C methods decoded from relative ObjC method-table entries, not pointer placeholders.",
            "Original Root.plist uses OMCAppBridgeAppsController; preferences key appBridgeApps and Darwin notification com.anlai.omnicar/prefschanged.",
            ""]
           for n,val in original_phone.items():
            rows+=["## Phone "+n+" ("+str(val.get("method_count",0))+" methods, "+str(val.get("decoded_names",0))+" decoded)"]
            rows+=["- "+v["name"]+" @ "+v["imp"] for v in val.get("methods",[]) if v["name"] and phonefilter.search(v["name"])]
           for n,val in original_car.items():
            rows+=["## CarPlay "+n+" ("+str(val.get("method_count",0))+" methods)"]
            rows+=["- "+v["name"]+" @ "+v["imp"] for v in val.get("methods",[]) if v["name"] and carfilter.search(v["name"])]
           rows+=["","Selector and method implementation addresses are static evidence; exact read/write/filter membership call flow and physical UI remain separate proof gates.",
                  "No DuoFace runtime edit; no DEB build; no publisher change."]
           (out/"RESOLVED_105_APP_MANAGER.md").write_text("\n".join(rows)+"\n")
           print("ORIGINAL_OMNICAR_APPBRIDGE_105_METHODS_RESOLVED",manager["decoded_names"])
           for v in manager["methods"]:
            if v["name"] and phonefilter.search(v["name"]):print("OMNI_PHONE_APP_SELECTOR",v["name"],v["imp"])
          PY

      - name: Persist original-only evidence and append existing DuoFace handoff
        shell: bash
        run: |
          set -euo pipefail
          BR='feature/duoface-jb-embedded-appbridge-20261020'
          TARGET="sideplay/audit/omnicar-iphone-picker-20261029/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BR"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            test -s "$TEMP/sideplay/tiep tuc du an.md"
            test ! -e "$TEMP/$TARGET"
            mkdir -p "$TEMP/$TARGET"
            cp "$RUNNER_TEMP/omni-audit/"* "$TEMP/$TARGET/"
            export TARGET
            python3 - "$TEMP/sideplay/tiep tuc du an.md" <<'PY'
          import os,pathlib,sys
          p=pathlib.Path(sys.argv[1]);old=p.read_text(encoding="utf-8")
          note=("## 2026-10-29 — original OmniCar iPhone Settings app selection audit\n\n"
            "- User device observation: OmniCar iPhone Settings selects apps and the CarPlay picker only lists those selected. Earlier scene/zoom-only scan did not cover this feature.\n"
            "- Verified original DEB SHA256 d9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd. Read-only original plist and all Mach-O selector/strings inventory; no runtime edits, builds, Sileo.\n"
            "- Audit run "+os.environ["GITHUB_RUN_ID"]+" archived under "+os.environ["TARGET"]+"/REPORT.md and ORIGINAL_OMNICAR_IPHONE_PICKER.json.\n"
            "- Next: trace exact original iPhone selection prefs and in-car picker membership branch; distinguish user runtime from static selector evidence.\n\n---\n\n")
          p.write_text(note+old,encoding="utf-8")
          PY
            git -C "$TEMP" add "$TARGET" 'sideplay/tiep tuc du an.md'
            git -C "$TEMP" commit -m "audit(omnicar): original iPhone selected-app controls $GITHUB_RUN_ID [skip ci]"
            if git -C "$TEMP" push origin "HEAD:refs/heads/$BR"; then
              git fetch origin "$BR"
              git cat-file -e "FETCH_HEAD:$TARGET/ORIGINAL_OMNICAR_IPHONE_PICKER.json"
              git worktree remove --force "$TEMP"
              echo ORIGINAL_OMNICAR_IPHONE_PREFS_GITHUB_SAVED_VERIFIED
              exit 0
            fi
            git worktree remove --force "$TEMP"
          done
          exit 1
