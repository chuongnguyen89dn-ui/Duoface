name: QA174 device rejection - documentation only
on:
  push:
    branches: [fix/qa173-logo-map-touch-recall-20261106]
    paths: ['.github/workflows/duoface-174-device-verdict-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa174-device-verdict-docs
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tiep tuc du an.md
            /sideplay/tiep tuc du an.md
            /sideplay/audit/qa174-device-rejected-20261106/
      - name: Preserve history and record actual device rejection
        env:
          BRANCH: fix/qa173-logo-map-touch-recall-20261106
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chuongnguyen89dn-ui/Duoface'
          test "$GITHUB_REF_NAME" = "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$BRANCH"
            git checkout --detach FETCH_HEAD
            python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os, subprocess
          marker = '## CHECKPOINT QA174-DEVICE-REJECTED-20261106'
          report_path = 'sideplay/audit/qa174-device-rejected-20261106/FINDINGS.md'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          timestamp = datetime.now(timezone.utc).isoformat()
          run_id = os.environ['GITHUB_RUN_ID']
          report = '''# QA174 user-device failure: reject functional acceptance

          ## Authoritative latest device report
          After the official 0.0.174~mapwake1 update was offered, the user reports: touching arbitrary areas still does not recall the hidden logo; only GOFA opens; Google Maps and Waze do not open; no selected app appears on CarPlay Home outside DuoFace. Treat all reported outcomes as FAILED device acceptance, not merely pending. Do not blame setup or user operation. Exact installed build stamp has not been read from a new exported log; that is a logging gap, not a reason to dismiss the report.

          ## Immutable baseline and unaffected historical facts
          Repository chuongnguyen89dn-ui/Duoface; branch fix/qa173-logo-map-touch-recall-20261106. Runtime/code review pinned to 577fa9fecccb9de8cf5b0a93425466bfdc2332f7. Compiled source d8144d3c58833764fbc6a53e25044682adf852e2; DEB 0.0.174~mapwake1 SHA256 f45e30bc92c984b7beaf13d1d03d88ffd5015780bd0080c15d859bddbc3f02cd. Signed CI 42155565599 and public Sileo run 42157448538 passed packaging/distribution only. Those successes do not contradict the failed device report and must never be presented as logo/maps/Home functional success.

          ## Findings actually read from source/reference evidence
          1. Touch architecture still differs from the archived reference. sideplay/audit/duoface-116-touch-ownership-20261029/ORIGINAL_TOUCH_ATTACHMENT_CALLSITES.md records CBWindow.createWindows at 0xb1064 selecting a base, then registering CBTouchPassThroughRootSceneWindow overrides for hitTest:withEvent:, pointInside:withEvent:, and sendEvent:. In current DFNative12Chrome.m, makeWindow instantiates the external window class directly; comments deliberately omit that window-level layer after the earlier .117 regression. Current recall instead depends on pane-view hitTest and app-side relays. ensureWakeGates additionally declines wake on unknown/visible keyboard, ineligible hosted bundles, focus and modal state. Matching method names and updating logo alpha is not proof that remote app touches reach these callbacks. This is a verified source/reference divergence, NOT a proved sole device root cause. Do not blindly reinstall the previously failed .117 window subclass or an input-consuming shield.
          2. Native map library reader and launcher do not use the same lookup contract. sideplay/native-carplay-scene-v1/DFNativeMapCatalog.h tries applicationLibrary/_applicationLibrary/appLibrary/_appLibrary plus object ivars. DFNativeMapLaunchRuntime.m explicitly reads UIApplication.sharedApplicationLibrary before the real DBEvent. The catalog helper does not try that selector. Ivar fallback may succeed; therefore actual lookup failure remains a hypothesis until the device's catalog/launch rejection is read. Do not assert this alone fixes Waze.
          3. Maps and GOFA are separate routes in DFCarPlayAppRoute178.h. GOFA uses phone AppBridge; Google Maps, Apple Maps and Waze use a guarded native coordinator. GOFA working proves nothing about the native path. The picker now sends a request, but launch-context/native declaration/physical pane checks can still reject it. Read actual DFNativeMapPaneCoordinator Reason instead of removing guards or faking Applied.
          4. The outside-DuoFace CarPlay Home requirement was not completed by the picker fix. DFHomePublisher136Core.m has its own enabled/selected/native-library gates and explicitly skips records with an existing native declaration (NATIVE_DECLARATION_EXISTS_OS_HOME_ICON_NOT_MANAGED_BY_DUOFACE). The archived OmniCar analysis, sideplay/audit/omnicar-iphone-picker-20261029/DUODASH_OMNICAR_COMBINED_ARCHITECTURE_RESEARCH_20261029.md, establishes separate appBridgeApps, homeScreenShownApps/homeScreenHiddenApps and split-picker flows. Existing native records must not be replaced with counterfeit icons; trace the actual Home notification/display path separately. Do not say changing a card's route publishes a Home icon.

          ## Evidence access and limits this turn
          Read live GitHub branch/ref, canonical handoff, source ranges and archived reference reports. In-progress Actions query returned zero before this documentation job. The newest main-branch commit touching sideplay/log is 8443c4c1f0d97167fc1007466b9ca4eb3b3e0faf at 2026-11-04T14:13:19Z; spec-main path history query returned no entries. No fresh log for this reported QA174 session was found in those checked locations. GitHub code searches returned no results and are NOT treated as exhaustive absence across every branch. Current container read-only curl probe of pinned raw source failed: curl: (6) Could not resolve host: raw.githubusercontent.com. No runtime source edit, DEB build, installation, Sileo update, vendor code/license change, or device test was performed in this turn. This workflow only persists documentation; a green docs run is NOT a functionality test.

          ## Immediate next action and stop condition
          Obtain one manual DuoFace diagnostic export after one failed logo recall and one Waze/Google Maps selection, not another full six-function test cycle. The built-in exporter already collects DuoFaceDeepTrace.log, DuoFaceTouchOwner.log, DuoFaceNativeMapPane.log, Home publisher logs, native-map ACK Reason and physical panes/session. Cross-check: qa120-pane-tap, qa177-recall/qa179-recall, qa178-native-map-picker-request, qa178-native-map-picker-rejected reason, Native Map ACK and Home library/admission state. Preserve GOFA and working keyboard/media/ratio behavior. Compare each failing executed method with the archived DuoNavi/OmniCar call chain, patch the measured gap, add a regression that fails on the old implementation, and run CI. Do not issue another version merely for source-text tests. Acceptance requires real anywhere-touch recall with red only while logo visible, live Google Maps/Waze pixels and touch, and the user-requested actual CarPlay Home entries. Current acceptance remains FAILED until new device evidence supersedes it.
          '''
          report = '\n'.join(line[10:] if line.startswith('          ') else line for line in report.splitlines()).strip() + '\n'
          report += '\nDocumentation evidence: UTC=' + timestamp + '; inspected HEAD=' + head + '; docs-only run=' + run_id + '.\n'
          path = Path(report_path)
          path.parent.mkdir(parents=True, exist_ok=True)
          if not path.exists():
              path.write_text(report, encoding='utf-8')
          note = (marker + '\n\n'
                  '- LATEST USER DEVICE VERDICT: FAILED. Anywhere-touch logo recall still fails; GOFA only works; Google Maps/Waze cannot open; no selected app appears outside DuoFace on CarPlay Home. This supersedes prior pending/UNVERIFIED acceptance. Historical build/Sileo SHA PASS remains distribution evidence only.\n'
                  '- Source baseline: 577fa9fecccb9de8cf5b0a93425466bfdc2332f7; compiled d8144d3c58833764fbc6a53e25044682adf852e2; version 0.0.174~mapwake1. No runtime/DEB/Sileo changes in this investigation.\n'
                  '- Read the concrete function crosswalk, limits and next steps: `' + report_path + '`. Do not reintroduce failed .117 touch windows, consume app taps, bypass native-owner guards or equate picker cards with Home publication.\n'
                  '- Need the current failed-session manual diagnostic export; last checked main sideplay/log upload predates QA174 (2026-11-04). One failed recall/map-tap capture is enough; do not ask the user to repeat the full QA list. This documentation CI is not a device test.\n'
                  '- Docs run: ' + run_id + '; checkpoint UTC: ' + timestamp + '; pre-write HEAD: ' + head + '. Preserve all prior history below.\n\n')
          for filename in ('sideplay/tiep tuc du an.md', 'tiep tuc du an.md'):
              target = Path(filename)
              original = target.read_text(encoding='utf-8')
              if marker not in original:
                  target.write_text(note + original, encoding='utf-8')
                  assert target.read_text(encoding='utf-8').endswith(original)
              assert marker in target.read_text(encoding='utf-8')
          print('DEVICE_FAILURE_DOCUMENTED_NOT_FIXED', head, report_path)
          PY
            git add -- 'sideplay/tiep tuc du an.md' 'tiep tuc du an.md' 'sideplay/audit/qa174-device-rejected-20261106/FINDINGS.md'
            if git diff --cached --quiet; then
              echo DOCS_ALREADY_CURRENT
              exit 0
            fi
            git commit -m 'docs: QA174 device rejected; record actual source/reference gaps and required runtime evidence [skip ci]'
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              git show -s --format='%H %s'
              exit 0
            fi
          done
          echo 'Documentation push conflicted; no force-push performed' >&2
          exit 1
