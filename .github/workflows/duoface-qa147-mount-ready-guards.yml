name: QA147 launch mount and ACK scoped regressions
on:
  push:
    branches:
      - feature/duoface-qa146-native-home-exit-20261031
    paths:
      - '.github/workflows/duoface-qa147-mount-ready-guards.yml'
      - 'sideplay/duoface-native-scene-host/DFHomeStandalone144.m'
      - 'sideplay/duoface-native-scene-host/DF154AppStateProtocol.h'
      - 'sideplay/duoface-native-scene-host/DF154GeneralAppStateRelay.m'
      - 'sideplay/duoface-native-scene-host/tests/test_qa154_staged_app_state.py'
      - 'sideplay/duoface-native-scene-host/DFWorkspaceABIProbe150.h'
      - 'sideplay/duoface-native-scene-host/DF151WorkspaceOwnerCapture.h'
      - 'sideplay/duoface-native-scene-host/DFNativePrepOnce152.h'
      - 'sideplay/duoface-native-scene-host/DF152NativeWorkspacePrepare.h'
      - 'sideplay/duoface-native-scene-host/DF153PhoneEviction.h'
      - 'sideplay/duoface-native-scene-host/tests/test_qa153_phone_foreground_eviction.py'
      - 'sideplay/duoface-native-scene-host/tests/native_workspace_once_152.c'
      - 'sideplay/duoface-native-scene-host/tests/test_qa152_workspace_prepare.py'
      - 'sideplay/duoface-native-scene-host/tests/test_qa151_workspace_owner_capture.py'
      - 'sideplay/duoface-native-scene-host/tests/test_qa150_workspace_preflight.py'
      - 'sideplay/duoface-native-scene-host/DFSceneHost.m'
      - 'sideplay/duoface-native-scene-host/tests/test_qa147_mount_ack_reentrancy.py'
      - 'sideplay/duoface-native-scene-host/tests/test_qa148_real_pid_and_stop_identity.py'
      - 'sideplay/duoface-native-scene-host/DFNativeDockSync147.h'
      - 'sideplay/duoface-native-scene-host/DFManagerLifecycle149.h'
      - 'sideplay/duoface-native-scene-host/tests/manager_lifecycle_149.c'
      - 'sideplay/duoface-native-scene-host/tests/test_qa149_manager_live_scene.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope-and-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run targeted guard assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sideplay/duoface-native-scene-host/tests/test_qa147_mount_ack_reentrancy.py
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa147_mount_ack_reentrancy.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa148_real_pid_and_stop_identity.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa149_manager_live_scene.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa150_workspace_preflight.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa151_workspace_owner_capture.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa152_workspace_prepare.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa153_phone_foreground_eviction.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa154_staged_app_state.py' -v
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/native_workspace_once_152.c -o "$RUNNER_TEMP/workspace152"
          "$RUNNER_TEMP/workspace152"
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/manager_lifecycle_149.c -o /tmp/manager149
          /tmp/manager149
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa144_no_split_home_redirect.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa146_native_home_exit.py' -v
          echo 'QA147_MOUNT_ACK_GUARD_STATIC_ONLY_PASS'
