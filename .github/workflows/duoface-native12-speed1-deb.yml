name: DuoFace Native12 speed1 GOFA bubble - owner approved DEB (NO Sileo)
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths: ['.github/workflows/duoface-native12-speed1-deb.yml', 'migration/full_payload/native_test/build_native12_speed1_candidate.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-native12-speed1-build
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate exact user-tested Native12 only
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid
          base=dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb
          echo "85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7  $base" | shasum -a 256 -c -
          test "$(dpkg-deb -f "$base" Version)" = '0.1.0~native12'
          dpkg --compare-versions '0.1.0~native12+speed1' gt '0.1.0~native12'
          python3 -m py_compile migration/full_payload/native_test/build_native12_speed1_candidate.py migration/full_payload/native_test/stage_gmaphud_modules_for_duoface.py
      - name: Compile both DuoFace speed modules with Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          mkdir -p "$RUNNER_TEMP/df-speed1-bin"
          cp Makefile.speedhud-stage Makefile
          THEOS="$RUNNER_TEMP/theos" make clean all FINALPACKAGE=1
          hud="$(find .theos -type f -name 'DuoFaceSpeedHUD.dylib' -print -quit)"
          test -s "$hud"
          cp "$hud" "$RUNNER_TEMP/df-speed1-bin/DuoFaceSpeedHUD.dylib"
          cp Makefile.speed-source-stage Makefile
          THEOS="$RUNNER_TEMP/theos" make clean all FINALPACKAGE=1
          source="$(find .theos -type f -name 'DuoFaceSpeedSources.dylib' -print -quit)"
          test -s "$source"
          cp "$source" "$RUNNER_TEMP/df-speed1-bin/DuoFaceSpeedSources.dylib"
          xcrun lipo "$RUNNER_TEMP/df-speed1-bin/DuoFaceSpeedHUD.dylib" -verify_arch arm64
          xcrun lipo "$RUNNER_TEMP/df-speed1-bin/DuoFaceSpeedSources.dylib" -verify_arch arm64
      - name: Stage only three pinned map data publishers in immutable Native12
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 3 'https://github.com/bechou0410/gmaphud/releases/download/v0.2.3/com.chou.googlemaps.vietmap_0.2.3_iphoneos-arm64.deb' -o "$RUNNER_TEMP/gmaphud.deb"
          echo "bc5a34cf2b6a8faa017beab725a3cb8adf4804a5b19275a9d7f95ed5732c1f64  $RUNNER_TEMP/gmaphud.deb" | shasum -a 256 -c -
          python3 migration/full_payload/native_test/stage_gmaphud_modules_for_duoface.py \
            --gmaphud "$RUNNER_TEMP/gmaphud.deb" \
            --native12 dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb \
            --out-dir "$RUNNER_TEMP/df-speed1-stage" --report "$RUNNER_TEMP/gmap-report.json"
      - name: Sign and pack Native12 speed1 without changing legacy payload
        shell: bash
        run: |
          set -euo pipefail
          dest=dist/payload-migration/native12-speed1
          mkdir -p "$dest"
          deb="$dest/com.duoface.independent_0.1.0~native12+speed1_iphoneos-arm64.deb"
          test ! -e "$deb"
          python3 migration/full_payload/native_test/build_native12_speed1_candidate.py \
            --stage "$RUNNER_TEMP/df-speed1-stage" --gmapreport "$RUNNER_TEMP/gmap-report.json" \
            --hud "$RUNNER_TEMP/df-speed1-bin/DuoFaceSpeedHUD.dylib" \
            --observer "$RUNNER_TEMP/df-speed1-bin/DuoFaceSpeedSources.dylib" \
            --output "$deb" --report "$dest/BAO_CAO.json"
          test "$(dpkg-deb -f "$deb" Package)" = com.duoface.independent
          test "$(dpkg-deb -f "$deb" Version)" = '0.1.0~native12+speed1'
          dpkg-deb -c "$deb" > "$dest/CONTENTS.txt"
          for n in DuoFaceSpeedHUD DuoFaceSpeedSources VietMapGoogleMapsSource WazeGMapHUDSource GofaGMapHUDSource; do
            grep -Fq "$n.dylib" "$dest/CONTENTS.txt"
          done
          ! grep -E 'GMapHUDOverspeedScreen|GMapHUDPlacementRelay|GoogleMapsVietMap|A_DuoFaceNativeNoLease' "$dest/CONTENTS.txt"
          shasum -a 256 "$deb" > "$dest/SHA256SUMS"
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          d=pathlib.Path("dist/payload-migration/native12-speed1")
          j=json.loads((d/"BAO_CAO.json").read_text())
          p=d/"com.duoface.independent_0.1.0~native12+speed1_iphoneos-arm64.deb"
          assert j["deb_sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert j["old_native12_files_unchanged"] and j["no_other_renderer"]
          assert not j["sileo_published"] and not j["device_tested"]
          (d/"SOURCE_COMMIT.txt").write_text(os.environ["GITHUB_SHA"]+"\n")
          print("SPEED1_SIGNED_NATIVE12_TEST_DEB_PACKAGE_QA_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-native12-speed1-test-deb
          path: dist/payload-migration/native12-speed1/
          if-no-files-found: warn
      - name: Commit test DEB and checksum to DuoFace repo, DO NOT publish Sileo
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/payload-migration/native12-speed1/
          git diff --cached --quiet && exit 0
          git commit -m 'artifact: native12 speed1 source-only integrated DEB for device QA [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
