name: Native12 opt-in runtime reference probe - source/ABI only
on:
  push:
    branches: [feature/visual12-duodash-recovery]
    paths:
      - 'tools/native12-runtime-reference/**'
      - '.github/workflows/duoface-native12-reference-runtime-probe-source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-inspector:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assert no automatic hooks, network or user text collection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/native12-runtime-reference/Native12ReferenceCapture.m').read_text()
          trigger=Path('tools/native12-runtime-reference/Native12ReferenceTrigger.m').read_text()
          assert 'CFNotificationCenterAddObserver' in s
          assert 'DFProbeCaptureNow' in s and 'DFProbeNotification' in s
          assert 'com.duoface.native12.reference.capture' in s
          assert 'com.duoface.native12.reference.capture' in trigger
          assert 'writeToFile:dest' in s
          source_without_line_comments='\n'.join(line.split('//',1)[0] for line in s.splitlines())
          for bad in ('method_setImplementation','MSHook','DuoFaceDashboard.dylib',
                      'initWithAppFrame:', 'NSURLSession','UILabel.text',
                      'UITextField.text','UIImagePNGRepresentation',
                      'window.makeKeyAndVisible'):
              assert bad not in source_without_line_comments, f'Forbidden operation in passive inspector: {bad}'
          print('NATIVE12_REFERENCE_PROBE_MANUAL_READONLY_SOURCE_CHECK_PASS')
          PY
      - name: Compile-check manual Native12 UI inspector for rootless iOS16 arm64
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -fobjc-arc -x objective-c -fsyntax-only \
            -Werror -Wno-unused-parameter \
            tools/native12-runtime-reference/Native12ReferenceCapture.m
          xcrun --sdk iphoneos clang \
            -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -x objective-c -fsyntax-only \
            -Werror \
            tools/native12-runtime-reference/Native12ReferenceTrigger.m
          echo 'NATIVE12_REFERENCE_PROBE_IOS16_ARM64_SYNTAX_PASS'
      - name: No DEB build or Sileo publish by design
        run: |
          echo 'This is a non-installed optional diagnostic source check only.'
          echo 'Native12 HUD8 stable and QA Sileo remain untouched.'
