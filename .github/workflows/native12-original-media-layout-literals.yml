name: Native12 original media viewport transform exact thresholds
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - '.github/workflows/native12-original-media-layout-literals.yml'
      - 'sideplay/audit/native12-continuation-96fa4ec/decode_media_layout_literals.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native12-immutable-media-literals
  cancel-in-progress: true
jobs:
  check-arm64-original-constants:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact old reference, never execute original payload
        shell: bash
        run: |
          set -euo pipefail
          command -v dpkg-deb || brew install dpkg
          REF="$RUNNER_TEMP/native12-ref"
          mkdir -p "$REF"
          git fetch --no-tags --depth=1 origin 1286a3ef868cf7e29804bcddf7e20b2eae707ce1
          git show '1286a3ef868cf7e29804bcddf7e20b2eae707ce1:dist/payload-migration/native12-speed8compact/com.duoface.independent_0.1.0~native12+speed8compact_iphoneos-arm64.deb' > "$REF/native12.deb"
          echo '2fe8892c5ef8762e1e83b0fd6c4a029e25fc11758cc98fdbbb851bf6637e68ad  '"$REF/native12.deb" | shasum -a 256 -c -
          dpkg-deb -x "$REF/native12.deb" "$REF/root"
          python3 sideplay/audit/native12-continuation-96fa4ec/decode_media_layout_literals.py \
            --macho "$REF/root/var/jb/Library/MobileSubstrate/DynamicLibraries/DuoFaceDashboard.dylib" \
            --out sideplay/audit/native12-continuation-96fa4ec
          cat sideplay/audit/native12-continuation-96fa4ec/MEDIA_LAYOUT_LITERALS.json
      - uses: actions/upload-artifact@v4
        with:
          name: Native12-Original-Media-Layout-Constants-Verified
          path: sideplay/audit/native12-continuation-96fa4ec/MEDIA_LAYOUT_LITERALS.json
          if-no-files-found: error
      - name: Persist evidence in correct repo and verify
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feature/duoface-jb-embedded-appbridge-20261020
          FILE=sideplay/audit/native12-continuation-96fa4ec/MEDIA_LAYOUT_LITERALS.json
          SOURCE="$(pwd)/$FILE"
          for i in 1 2 3 4; do
            git fetch --no-tags origin "$BRANCH"
            TARGET="$(mktemp -d)"
            git worktree add --detach "$TARGET" FETCH_HEAD
            if test -s "$TARGET/$FILE"; then
              cmp "$SOURCE" "$TARGET/$FILE"
              git worktree remove --force "$TARGET"
              echo NATIVE12_MEDIA_ALREADY_SAVED_IDENTICAL
              exit 0
            fi
            mkdir -p "$TARGET/$(dirname "$FILE")"
            cp "$SOURCE" "$TARGET/$FILE"
            git -C "$TARGET" config user.name 'github-actions[bot]'
            git -C "$TARGET" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$TARGET" add "$FILE"
            git -C "$TARGET" commit -m 'audit(native12): SHA verified media viewport transform literals from original DEB [skip ci]'
            if git -C "$TARGET" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$TARGET"
              echo NATIVE12_MEDIA_PERSISTED
              exit 0
            fi
            git worktree remove --force "$TARGET"
          done
          exit 1
