name: DuoFace native12 disconnect watchdog actual machine code readonly
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - 'migration/full_payload/native_test/audit_native12_disconnect_watchdog.py'
      - '.github/workflows/duoface-native12-disconnect-watchdog-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: df-native12-disconnect-watchdog-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable installed baseline; install static decoder only
        run: |
          set -euo pipefail
          pkg=dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb
          printf '%s  %s\n' '85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7' "$pkg" | sha256sum -c -
          python3 -m pip install --user --break-system-packages 'capstone==5.0.6'
          python3 migration/full_payload/native_test/audit_native12_disconnect_watchdog.py --deb "$pkg" --out audit/payload-migration/NATIVE12_DISCONNECT_WATCHDOG_READONLY.json
          python3 - <<'PY'
          import json
          p='audit/payload-migration/NATIVE12_DISCONNECT_WATCHDOG_READONLY.json'
          j=json.load(open(p))
          assert j["status"]=="NATIVE12_DISCONNECT_WATCHDOG_CODE_READONLY"
          assert not j["deb_modified"]
          assert len(j["methods"])==11
          print("NATIVE12_WATCHDOG_REAL_CODE_DISASSEMBLED_PASS")
          PY
      - name: Commit report only, never a DEB
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/NATIVE12_DISCONNECT_WATCHDOG_READONLY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: native12 mandatory watchdog actual disassembly [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: df-native12-watchdog-code-audit
          path: audit/payload-migration/NATIVE12_DISCONNECT_WATCHDOG_READONLY.json
          if-no-files-found: warn
