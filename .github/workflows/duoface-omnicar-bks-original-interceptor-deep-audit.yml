name: DuoFace original OmniCar BKS replacement and pointer consumers verified
on:
  push:
    branches: [fix/duoface-qa130-verified-scene-owner-20261030]
    paths:
      - 'sideplay/audit/qa130-six-deb-display-callgraph-20261030/trace_omnicar_bks_hook_deep.py'
      - 'sideplay/audit/qa130-six-deb-display-callgraph-20261030/resolve_omnicar_bks_imports_and_callbacks.py'
      - 'sideplay/audit/qa130-six-deb-display-callgraph-20261030/trace_omnicar_abhost_method_and_unblank_owner.py'
      - 'sideplay/audit/qa130-six-deb-display-callgraph-20261030/verify_omnicar_delayed_unblank_path.py'
      - 'sideplay/audit/qa130-six-deb-display-callgraph-20261030/audit_native12_duonavi_screenblank_preferences.py'
      - '.github/workflows/duoface-omnicar-bks-original-interceptor-deep-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-sha-pinned-deb-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read verified central skill ZIPs for CarPlay and audit
        shell: bash
        run: |
          set -euo pipefail
          for record in \
            '02-ios-deb-ipa-carplay.zip c87b5ed9ef196c13f42dd41df49a032369028742cc8f6d56569637daf76ec7cf' \
            '05-research-debug-testing.zip fcb1122412a11664c2c6b8666cbc4f76e86ad20f96e697138d96c6425137dc98'; do
            read -r file hash <<< "$record"
            curl -fLsS --retry 3 "https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills/$file" -o "$RUNNER_TEMP/$file"
            printf '%s  %s\n' "$hash" "$RUNNER_TEMP/$file" | sha256sum -c -
            unzip -t "$RUNNER_TEMP/$file" >/dev/null
            unzip -p "$RUNNER_TEMP/$file" SKILL.md | sed -n '1,65p'
          done
      - name: Extract three original exact DEBs and real independent MachO parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs" "$RUNNER_TEMP/parser"
          git show '1286a3ef868cf7e29804bcddf7e20b2eae707ce1:dist/payload-migration/native12-speed8compact/com.duoface.independent_0.1.0~native12+speed8compact_iphoneos-arm64.deb' > "$RUNNER_TEMP/debs/native12.deb"
          cp dist/com.duonavi.app_1.0.4_iphoneos-arm64.deb "$RUNNER_TEMP/debs/duonavi.deb"
          curl -fLsS --retry 4 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Omnicar/bafc2441d280707ac1fbfd210780a51bdf69da95/com.anlai.omnicar_1.0.3_iphoneos-arm64.deb' -o "$RUNNER_TEMP/debs/omnicar.deb"
          printf '%s  %s\n' \
            '2fe8892c5ef8762e1e83b0fd6c4a029e25fc11758cc98fdbbb851bf6637e68ad' "$RUNNER_TEMP/debs/native12.deb" \
            'f3f911de5db461d487ce91249aed1bb25d44f076e7ff5fb89e54b658569328dd' "$RUNNER_TEMP/debs/duonavi.deb" \
            'd9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd' "$RUNNER_TEMP/debs/omnicar.deb" | sha256sum -c -
          python3 -m pip install --quiet --break-system-packages capstone==5.0.7
          git fetch --no-tags --depth=1 origin feature/visual12-duodash-recovery
          git show FETCH_HEAD:migration/full_payload/native_test/audit_native12_license_class_xrefs.py > "$RUNNER_TEMP/parser/audit_native12_license_class_xrefs.py"
          git show FETCH_HEAD:migration/full_payload/native_test/audit_native12_carplay_add_app_chain.py > "$RUNNER_TEMP/parser/audit_native12_carplay_add_app_chain.py"
      - name: Disassemble original registration, callback, call chains and pointers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile sideplay/audit/qa130-six-deb-display-callgraph-20261030/trace_omnicar_bks_hook_deep.py
          PYTHONPATH="$RUNNER_TEMP/parser" python3 sideplay/audit/qa130-six-deb-display-callgraph-20261030/trace_omnicar_bks_hook_deep.py \
            --OmniCar103 "$RUNNER_TEMP/debs/omnicar.deb" \
            --Native12Derived "$RUNNER_TEMP/debs/native12.deb" \
            --DuoNavi104 "$RUNNER_TEMP/debs/duonavi.deb" \
            --out "$RUNNER_TEMP/omnicar-bks"
          python3 -m json.tool "$RUNNER_TEMP/omnicar-bks/DEEP_BKS_ARM64.json" >/dev/null
          python3 -m py_compile sideplay/audit/qa130-six-deb-display-callgraph-20261030/resolve_omnicar_bks_imports_and_callbacks.py
          PYTHONPATH="$RUNNER_TEMP/parser" python3 sideplay/audit/qa130-six-deb-display-callgraph-20261030/resolve_omnicar_bks_imports_and_callbacks.py \
            --deb "$RUNNER_TEMP/debs/omnicar.deb" \
            --out "$RUNNER_TEMP/omnicar-bks/OMNICAR_IMPORT_CALLBACK_XREFS.json"
          python3 -m json.tool "$RUNNER_TEMP/omnicar-bks/OMNICAR_IMPORT_CALLBACK_XREFS.json" >/dev/null
          python3 -m py_compile sideplay/audit/qa130-six-deb-display-callgraph-20261030/trace_omnicar_abhost_method_and_unblank_owner.py
          PYTHONPATH="$RUNNER_TEMP/parser:sideplay/audit/qa130-six-deb-display-callgraph-20261030" python3 sideplay/audit/qa130-six-deb-display-callgraph-20261030/trace_omnicar_abhost_method_and_unblank_owner.py \
            --deb "$RUNNER_TEMP/debs/omnicar.deb" \
            --out "$RUNNER_TEMP/omnicar-bks/OMNICAR_ABHOST_METHOD_AND_UNBLANK_OWNER.json"
          python3 -m json.tool "$RUNNER_TEMP/omnicar-bks/OMNICAR_ABHOST_METHOD_AND_UNBLANK_OWNER.json" >/dev/null
          python3 -m py_compile sideplay/audit/qa130-six-deb-display-callgraph-20261030/verify_omnicar_delayed_unblank_path.py
          python3 sideplay/audit/qa130-six-deb-display-callgraph-20261030/verify_omnicar_delayed_unblank_path.py \
            --imports "$RUNNER_TEMP/omnicar-bks/OMNICAR_IMPORT_CALLBACK_XREFS.json" \
            --methods "$RUNNER_TEMP/omnicar-bks/OMNICAR_ABHOST_METHOD_AND_UNBLANK_OWNER.json" \
            --deep "$RUNNER_TEMP/omnicar-bks/DEEP_BKS_ARM64.json" \
            --out "$RUNNER_TEMP/omnicar-bks/OMNICAR_DELAYED_UNBLANK_VALIDATED.json"
          python3 -m json.tool "$RUNNER_TEMP/omnicar-bks/OMNICAR_DELAYED_UNBLANK_VALIDATED.json" >/dev/null
          python3 -m py_compile sideplay/audit/qa130-six-deb-display-callgraph-20261030/audit_native12_duonavi_screenblank_preferences.py
          PYTHONPATH="$RUNNER_TEMP/parser:sideplay/audit/qa130-six-deb-display-callgraph-20261030" python3 sideplay/audit/qa130-six-deb-display-callgraph-20261030/audit_native12_duonavi_screenblank_preferences.py \
            --Native12Derived "$RUNNER_TEMP/debs/native12.deb" \
            --DuoNavi104 "$RUNNER_TEMP/debs/duonavi.deb" \
            --out "$RUNNER_TEMP/omnicar-bks/NATIVE12_DUONAVI_BKS_PREFS.json"
          python3 -m json.tool "$RUNNER_TEMP/omnicar-bks/NATIVE12_DUONAVI_BKS_PREFS.json" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: exact-original-omnicar-bks-hook-callback-arm64
          path: ${{ runner.temp }}/omnicar-bks/*.json
          retention-days: 30
      - name: Persist only bounded original disassembly evidence in correct project
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=fix/duoface-qa130-verified-scene-owner-20261030
          REL=sideplay/audit/qa130-six-deb-display-callgraph-20261030
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$BRANCH"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            cp "$RUNNER_TEMP/omnicar-bks/DEEP_BKS_ARM64.json" "$TEMP/$REL/"
            cp "$RUNNER_TEMP/omnicar-bks/OMNICAR_IMPORT_CALLBACK_XREFS.json" "$TEMP/$REL/"
            cp "$RUNNER_TEMP/omnicar-bks/OMNICAR_ABHOST_METHOD_AND_UNBLANK_OWNER.json" "$TEMP/$REL/"
            cp "$RUNNER_TEMP/omnicar-bks/OMNICAR_DELAYED_UNBLANK_VALIDATED.json" "$TEMP/$REL/"
            cp "$RUNNER_TEMP/omnicar-bks/NATIVE12_DUONAVI_BKS_PREFS.json" "$TEMP/$REL/"
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$TEMP" add "$REL/DEEP_BKS_ARM64.json" "$REL/OMNICAR_IMPORT_CALLBACK_XREFS.json" "$REL/OMNICAR_ABHOST_METHOD_AND_UNBLANK_OWNER.json" "$REL/OMNICAR_DELAYED_UNBLANK_VALIDATED.json" "$REL/NATIVE12_DUONAVI_BKS_PREFS.json"
            if git -C "$TEMP" diff --cached --quiet;then
              git worktree remove --force "$TEMP"
              echo BKS_DEEP_ALREADY_SAVED
              exit 0
            fi
            git -C "$TEMP" commit -m 'audit: exact OmniCar BKS hook replacement ARM64 instructions [skip ci]'
            if git -C "$TEMP" push origin HEAD:refs/heads/"$BRANCH";then
              git worktree remove --force "$TEMP"
              echo BKS_DEEP_EVIDENCE_SAVED_TO_DUOFACE
              exit 0
            fi
            git worktree remove --force "$TEMP"
          done
          exit 1
