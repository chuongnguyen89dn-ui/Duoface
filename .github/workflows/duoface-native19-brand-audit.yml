name: DuoFace native19 read-only complete legacy brand audit
on:
  workflow_dispatch:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duoface-native19-brand-audit.yml'
permissions:
  contents: write
concurrency:
  group: duoface-native19-brand-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect immutable signed native19 package
        run: |
          set -euo pipefail
          deb=dist/payload-migration/native19/com.duoface.independent_0.1.0~native19_iphoneos-arm64.deb
          printf '%s  %s\n' 91feda0a7ff24bd7759b7448303d61fe774b16184e383fc11b6839186fa1ae1d "$deb" | sha256sum -c -
          python3 migration/full_payload/native_test/audit_branding.py \
            --deb "$deb" --out audit/payload-migration/NATIVE19_ALL_LEGACY_BRAND_BYTES.json
          python3 - <<'PY'
          import json
          r=json.load(open('audit/payload-migration/NATIVE19_ALL_LEGACY_BRAND_BYTES.json'))
          print('BRAND_HIT_TOTALS',r['total_detected_by_brand_encoding'])
          print('FILES_WITH_BRAND_HITS',[(x['path'],x['matches']) for x in r['affected_paths']])
          PY
      - name: Persist forensic audit in DuoFace, do not change package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/NATIVE19_ALL_LEGACY_BRAND_BYTES.json
          git commit -m 'audit: full native19 legacy brand byte inventory [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-native19-brand-baseline
          path: audit/payload-migration/NATIVE19_ALL_LEGACY_BRAND_BYTES.json
          if-no-files-found: warn
