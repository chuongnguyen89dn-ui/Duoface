name: Audit installed DuoFace candidate regression (read-only)
on:
  push:
    paths:
      - '.github/workflows/duoface-regression-readonly-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare actual packaged visual and menu hooks without building DEB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess,tarfile,tempfile,plistlib,json,os
          roots={
            'menu-zoom2':Path('dist/candidates/menu-zoom2/com.duonavi.app_1.0.3-12_menu-zoom2_iphoneos-arm64.deb'),
            'border-focus-red1':Path('dist/candidates/border-focus-red1/com.duonavi.app_1.0.3-12_border-focus-red1_iphoneos-arm64.deb')
          }
          result={}
          for name,deb in roots.items():
            assert deb.is_file(),deb
            with tempfile.TemporaryDirectory() as temp:
              root=Path(temp)/'root';root.mkdir()
              subprocess.run(['dpkg-deb','-x',str(deb),str(root)],check=True)
              payload={}
              for dylib in ('DuoFaceFullscreenBridge','DuoFaceVisualHook','DuoFaceDashboard'):
                f=root/f'var/jb/Library/MobileSubstrate/DynamicLibraries/{dylib}.dylib'
                item={'present':f.is_file()}
                if f.is_file():
                  b=f.read_bytes()
                  item.update(sha256=hashlib.sha256(b).hexdigest(),bytes=len(b))
                  strings=subprocess.run(['strings',str(f)],capture_output=True,text=True,check=True).stdout
                  item['symbol_hints']={k:k in strings for k in ['Zoom In','Zoom Out','Close App','borderPulse','dfStart','DuoFaceVisual12','CBBridgedSplitApp','CBMultitaskingOverlayView']}
                pl=root/f'var/jb/Library/MobileSubstrate/DynamicLibraries/{dylib}.plist'
                if pl.is_file():
                  item['filter']=plistlib.loads(pl.read_bytes())
                payload[dylib]=item
              result[name]=dict(deb_sha256=hashlib.sha256(deb.read_bytes()).hexdigest(),payload=payload)
          result['compare']={d:{
            'same_sha':result['menu-zoom2']['payload'][d].get('sha256')==result['border-focus-red1']['payload'][d].get('sha256'),
            'menu_zoom2_sha':result['menu-zoom2']['payload'][d].get('sha256'),
            'red1_sha':result['border-focus-red1']['payload'][d].get('sha256')
          } for d in ('DuoFaceFullscreenBridge','DuoFaceVisualHook','DuoFaceDashboard')}
          Path('audit/duoface-menu-border-regression-20261014.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY
      - name: Persist regression evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/duoface-menu-border-regression-20261014.json
          git diff --cached --quiet && exit 0
          git commit -m 'audit: compare existing DuoFace candidate hooks [skip ci]'
          for retry in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
          done
          exit 1
