name: DuoFace exact original OmniCar native map CFString and branch audit V2
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - 'sideplay/tools/audit_original_omnicar_native_map_cfstrings_v2.py'
      - '.github/workflows/duoface-original-omnicar-map-branches-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-original-omnicar-map-branches-v2
  cancel-in-progress: false
jobs:
  original-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Capstone ARM64 disassembler
        run: python3 -m pip install --break-system-packages capstone==5.0.7
      - name: Verify original OmniCar DEB SHA and decode CFString branch references
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Omnicar/main/com.anlai.omnicar_1.0.3_iphoneos-arm64.deb' -o "$RUNNER_TEMP/original-omnicar.deb"
          echo 'd9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd' " $RUNNER_TEMP/original-omnicar.deb" | sha256sum -c -
          python3 sideplay/tools/audit_original_omnicar_native_map_cfstrings_v2.py --deb "$RUNNER_TEMP/original-omnicar.deb" --out "$RUNNER_TEMP/OMNICAR_ORIGINAL_NATIVE_MAP_BRANCH_V2.json"
          python3 - "$RUNNER_TEMP/OMNICAR_ORIGINAL_NATIVE_MAP_BRANCH_V2.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["status"].startswith("ORIGINAL_ARM64")
          assert d["original_deb_sha256"]=="d9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd"
          assert len(d["methods"])==7
          assert d["methods"]["isCarPlayApp:"]["imp"]=="0xff20"
          for k,x in d["methods"].items():
              assert x["instruction_count"]>0,(k,x)
          print("ORIGINAL_NATIVE_MAP_CFSTRING_DISASM_METHOD_VERIFIED_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-original-omnicar-map-branches-${{ github.run_id }}
          path: ${{ runner.temp }}/OMNICAR_ORIGINAL_NATIVE_MAP_BRANCH_V2.json
          if-no-files-found: error
      - name: Save immutable evidence within DuoFace repository
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-jb-embedded-appbridge-20261020'
          TARGET="sideplay/audit/native12-083-rotation-20261028/OMNICAR_ORIGINAL_NATIVE_MAP_BRANCHES_V2_RUN_$GITHUB_RUN_ID.json"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$BRANCH"
            TMP="$(mktemp -d)"
            git worktree add --detach "$TMP" FETCH_HEAD
            git -C "$TMP" config user.name 'github-actions[bot]'
            git -C "$TMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            if test -e "$TMP/$TARGET"; then
              echo 'Run-specific archive already exists; no overwrite' >&2
              git worktree remove --force "$TMP"; exit 1
            fi
            mkdir -p "$(dirname "$TMP/$TARGET")"
            cp "$RUNNER_TEMP/OMNICAR_ORIGINAL_NATIVE_MAP_BRANCH_V2.json" "$TMP/$TARGET"
            git -C "$TMP" add "$TARGET"
            git -C "$TMP" commit -m "audit: archive original OmniCar Maps branch V2 run $GITHUB_RUN_ID [skip ci]"
            if git -C "$TMP" push origin "HEAD:refs/heads/$BRANCH"; then
              echo "ORIGINAL_NATIVE_MAP_V2_PERSISTED_RUN=$GITHUB_RUN_ID"
              git worktree remove --force "$TMP"; exit 0
            fi
            git worktree remove --force "$TMP"
          done
          exit 1
