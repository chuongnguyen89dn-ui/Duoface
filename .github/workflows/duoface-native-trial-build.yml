name: Build DuoFace Mới native test giữ nguyên 100 phần trăm UI gốc

on:
  push:
    branches:
      - feature/duoface-exact-payload-migration
    paths:
      - 'migration/full_payload/native_test/DuoFaceNoLeaseBridge.mm'
      - 'migration/full_payload/native_test/build_native_trial.py'
      - '.github/workflows/duoface-native-trial-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duoface-native-trial-build
  cancel-in-progress: false

jobs:
  compile-package-audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install rootless package tools
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid
          xcrun --sdk iphoneos --show-sdk-path
          ldid -h | head -n 5 || true
      - name: Compile Objective-C runtime adapter (no UI recompilation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duoface-native"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun clang++ -arch arm64 -isysroot "$sdk" -fobjc-arc -std=c++17 \
            -miphoneos-version-min=14.0 -dynamiclib \
            -Wl,-undefined,dynamic_lookup \
            -Wl,-install_name,@rpath/A_DuoFaceNativeNoLease.dylib \
            -framework Foundation -framework UIKit \
            'migration/full_payload/native_test/DuoFaceNoLeaseBridge.mm' \
            -o "$RUNNER_TEMP/duoface-native/A_DuoFaceNativeNoLease.dylib"
          ldid -S "$RUNNER_TEMP/duoface-native/A_DuoFaceNativeNoLease.dylib"
          file "$RUNNER_TEMP/duoface-native/A_DuoFaceNativeNoLease.dylib"
          lipo -archs "$RUNNER_TEMP/duoface-native/A_DuoFaceNativeNoLease.dylib"
          test "$(lipo -archs "$RUNNER_TEMP/duoface-native/A_DuoFaceNativeNoLease.dylib")" = "arm64"
      - name: Build separate-ID rootless native test package with original UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/payload-migration/native1
          dest='dist/payload-migration/native1/com.duoface.independent_0.1.0~native1_iphoneos-arm64.deb'
          python3 migration/full_payload/native_test/build_native_trial.py \
            --policy "$RUNNER_TEMP/duoface-native/A_DuoFaceNativeNoLease.dylib" \
            --out "$dest" \
            --report dist/payload-migration/native1/BAO_CAO.json | tee "$RUNNER_TEMP/native-build-summary.txt"
          dpkg-deb -f "$dest" | tee "$RUNNER_TEMP/native-control.txt"
          dpkg-deb -c "$dest" | tee "$RUNNER_TEMP/native-contents.txt"
          test "$(dpkg-deb -f "$dest" Package)" = 'com.duoface.independent'
          test "$(dpkg-deb -f "$dest" Version)" = '0.1.0~native1'
          test "$(dpkg-deb -f "$dest" Architecture)" = 'iphoneos-arm64'
          grep -F 'A_DuoFaceNativeNoLease.dylib' "$RUNNER_TEMP/native-contents.txt"
          grep -F 'DuoFaceDashboard.dylib' "$RUNNER_TEMP/native-contents.txt"
          grep -F 'DuoFaceFullscreenBridge.dylib' "$RUNNER_TEMP/native-contents.txt"
          grep -F 'DuoFaceVisualHook.dylib' "$RUNNER_TEMP/native-contents.txt"
          ! grep -Fq 'com.duonavi.sync.plist' "$RUNNER_TEMP/native-contents.txt"
          shasum -a 256 "$dest" | tee "$RUNNER_TEMP/native-sha256.txt"
      - name: Regression verify every original executable, image and filter unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,plistlib,subprocess,tarfile,io
          file=pathlib.Path('dist/payload-migration/native1/com.duoface.independent_0.1.0~native1_iphoneos-arm64.deb')
          audit=json.loads(pathlib.Path('dist/payload-migration/native1/BAO_CAO.json').read_text())
          base=json.loads(pathlib.Path('dist/payload-migration/EXACT_COPY_AUDIT.json').read_text())
          assert audit['status']=='ORIGINAL_UI_NATIVE_TRIAL_PACKAGE_BUILT_NOT_DEVICE_TESTED'
          assert audit['source_original_sha256']==base['source_sha256']
          assert audit['legacy_package_automatically_removed'] is False
          assert audit['installer_refuses_legacy_installed']
          assert not audit['sileo_published']
          assert audit['deb_sha256']==hashlib.sha256(file.read_bytes()).hexdigest()
          blob=subprocess.check_output(['dpkg-deb','--fsys-tarfile',str(file)])
          with tarfile.open(fileobj=io.BytesIO(blob)) as tar:
              files={x.name.removeprefix('./'):tar.extractfile(x).read()
                     for x in tar.getmembers() if x.isfile()}
          for name,sha in audit['original_unchanged_payload_sha256'].items():
              assert name in files,(name,'missing')
              assert hashlib.sha256(files[name]).hexdigest()==sha, (name,'modified')
          assert 'var/mobile/Library/Preferences/com.duonavi.sync.plist' not in files
          assert len(audit['original_unchanged_payload_sha256'])>=36
          print('NATIVE_ORIGINAL_UI_ASSET_BINARY_EXACT_MATCH',len(audit['original_unchanged_payload_sha256']))
          print('PACKAGE_INSTALL_GUARD_LEGACY_ACTIVE')
          print('NOT_DEVICE_TESTED_NOT_LICENSE_INDEPENDENCE_PROVEN')
          PY
          dpkg-deb --ctrl-tarfile 'dist/payload-migration/native1/com.duoface.independent_0.1.0~native1_iphoneos-arm64.deb' | tar -xOf - ./preinst | grep -F 'com.duonavi.app'
      - name: Commit test candidate to DuoFace branch (never auto-deploy to Sileo)
        shell: bash
        env:
          BRANCH: feature/duoface-exact-payload-migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/payload-migration/native1/BAO_CAO.json dist/payload-migration/native1/*.deb
          git commit -m 'artifact: native UI candidate with separate ID and install collision guard [skip ci]'
          for n in 1 2 3 4; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH" && exit 0
            sleep 2
          done
          exit 1
      - name: Save test candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duoface-native-trial-${{github.run_id}}
          path: |
            dist/payload-migration/native1/BAO_CAO.json
            dist/payload-migration/native1/*.deb
            ${{runner.temp}}/native-build-summary.txt
            ${{runner.temp}}/native-control.txt
            ${{runner.temp}}/native-contents.txt
            ${{runner.temp}}/native-sha256.txt
          if-no-files-found: warn
