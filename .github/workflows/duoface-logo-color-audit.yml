name: Audit approved DuoFace logo red
on:
  push:
    paths: ['.github/workflows/duoface-logo-color-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - name: Determine original logo red and persist exact result
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib,json
          p=Path('dist/visual-1.0.3-12/assets/duoface-logo.png')
          raw=p.read_bytes()
          im=Image.open(p).convert('RGBA').resize((32,16))
          pixels=list(im.getdata())
          best=None; score=0
          for i,(r,g,b,a) in enumerate(pixels):
              strength=r-max(g,b)
              if a>180 and r>100 and strength>score:
                  best=(r,g,b,a,i);score=strength
          if best is None: raise RuntimeError('Approved logo has no valid red pixel')
          r,g,b,a,i=best
          out={'logo_file':str(p),'sha256':hashlib.sha256(raw).hexdigest(),'sampler':'32x16 RGBA; alpha>180, red>100, maximize red-max(green,blue)','sample_index':i,'red_rgb':[r,g,b],'red_hex':f'#{r:02X}{g:02X}{b:02X}'}
          target=Path('audit/approved-logo-red.json')
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(out,indent=2)+'\n')
          print(target.read_text())
          PY
      - name: Commit color evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/approved-logo-red.json
          git diff --cached --quiet && exit 0
          git commit -m 'audit: persist exact approved DuoFace logo red pixel [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
          done
          exit 1
