name: Native12 original scene settings block invoke forensic (NO RELEASE)
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - '.github/workflows/native12-original-scene-block-invoke.yml'
      - 'sideplay/audit/native12-continuation-4888299/extract_scene_settings_block_invoke.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native12-original-scene-settings-invoke
  cancel-in-progress: true
jobs:
  original-scene-block-only:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify original sources and inspect executable (never run it)
        run: |
          set -euo pipefail
          command -v llvm-objdump || brew install llvm
          command -v dpkg-deb || brew install dpkg
          export PATH="/opt/homebrew/opt/llvm/bin:$PATH"
          command -v llvm-objdump
          mkdir -p "$RUNNER_TEMP/native12-block"
          git fetch --no-tags --depth=1 origin 1286a3ef868cf7e29804bcddf7e20b2eae707ce1
          git show '1286a3ef868cf7e29804bcddf7e20b2eae707ce1:dist/payload-migration/native12-speed8compact/com.duoface.independent_0.1.0~native12+speed8compact_iphoneos-arm64.deb' > "$RUNNER_TEMP/native12-block/native12.deb"
          echo '2fe8892c5ef8762e1e83b0fd6c4a029e25fc11758cc98fdbbb851bf6637e68ad  '"$RUNNER_TEMP/native12-block/native12.deb" | shasum -a 256 -c -
          git fetch --no-tags --depth=1 origin a57815b2430092a9c27811a88b53f9bbbb70312d
          git show 'a57815b2430092a9c27811a88b53f9bbbb70312d:sideplay/audit/qa7-vs-native12-methods-20261018/method-index.json' > "$RUNNER_TEMP/native12-block/method-index.json"
          test "$(git hash-object "$RUNNER_TEMP/native12-block/method-index.json")" = efa45df59bc3c16887cc979bf3aedc0c93c92111
          dpkg-deb -x "$RUNNER_TEMP/native12-block/native12.deb" "$RUNNER_TEMP/native12-block/root"
          BIN="$RUNNER_TEMP/native12-block/root/var/jb/Library/MobileSubstrate/DynamicLibraries/DuoFaceDashboard.dylib"
          echo '9e02a4bcee98fb703777122c67286158d9ca9cfa3088887b5ca280c580a695ea  '"$BIN" | shasum -a 256 -c -
          python3 sideplay/audit/native12-continuation-4888299/extract_scene_settings_block_invoke.py \
            --binary "$BIN" \
            --method-index "$RUNNER_TEMP/native12-block/method-index.json" \
            --original-instructions sideplay/audit/native12-continuation-4888299/gallery-media-imp/ORIGINAL_LAYOUT_IMP_INSTRUCTIONS.json \
            --out sideplay/audit/native12-continuation-4888299/scene-block-invoke
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('sideplay/audit/native12-continuation-4888299/scene-block-invoke/SCENE_SETTINGS_BLOCK_INVOKE_ARM64.json')
          d=json.loads(p.read_text())
          assert d["block_invoke_pc"]=="0xadc74" and d["dashboard_sha256"]=="9e02a4bcee98fb703777122c67286158d9ca9cfa3088887b5ca280c580a695ea"
          assert d["original_machine_instructions"] and d["vendor_binary_shipped"] is False
          print("ORIGINAL_SCENE_BLOCK_ARM64_EXTRACT_VERIFIED",len(d["original_machine_instructions"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Native12-Original-Scene-Block-Invoke-ReadOnly
          path: sideplay/audit/native12-continuation-4888299/scene-block-invoke/
          if-no-files-found: error
      - name: Persist exact original block evidence to DuoFace branch, no release
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-jb-embedded-appbridge-20261020'
          FILE='sideplay/audit/native12-continuation-4888299/scene-block-invoke/SCENE_SETTINGS_BLOCK_INVOKE_ARM64.json'
          SRC="$(pwd)/$FILE"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "$BRANCH"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            if test -s "$TEMP/$FILE"; then
              cmp "$SRC" "$TEMP/$FILE"
              git worktree remove --force "$TEMP"
              echo ORIGINAL_SCENE_BLOCK_EVIDENCE_ALREADY_IDENTICAL
              exit 0
            fi
            mkdir -p "$TEMP/$(dirname "$FILE")"
            cp "$SRC" "$TEMP/$FILE"
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$TEMP" add "$FILE"
            git -C "$TEMP" commit -m 'audit(native12): preserve original scene block invoke ARM64 bytes [skip ci]'
            if git -C "$TEMP" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$TEMP"
              echo ORIGINAL_SCENE_BLOCK_EVIDENCE_GITHUB_PERSISTED
              exit 0
            fi
            git worktree remove --force "$TEMP"
          done
          exit 1
