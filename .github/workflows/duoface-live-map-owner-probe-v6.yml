name: DuoFace V7 read-only live CarPlayApp Maps controller/scene owner probe
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - 'sideplay/native-carplay-scene-v1/**'
      - '.github/workflows/duoface-live-map-owner-probe-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-live-map-owner-probe-v6
  cancel-in-progress: false
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check existing probe safety tests and new read-only controller scanner
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sideplay/native-carplay-scene-v1/tests -p 'test_*.py' -v
          python3 - <<'PY'
          from pathlib import Path
          s=Path('sideplay/native-carplay-scene-v1/DFCarPlayLiveOwnerSnapshot.m').read_text()
          for forbidden in ('%hook', 'MSHookMessageEx', 'foregroundSceneWithSettings:', 'backgroundSceneWithCompletion:',
                            'setRootViewController:', 'requestStateChange:', 'setFrame:'):
              assert forbidden not in s,forbidden
          assert 'mapsNativeOwnerProven' in s and 'viewIfLoaded' in s
          assert 'DFInspectOwner' in s and 'method_getNumberOfArguments' in s
          print('PASS: read-only diagnostic source gate')
          PY
      - name: Install rootless Theos toolchain
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          brew install ldid dpkg
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build and inspect isolated diagnostic DEB
        run: |
          set -euo pipefail
          cd sideplay/native-carplay-scene-v1
          make clean package FINALPACKAGE=1
          shopt -s nullglob
          debs=(packages/*.deb)
          test "${#debs[@]}" = 1
          deb="${debs[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "com.duoface.carplay.nativejoinprobe"
          test "$(dpkg-deb -f "$deb" Version)" = "0.0.5~mapowner2"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          dest="$GITHUB_WORKSPACE/sideplay/test-artifacts/native-map-owner-v7/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          cp "$deb" "$dest/"
          dpkg-deb -c "$deb" > "$dest/DEB_FILE_LIST.txt"
          grep -F '/DFNativeSceneJoinProbe.dylib' "$dest/DEB_FILE_LIST.txt"
          grep -F '/DFNativeSceneJoinProbe.plist' "$dest/DEB_FILE_LIST.txt"
          mkdir -p "$RUNNER_TEMP/duoface-probe-extract"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/duoface-probe-extract"
          find "$RUNNER_TEMP/duoface-probe-extract" -name 'DFNativeSceneJoinProbe.plist' -print -quit > "$RUNNER_TEMP/filter-path"
          FILTER="$(cat "$RUNNER_TEMP/filter-path")"
          test -s "$RUNNER_TEMP/filter-path"
          FILTER="$FILTER" python3 - <<'PY'
          import os,plistlib
          with open(os.environ['FILTER'],'rb') as f: p=plistlib.load(f)
          assert p['Filter']['Executables']==['CarPlay','CarPlayApp'], p
          print('PASS: only CarPlay processes injected')
          PY
          (cd "$dest" && shasum -a 256 *.deb > SHA256SUMS.txt)
          {
            echo "SOURCE_SHA=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "STATUS=COMPILED_ONLY"
            echo "INSTALL_TESTED=false"
            echo "MAPS_RUNNING_SNAPSHOT_CAPTURED=false"
            echo "NATIVE_MAPS_OWNER_VERIFIED=false"
            echo "SILEO_PUBLISHED=false"
            echo "LOG_PATH=/var/mobile/Library/Logs/DuoFaceCarPlayOwnerSnapshot.log"
          } > "$dest/BUILD_EVIDENCE.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-native-map-owner-v7
          path: sideplay/test-artifacts/native-map-owner-v7/runs/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
      - name: Persist compiled DEB, checksum and evidence in DuoFace repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "sideplay/test-artifacts/native-map-owner-v7/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "artifacts: save isolated V6 CarPlay live owner diagnostic and build evidence"
          # Head may advance while the runner compiles. Rebase only the generated
          # artifact commit on the actual remote head; never force-push.
          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"  # unique run-scoped artifact, no binary conflicts
          git push origin "HEAD:${GITHUB_REF_NAME}"
