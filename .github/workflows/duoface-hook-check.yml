name: DuoFace visual hook build (test artifact only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/DuoFaceVisualHook.m'
      - '.github/workflows/duoface-hook-check.yml'
permissions:
  contents: read
jobs:
  compile-hook:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install iOS build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          SDK="$(find "$RUNNER_TEMP/theos/sdks" -maxdepth 1 -type d -name '*.sdk' | sort -V | tail -1)"
          test -n "$SDK"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"
      - name: Compile ARM64 rootless hook without publishing
        shell: bash
        run: |
          set -euo pipefail
          SDK="$SDKROOT"
          CLANG="$(xcrun --find clang)"
          "$CLANG" -target arm64-apple-ios15.0 -isysroot "$SDK" \
            -I"$THEOS/include" -I"$THEOS/include/_fallback" \
            -fno-objc-arc -fsyntax-only src/DuoFaceVisualHook.m
      - name: Build and sign ARM64 test hook dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          "$(xcrun --find clang)" -target arm64-apple-ios15.0 -isysroot "$SDKROOT" \
            -fno-objc-arc -dynamiclib -undefined dynamic_lookup \
            -framework UIKit -framework Foundation \
            -Wl,-install_name,@rpath/DuoFaceVisualHook.dylib \
            -o dist/DuoFaceVisualHook.dylib src/DuoFaceVisualHook.m
          ldid -S dist/DuoFaceVisualHook.dylib
          file dist/DuoFaceVisualHook.dylib
          shasum -a 256 dist/DuoFaceVisualHook.dylib | tee dist/SHA256SUMS
      - name: Package separate rootless test tweak DEB
        shell: bash
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/duoface-testpkg"
          mkdir -p "$PKG/DEBIAN" "$PKG/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp dist/DuoFaceVisualHook.dylib "$PKG/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          cat > "$PKG/var/jb/Library/MobileSubstrate/DynamicLibraries/DuoFaceVisualHook.plist" <<'PLIST'
          { Filter = { Bundles = ( "com.apple.CarPlay", "com.apple.springboard" ); }; }
          PLIST
          cat > "$PKG/DEBIAN/control" <<'CONTROL'
          Package: com.duoface.visualhook-test
          Name: DuoFace Visual Hook TEST
          Version: 1.0.3-10~hooktest
          Architecture: iphoneos-arm64
          Description: Experimental visual hook; not verified on CarPlay
          Maintainer: DuoFace
          Section: Tweaks
          Priority: optional
          CONTROL
          dpkg-deb --build --root-owner-group "$PKG" dist/DuoFaceVisualHook_TEST_1.0.3-10_iphoneos-arm64.deb
          dpkg-deb --field dist/DuoFaceVisualHook_TEST_1.0.3-10_iphoneos-arm64.deb Package Architecture
          dpkg-deb --contents dist/DuoFaceVisualHook_TEST_1.0.3-10_iphoneos-arm64.deb | tee dist/DEB_CONTENTS.txt
          grep -q 'DuoFaceVisualHook.dylib' dist/DEB_CONTENTS.txt
          grep -q 'DuoFaceVisualHook.plist' dist/DEB_CONTENTS.txt
          shasum -a 256 dist/DuoFaceVisualHook_TEST_1.0.3-10_iphoneos-arm64.deb >> dist/SHA256SUMS
      - name: Upload test artifact (NOT Sileo release)
        uses: actions/upload-artifact@v4
        with:
          name: duoface-hook-arm64-test
          path: dist/
          if-no-files-found: error
      - name: Mark build limitations
        run: |
          echo 'Standalone experimental rootless hook test DEB; bundle filter unverified. No Sileo publish.' >> "$GITHUB_STEP_SUMMARY"
