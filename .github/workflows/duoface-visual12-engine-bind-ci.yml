name: DuoFace Visual12 standalone engine and CB facade link test
on:
  push:
    branches: [feature/visual12-duodash-recovery]
    paths:
      - 'replacement/visual12/engine/**'
      - 'replacement/visual12/tests/test_native_shell_structure.py'
      - 'scripts/audit_native12_ui_dimensions.py'
      - 'scripts/check_native12_deb_ui_bridge_contract.py'
      - 'scripts/test_original104_function_native12_visual_focus.py'
      - 'audit/native12-deb-original104-ui/FOCUS_ORIGINAL104_NATIVE12_UI_CROSSWALK.json'
      - 'audit/native12-deb-original104-ui/METRICS.json'
      - 'replacement/visual12/fullscreen/**'
      - 'replacement/cb-compat/**'
      - '.github/workflows/duoface-visual12-engine-bind-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visual12-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine-link:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Audit Native12 UI dimensions against source evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_native12_ui_dimensions.py --strict \
            --json "$RUNNER_TEMP/native12-ui-dimensions.json" \
            --md "$RUNNER_TEMP/native12-ui-dimensions.md"
      - name: Verify actual Native12 DEB assets and original104-to-DuoFace bridge contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_native12_deb_ui_bridge_contract.py
      - name: Verify Native12 independent visual class/view-tree contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 replacement/visual12/tests/test_native_shell_structure.py
      - name: Verify original104 functional and Native12 visual UI focus contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_original104_function_native12_visual_focus.py
      - name: Compile and link source-only CarPlay owner with CB facade
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -arch arm64 \
            -isysroot "$SDK" -fobjc-arc -fblocks -dynamiclib -DDFCARPLAY_QA=1 \
            -Os -Wall -Wextra -Wno-unused-parameter \
            -Wl,-headerpad,0x1000 -Wl,-install_name,@rpath/DuoFaceVisual12Engine.dylib \
            -I replacement/cb-compat -I runtime/fullscreen \
            -framework UIKit -framework Foundation -framework CoreFoundation \
            -framework CoreGraphics -framework QuartzCore -lobjc \
            -o "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib" \
            replacement/visual12/engine/runtime/DFIRuntime.m \
            replacement/visual12/engine/runtime/DFCarPlaySplitCoordinator.m \
            replacement/visual12/engine/runtime/DFCarPlayQARootController.m \
            replacement/cb-compat/DFCBCompat.m \
            replacement/visual12/fullscreen/DFVisual12HostGeometry.m
          test "$(xcrun lipo -archs "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib")" = arm64
          for cls in DFINativeWindowSurface DFINativeSplitSurface DFINativeSlotPillView DFINativeDividerTrack DFINativeDividerLogo DFINativePickerCard DFINativePickerMenuBar; do
            xcrun nm -gU "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib" | grep -F '_OBJC_CLASS_$_'"$cls"
          done
          xcrun nm -gU "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib" | grep -F '_DFCBBindHost'
          xcrun nm -gU "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib" | grep -F '_DFCBUnbindHost'
          xcrun nm -gU "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib" | grep -F 'DFCarPlaySplitCoordinator'
          xcrun nm -gU "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib" | grep -F 'DFCarPlayQARootController'
          xcrun otool -L "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib"
          shasum -a 256 "$RUNNER_TEMP/DuoFaceVisual12Engine.dylib"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -arch arm64 \
            -isysroot "$SDK" -fobjc-arc -fblocks -Wall -Wextra -Wno-unused-parameter \
            -c replacement/visual12/engine/shared/DFISettings.m \
            -o "$RUNNER_TEMP/DFV12Settings.o"
          xcrun nm "$RUNNER_TEMP/DFV12Settings.o" | grep -F "DFV12SettingsController"
      - name: Check lifecycle source and package boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('replacement/visual12/engine')
          runtime=(root/'runtime/DFIRuntime.m').read_text()
          facade=Path('replacement/cb-compat/DFCBCompat.m').read_text()
          identity=json.loads(Path('replacement/visual12/STANDALONE_PACKAGE_IDENTITY.json').read_text())
          assert identity['package_id']==identity['app_bundle_id']=='com.duoface.visual12'
          assert identity['separate_from_hub_package']=='com.duoface.independent'
          assert 'DFCBBindHost(window, DFIRoot, &hostError)' in runtime
          assert 'DFCBUnbindHost(DFIWindow)' in runtime
          assert 'DFInstallHostGeometryHooks();' in runtime
          geometry=Path('replacement/visual12/fullscreen/DFVisual12HostGeometry.m').read_text()
          for name in ('DFHostCanExpand','DFHostSetExpanded','DFHostRestore','DFInstallHostGeometryHooks'):
              assert name in geometry
          assert 'DFCBSetLifecycleCallback' in geometry
          interface=(root/'runtime/DFIInterface.inc').read_text()
          settings=(root/'shared/DFISettings.m').read_text()
          all_source=runtime+interface+settings
          assert 'DFHostSetExpanded(expanded,&reason)' in interface
          assert 'DFV12SceneHost' in all_source
          assert 'DFV12SplitController' in all_source
          assert 'DFV12SettingsController' in settings
          for old in ('@implementation DFISceneHost','@implementation DFISplitController',
                      '@implementation DFIList','@implementation DFILayoutIcon',
                      '@implementation DFIHomeGestureTarget','@implementation DFISettingsController'):
              assert old not in all_source,old

          assert '@implementation CBWindow' not in geometry
          assert runtime.index('DFCBUnbindHost(DFIWindow)') < runtime.index('[DFIRoot shutdown]')
          assert 'DFIWindow=window' in runtime
          assert 'DFIWindow.hidden=YES' in runtime
          assert 'CBBridgeManager' in runtime
          api=(root/'runtime/DFCarPlayBridgeAPI.h').read_text()
          coordinator=(root/'runtime/DFCarPlaySplitCoordinator.m').read_text()
          hostHeader=(root/'runtime/DFIRuntime.h').read_text()
          assert '@protocol DFCarPlayBridgeAPI' in api
          assert '@interface DFCarPlaySplitCoordinator' in api
          assert 'host.ready=' in coordinator
          assert 'host.failure=' in coordinator
          assert 'self.pending[@(pane)]=[completion copy]' in coordinator
          assert 'finishPane:pane host:active error:nil' in coordinator
          assert 'NSClassFromString(@"CBBridgeManager")' in coordinator
          assert 'window.rootViewController!=self.root' in coordinator
          assert 'dispatch_get_main_queue()' in coordinator
          assert 'moveToContainer:' in hostHeader
          assert 'self.container=container;' in runtime
          assert 'alloc]initWithDisplayConfiguration:' not in coordinator
          for forbidden in ('CBLicenseSyncManager','DDz2','SidePlay.dylib','com.duoface.independent'):
              assert forbidden not in coordinator,forbidden
          qa=(root/'runtime/DFCarPlayQARootController.m').read_text()
          assert '#if DFCARPLAY_QA' in runtime
          assert '#if DFCARPLAY_QA' in qa
          assert 'if([DFIPref(@"qaEnabled") boolValue]) return;' in runtime
          assert 'DFIWindow=window; DFIQARoot=root;' in runtime
          assert 'if(DFIWindow && DFIRoot) DFCBUnbindHost(DFIWindow)' in runtime
          for signal in ('qa.start','qa.g1','qa.g2','qa.stop'):
              assert 'com.duoface.carplay.'+signal in runtime
          assert '@implementation DFCarPlayQARootController' in qa
          assert 'G1-scene-attached' in qa and 'G2-two-scenes-present' in qa
          assert 'hasLiveSceneInPane:0' in qa and 'hasLiveSceneInPane:1' in qa
          assert 'DuoFaceCarPlayQA.log' in qa
          assert 'initWithDisplayConfiguration:' not in qa
          assert 'UIWindow alloc' not in qa
          assert 'com.duoface.independent' not in qa
          print('DFCARPLAY_QA_ROOT_G1_G2_WIRING_STATIC_PASS_NO_DEVICE_QA')
          print('DFCARPLAY_TWO_PANE_CONTRACT_STATIC_PASS_NO_DEVICE_QA')
          assert 'com.duoface.independent' not in runtime
          assert 'com.duoface.independent' not in facade
          assert '@implementation DFCBBridgeManager' in facade
          assert '@implementation DFCBWindow' in facade
          assert '@implementation CBBridgeManager' not in facade
          assert '@implementation CBWindow' not in facade
          assert identity['can_publish_to_sileo'] is False
          print('VISUAL12_CB_OWNER_BIND_LIFECYCLE_STATIC_PASS')
          print('NO_DEVICE_VALIDATION_NO_SILEO_DEPLOY')
          PY
      - name: Upload comprehensive geometry inventory (no DEB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duoface-native12-ui-dimensions-static
          path: |
            ${{ runner.temp }}/native12-ui-dimensions.json
            ${{ runner.temp }}/native12-ui-dimensions.md
          if-no-files-found: warn
      - name: Upload compile-only CarPlay engine (NOT a Sileo package)
        uses: actions/upload-artifact@v4
        with:
          name: duoface-carplay-qa-root-arm64-compile-only
          path: ${{ runner.temp }}/DuoFaceVisual12Engine.dylib
          if-no-files-found: error
          retention-days: 90
