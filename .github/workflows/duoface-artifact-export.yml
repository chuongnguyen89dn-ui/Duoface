name: Export latest successful DuoFace test DEB # retry export
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/duoface-artifact-export.yml'
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download successful build artifact using GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --workflow duoface-hook-check.yml --status success --limit 10 --json databaseId,conclusion | tee /tmp/duoface-runs.json
          python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/duoface-runs.json'))
          if not runs: raise SystemExit('No successful DuoFace hook runs')
          open('/tmp/duoface-run-ids','w').write('\n'.join(str(r['databaseId']) for r in runs))
          PY
          mkdir -p dist/test-artifacts
          found=0
          while IFS= read -r runid; do
            mkdir -p /tmp/duoface-download
            if gh run download "$runid" --name duoface-hook-arm64-test --dir /tmp/duoface-download; then
              found=1
              echo "$runid" > /tmp/duoface-selected-run
              break
            fi
          done < /tmp/duoface-run-ids
          test "$found" -eq 1
          find /tmp/duoface-download -type f -maxdepth 4 -print
          find /tmp/duoface-download -type f -name '*.deb' -exec cp {} dist/test-artifacts/ \;
          test "$(find dist/test-artifacts -name '*.deb' | wc -l)" -eq 1
          sha256sum dist/test-artifacts/*.deb > dist/test-artifacts/SHA256SUMS
          printf 'Source run: %s\nTEST HOOK ONLY; NOT FINAL DUOFACE APP\n' "$(cat /tmp/duoface-selected-run)" > dist/test-artifacts/README.txt
      - name: Upload DEB and metadata to this workflow
        uses: actions/upload-artifact@v4
        with:
          name: duoface-exported-test-deb
          path: dist/test-artifacts/
          if-no-files-found: error
      - name: Commit test DEB into repo for stable download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/test-artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "build: export verified DuoFace test DEB [skip ci]"
            git push
          fi
