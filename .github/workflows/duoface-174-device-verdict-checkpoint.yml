name: QA174 device contract review - documentation only
on:
  push:
    branches: [fix/qa173-logo-map-touch-recall-20261106]
    paths: ['.github/workflows/duoface-174-device-verdict-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa174-device-verdict-docs
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tiep tuc du an.md
            /sideplay/tiep tuc du an.md
            /sideplay/audit/qa174-device-rejected-20261106/
      - name: Preserve history and record superseding user contract
        env:
          BRANCH: fix/qa173-logo-map-touch-recall-20261106
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chuongnguyen89dn-ui/Duoface'
          test "$GITHUB_REF_NAME" = "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$BRANCH"
            git checkout --detach FETCH_HEAD
            python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import os, subprocess
          marker = '## CHECKPOINT QA174-USER-WAKE-CONTRACT-20261106'
          report_path = 'sideplay/audit/qa174-device-rejected-20261106/MECHANISM_REVIEW_20261106.md'
          report = Path(report_path).read_text(encoding='utf-8')
          assert 'DFUnderLockBackground123' in report
          assert 'MUST NOT activate the app underneath' in report
          assert 'FAILED' in report
          assert Path('sideplay/audit/qa174-device-rejected-20261106/FINDINGS.md').is_file()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          stamp = datetime.now(timezone.utc).isoformat()
          run = os.environ['GITHUB_RUN_ID']
          note = '\n'.join([
              marker, '',
              '- LATEST USER CONTRACT: hidden controls -> first contact in owned app pane wakes controls and is CONSUMED; visible controls -> ordinary touches pass unchanged. This SUPERSEDES the assistant-authored passive-only / never-consume-first-tap policy in earlier QA179 and QA174 entries. Preserve history below; do not enforce the older conflicting instruction.',
              '- Current QA174 source actually returns nil from DFNativeWakeGateView and observes/returns the original target in DFSceneSurface.hitTest; its QA172w2 source test explicitly forbids interception. That is a confirmed contract mismatch, not proof of correct behavior. Existing logoWakeOnlyTap is a concrete wake-only precedent. Proposed in-path gate must own the entire wake contact through Ended/Cancelled, never replay it or eat subsequent visible-state touches; no global shield/window, keyboard reflow or independent red-border wake.',
              '- App architecture review: current refreshInstalledApps filters selectedSet before native classification, not a native-plus-selected union. Native category, selected phone-bridge category and per-pane selection must remain distinct. In-car picker, live pane rendering/input and Home icons OUTSIDE DuoFace are THREE separate acceptance criteria; do not mark Home done from picker changes.',
              '- Important corrections to supplied document: native coordinator ALREADY has beginPendingLaunch -> DFNativeMapDispatchLaunchGuarded -> dashboard handleEvent:, so it does not merely wait passively. DFSceneLifecycle ALREADY installs SBSuspendedUnderLockManager._shouldBeBackgroundUnderLockForScene:withSettings: and post-lock intercept; do not duplicate hooks. One geometry authority per scene is valid, but two competing writers to the SAME scene and screen-blank as present root cause are not yet proved.',
              '- Evidence-based assessment and exact source/reference paths: `' + report_path + '` (created in commit 0458b2712ad1ac0a0f1bc65d270270241267a24b). Runtime/code review pinned to 2336b9e8b65f87bc3c0803924cfa1429a73afaef, compiled QA174 source d8144d3c58833764fbc6a53e25044682adf852e2. User request is document assessment; no runtime source patch, app test, DEB build or Sileo deployment performed here.',
              '- QA174 user device rejection REMAINS FAILED. No fresh device log was supplied or used. No log is needed to recognize the wrong wake contract or selected-only roster; runtime evidence is still needed to identify native launch rejection and validate eventual touch/geometry behavior. Next: behavioral wake regression -> correct owned in-path gate -> roster and explicit per-app launch/ownership crosswalk -> separate Home publication. Preserve GOFA, keyboard, media and divider.',
              '- Reused documentation-only checkpoint workflow; success is NOT device functionality. Docs run: ' + run + '; UTC: ' + stamp + '; pre-write HEAD: ' + head + '.',
              '', ''
          ])
          for name in ('sideplay/tiep tuc du an.md', 'tiep tuc du an.md'):
              path = Path(name)
              original = path.read_text(encoding='utf-8')
              if marker not in original:
                  path.write_text(note + original, encoding='utf-8')
                  assert path.read_text(encoding='utf-8').endswith(original)
              assert marker in path.read_text(encoding='utf-8')
          print('USER_CONTRACT_REVIEW_CHECKPOINTED_NOT_IMPLEMENTED', head, report_path)
          PY
            git add -- 'sideplay/tiep tuc du an.md' 'tiep tuc du an.md'
            if git diff --cached --quiet; then
              echo DOCS_ALREADY_CURRENT
              exit 0
            fi
            git commit -m 'docs: supersede passive wake policy; record verified versus unproved OmniCar assertions [skip ci]'
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              git show -s --format='%H %s'
              exit 0
            fi
          done
          echo 'Documentation push conflicted; no force-push performed' >&2
          exit 1
