name: DuoFace Smart Connection policy compile and test (no DEB)
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - 'runtime/connection/**'
      - 'tests/connection_policy_tests.cpp'
      - '.github/workflows/duoface-smart-connection-policy-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-linux-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual C++17 engine, run deterministic scenarios
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/df-policy"
          "$CXX" -std=c++17 -Wall -Wextra -Werror -pedantic -O2 \
            runtime/connection/DFConnectionPolicy.cpp tests/connection_policy_tests.cpp \
            -o "$RUNNER_TEMP/df-policy/test"
          "$RUNNER_TEMP/df-policy/test"
      - name: Confirm no DEB or Sileo deployment
        run: |
          echo 'Compile + deterministic policy tests only; native12 package immutable.'
