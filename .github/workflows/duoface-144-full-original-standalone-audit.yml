name: QA144 five original DEBs full Home-to-app forensic NO SILEO
on:
  push:
    branches: [feature/duoface-qa144-standalone-carplay-home-20261031]
    paths:
      - '.github/workflows/duoface-144-full-original-standalone-audit.yml'
      - 'sideplay/audit/qa144-standalone-home-20261031/scan_original_full_ownership.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa144-full-original-debs
  cancel-in-progress: false
jobs:
  offline-original-forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read three actual skill ZIPs and set up original ARM64 parser
        run: |
          set -euo pipefail
          for item in \
            '01-github-continuity.zip 80efec9a6cbbb49135eabeafb339bf13f74ff6ddef9706659871b30a2c020d7e' \
            '02-ios-deb-ipa-carplay.zip c87b5ed9ef196c13f42dd41df49a032369028742cc8f6d56569637daf76ec7cf' \
            '05-research-debug-testing.zip fcb1122412a11664c2c6b8666cbc4f76e86ad20f96e697138d96c6425137dc98'; do
            read -r name hash <<< "$item"
            curl -fLsS --retry 4 "https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills/$name" -o "$RUNNER_TEMP/$name"
            echo "$hash  $RUNNER_TEMP/$name" | sha256sum -c -
            unzip -t "$RUNNER_TEMP/$name" >/dev/null
            unzip -p "$RUNNER_TEMP/$name" SKILL.md | head -40
          done
          python3 -m pip install --quiet --break-system-packages capstone==5.0.7
          mkdir -p "$RUNNER_TEMP/parser"
          git fetch --no-tags --depth 1 origin feature/visual12-duodash-recovery
          git show FETCH_HEAD:migration/full_payload/native_test/audit_native12_license_class_xrefs.py > "$RUNNER_TEMP/parser/audit_native12_license_class_xrefs.py"
          python3 -m py_compile sideplay/audit/qa144-standalone-home-20261031/scan_original_full_ownership.py
      - name: Retrieve and SHA-verify five real original/reference DEBs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/originals"
          cp dist/com.duonavi.app_1.0.4_iphoneos-arm64.deb "$RUNNER_TEMP/originals/duonavi.deb"
          cp com.sideplay_1.0.4-1_iphoneos-arm64.deb "$RUNNER_TEMP/originals/sideplay.deb"
          curl -fLsS --retry 4 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Duoface/1286a3ef868cf7e29804bcddf7e20b2eae707ce1/dist/payload-migration/native12-speed8compact/com.duoface.independent_0.1.0~native12+speed8compact_iphoneos-arm64.deb' -o "$RUNNER_TEMP/originals/native12.deb"
          curl -fLsS --retry 4 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/Omnicar/bafc2441d280707ac1fbfd210780a51bdf69da95/com.anlai.omnicar_1.0.3_iphoneos-arm64.deb' -o "$RUNNER_TEMP/originals/omnicar.deb"
          curl -fLsS --retry 4 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/main/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb' -o "$RUNNER_TEMP/originals/duodash_repack.deb"
          printf '%s  %s\n' f3f911de5db461d487ce91249aed1bb25d44f076e7ff5fb89e54b658569328dd "$RUNNER_TEMP/originals/duonavi.deb" \
            7f8520b9a29013988f0430414c3c90308206a46ec689190ba4e1e2d9a0703a9c "$RUNNER_TEMP/originals/sideplay.deb" \
            2fe8892c5ef8762e1e83b0fd6c4a029e25fc11758cc98fdbbb851bf6637e68ad "$RUNNER_TEMP/originals/native12.deb" \
            d9297b010cdc08e401439b7332413f79cb1a056a05159a5deb673e218d76d9fd "$RUNNER_TEMP/originals/omnicar.deb" \
            ea0d3bb8c8b9da2b45c3f158f390a7966419e84899f820d06f45cd51401fa465 "$RUNNER_TEMP/originals/duodash_repack.deb" > "$RUNNER_TEMP/sha.txt"
          sha256sum -c "$RUNNER_TEMP/sha.txt"
      - name: Run five whole DEB file/MachO audits and decode six DuoNavi native Home handler bodies
        run: |
          set -euo pipefail
          OUT='sideplay/audit/qa144-standalone-home-20261031/ci-out'
          mkdir -p "$OUT"
          PYTHONPATH="$RUNNER_TEMP/parser:sideplay/audit/carplay-home-icons-20261030" \
            python3 sideplay/audit/qa144-standalone-home-20261031/scan_original_full_ownership.py \
              --duonavi "$RUNNER_TEMP/originals/duonavi.deb" \
              --native12 "$RUNNER_TEMP/originals/native12.deb" \
              --duodash_repack "$RUNNER_TEMP/originals/duodash_repack.deb" \
              --omnicar "$RUNNER_TEMP/originals/omnicar.deb" \
              --sideplay "$RUNNER_TEMP/originals/sideplay.deb" --out "$OUT"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("sideplay/audit/qa144-standalone-home-20261031/ci-out")
          d=json.loads((p/"ALL_FIVE_DEBS_FILES_MACHO_PLISTS_AND_METHODS.json").read_text())
          h=json.loads((p/"ORIGINAL_DUONAVI_NATIVE_HOME_TAP_DECODED.json").read_text())
          assert len(d)==5 and len(h)==6
          assert all(x["macho_count"]>=1 and x["file_count"]>10 for x in d.values())
          print("QA144_ORIGINAL_FIVE_WHOLE_DEBS_AND_SIX_HOME_HANDLERS_PASS")
          PY
          printf 'RUN_ID=%s\nSOURCE_SHA=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$OUT/CI_RESULT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: QA144-original-five-DEBs-all-MachO-six-native-Home-handlers
          path: sideplay/audit/qa144-standalone-home-20261031/ci-out/
          if-no-files-found: error
      - name: Persist and refetch exact audit output in DuoFace repository
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-qa144-standalone-carplay-home-20261031'
          REL="sideplay/audit/qa144-standalone-home-20261031/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$BRANCH"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            mkdir -p "$TEMP/$REL"
            cp sideplay/audit/qa144-standalone-home-20261031/ci-out/* "$TEMP/$REL/"
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$TEMP" add "$REL"
            git -C "$TEMP" commit -m 'audit(qa144): archive five original full DEBs and six original native Home methods [skip ci]'
            if git -C "$TEMP" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$TEMP"
              git fetch --no-tags origin "$BRANCH"
              git cat-file -e "FETCH_HEAD:$REL/ORIGINAL_OWNER_PIPELINE_VERDICT.md"
              git cat-file -e "FETCH_HEAD:$REL/ORIGINAL_DUONAVI_NATIVE_HOME_TAP_DECODED.json"
              echo QA144_ORIGINAL_STATIC_FORENSIC_SAVED_AND_VERIFIED
              exit 0
            fi
            git worktree remove --force "$TEMP"
          done
          exit 1
