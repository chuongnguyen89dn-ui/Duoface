name: DuoFace Native12 speed5scene independent live Sileo verification
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duoface-native12-speed5scene-sileo-public-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Check one live independent DuoFace, preserve legacy, download exact DEB
        shell: bash
        run: |
          set -euo pipefail
          base='https://chuongnguyen89dn-ui.github.io/carplaydsp'
          mkdir -p "$RUNNER_TEMP/df-speed5scene-live"
          cd "$RUNNER_TEMP/df-speed5scene-live"
          for i in $(seq 1 50); do
            curl -fLs --retry 2 --retry-delay 3 "$base/Packages" -o Packages || true
            if grep -Fq 'Version: 0.1.0~native12+speed5scene' Packages 2>/dev/null; then break; fi
            echo "Pages speed5scene pending attempt $i"
            sleep 12
          done
          grep -Fq 'Version: 0.1.0~native12+speed5scene' Packages
          curl -fLs --retry 5 --retry-delay 3 "$base/Packages.gz" -o Packages.gz
          gzip -dc Packages.gz > Packages.decoded
          cmp Packages Packages.decoded
          python3 - <<'PY'
          from pathlib import Path
          blocks=[]
          for block in Path('Packages').read_text().split('\n\n'):
              d={}
              for line in block.splitlines():
                  if ': ' in line and not line.startswith(' '):
                      k,v=line.split(': ',1);d[k]=v
              if d.get('Package'): blocks.append(d)
          independent=[p for p in blocks if p.get('Package')=='com.duoface.independent']
          legacy=[p for p in blocks if p.get('Package')=='com.duonavi.app']
          assert len(independent)==1,independent
          assert len(legacy)==1,legacy
          p=independent[0]
          assert p['Version']=='0.1.0~native12+speed5scene'
          assert p['Architecture']=='iphoneos-arm64'
          assert p['SHA256']=='87d2223a065d0ef9649c7da9c82105de90fde5b28b94a8a4bd4722ba7235e3d9'
          assert p['Filename']=='debs/com.duoface.independent_0.1.0~native12+speed5scene_iphoneos-arm64.deb',p
          Path('download-path.txt').write_text(p['Filename']+'\n')
          print('LIVE_SILEO_APT_SPEED5SCENE_ONE_INDEPENDENT_AND_LEGACY_PRESERVED_PASS')
          PY
          curl -fLs --retry 5 --retry-delay 3 "$base/$(cat download-path.txt)" -o speed5scene.deb
          echo '87d2223a065d0ef9649c7da9c82105de90fde5b28b94a8a4bd4722ba7235e3d9  speed5scene.deb' | sha256sum -c -
          test "$(dpkg-deb -f speed5scene.deb Package)" = com.duoface.independent
          test "$(dpkg-deb -f speed5scene.deb Version)" = '0.1.0~native12+speed5scene'
          test "$(dpkg-deb -f speed5scene.deb Architecture)" = iphoneos-arm64
          dpkg-deb --contents speed5scene.deb > CONTENTS.txt
          for n in DuoFaceDashboard DuoFaceSpeedHUD DuoFaceFullscreenBridge DuoFaceVisualHook; do
            grep -Fq "$n.dylib" CONTENTS.txt
          done
          ! grep -E 'DuoFaceSpeedSources|VietMapGoogleMapsSource|WazeGMapHUDSource|GofaGMapHUDSource|GMapHUDOverspeedScreen|GMapHUDPlacementRelay|GoogleMapsVietMap|A_DuoFaceNativeNoLease' CONTENTS.txt
          dpkg-deb -x speed5scene.deb extracted
          filter=extracted/var/jb/Library/MobileSubstrate/DynamicLibraries/DuoFaceSpeedHUD.plist
          grep -Fq '"SpringBoard"' "$filter"
          ! grep -Eiq 'com.apple.CarPlayApp|com.apple.CarPlayTemplateUIHost|Waze|GOFA' "$filter"
          grep -F 'DuoFaceLogoGripOnly.dylib' CONTENTS.txt
          echo 'LIVE_SILEO_SPEED5SCENE_SPRINGBOARD_ONLY_NATIVE12_EXACT_SHA_PASS; ON_DEVICE_UNTESTED'
          echo 'LIVE_SILEO_DOWNLOADED_EXACT_SPEED5SCENE_DEB_SHA256_PASS; ON_DEVICE_UNTESTED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-native12-speed5scene-live-public-evidence
          path: |
            ${{ runner.temp }}/df-speed5scene-live/Packages
            ${{ runner.temp }}/df-speed5scene-live/Packages.gz
            ${{ runner.temp }}/df-speed5scene-live/CONTENTS.txt
            ${{ runner.temp }}/df-speed5scene-live/download-path.txt
          if-no-files-found: warn
