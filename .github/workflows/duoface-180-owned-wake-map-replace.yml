name: QA180 owned wake and map replacement - source only
on:
  push:
    branches: [fix/qa180-owned-wake-map-replace-20261106]
    paths:
      - '.github/workflows/duoface-180-owned-wake-map-replace.yml'
      - 'sideplay/audit/qa180-owned-wake-map-replace-20261106/transport/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa180-owned-wake-source-only
  cancel-in-progress: false
jobs:
  validate-and-checkpoint:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact patch and apply only bounded first-party files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chuongnguyen89dn-ui/Duoface'
          test "$GITHUB_REF_NAME" = 'fix/qa180-owned-wake-map-replace-20261106'
          mkdir -p "$RUNNER_TEMP/qa180-evidence" "$RUNNER_TEMP/qa180-baseline"
          git rev-parse HEAD > "$RUNNER_TEMP/qa180-evidence/input-head.txt"
          git show HEAD:sideplay/duoface-native-scene-host/DFNative12Chrome.m > "$RUNNER_TEMP/qa180-baseline/DFNative12Chrome.m"
          git show HEAD:sideplay/duoface-native-scene-host/DFSceneHost.m > "$RUNNER_TEMP/qa180-baseline/DFSceneHost.m"
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess,os
          from pathlib import Path
          folder=Path('sideplay/audit/qa180-owned-wake-map-replace-20261106')
          encoded=''.join((folder/'transport'/f'part{i}.b64').read_text().strip() for i in range(1,5))
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          expected='57f703426d1f59340fb3d8bf64d2bb590cbb3144742efc3f025a189d77890ade'
          assert hashlib.sha256(raw).hexdigest()==expected,'Patch transport mismatch; refuse source change'
          patch=folder/'changes.patch';patch.write_bytes(raw)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          prefix='sideplay/duoface-native-scene-host/'
          test=Path(prefix+'tests/test_qa172w_wakefix.py')
          text=test.read_text()
          before="'DF155PilotAppID','kbVisible177'"
          assert text.count(before)==1
          text=text.replace(before,"'DF177CurrentTouchOwner','kbVisible177'")
          marker=' def test_app_touch_never_recalls_directly(self):'
          assert text.count(marker)==1
          text=text.replace(marker,"  self.assertIn('!DF155PilotAppID(bundle)',(ROOT/'DF154GeneralAppStateRelay.m').read_text())\n"+marker)
          doc_end=text.index('"""',3)+3
          text='"""QA180 owner-scoped in-path wake plus preserved legacy keyboard relays.\nThe first hidden contact wakes only; app-side injection remains allowlisted.\nThese source assertions do not establish device touch delivery.\n"""'+text[doc_end:]
          test.write_text(text)
          subprocess.run(['git','add','--',str(test)],check=True)
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected_paths={prefix+x for x in (
            'DFOwnedWakeSurface180.h','DFOwnedWakeSurface180.m','DFMapReplace180.h',
            'DFNative12Chrome.m','DFSceneHost.m','build.sh',
            'tests/qa180_uikit_stub/UIKit/UIKit.h','tests/qa180_uikit_stub/UIKitStub.m',
            'tests/wake_gate_180_runtime.m','tests/map_replace_180_runtime.m',
            'tests/test_qa180_owned_wake_map_replace.py','tests/test_qa172w2_wakefix2.py','tests/test_qa172w_wakefix.py')}
          assert paths==expected_paths,(paths^expected_paths)
          final=subprocess.check_output(['git','diff','--cached','--binary'])
          patch.write_bytes(final)
          receipt='BASE_PATCH_SHA256='+expected+'\nFINAL_PATCH_SHA256='+hashlib.sha256(final).hexdigest()+'\n'
          Path(os.environ['RUNNER_TEMP'],'qa180-evidence','patch-sha256.txt').write_text(receipt)
          print('QA180_PATCH_SHA_AND_13_FILE_SCOPE_VERIFIED',receipt)
          PY
          git diff --cached --check
          git diff --cached --stat > "$RUNNER_TEMP/qa180-evidence/scope.txt"
      - name: Prove two regressions reject original implementation
        shell: bash
        run: |
          set -euo pipefail
          export QA180_SOURCE_ROOT="$RUNNER_TEMP/qa180-baseline"
          python3 - <<'PY' | tee "$RUNNER_TEMP/qa180-evidence/negative-baseline.txt"
          import importlib.util,unittest
          from pathlib import Path
          p=Path('sideplay/duoface-native-scene-host/tests/test_qa180_owned_wake_map_replace.py')
          spec=importlib.util.spec_from_file_location('qa180_negative',p)
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          suite=unittest.TestSuite(module.OwnedWakeMap180(name) for name in (
              'test_hidden_contact_contract_not_passive',
              'test_occupied_map_selection_starts_explicit_replacement'))
          result=unittest.TestResult();suite.run(result)
          assert result.testsRun==2 and len(result.failures)==2 and not result.errors
          for test,_ in result.failures:print('OLD_IMPLEMENTATION_REJECTED',test.id())
          print('QA180_TWO_OLD_SOURCE_REGRESSIONS_REPRODUCED')
          PY
      - name: Run actual production wake gate against dispatch model and Foundation policies
        shell: bash
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          xcrun --sdk macosx clang -fobjc-arc -fblocks -O1 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -I tests/qa180_uikit_stub -framework Foundation -framework CoreGraphics \
            DFOwnedWakeSurface180.m tests/qa180_uikit_stub/UIKitStub.m tests/wake_gate_180_runtime.m \
            -o "$RUNNER_TEMP/qa180-wake"
          "$RUNNER_TEMP/qa180-wake" | tee "$RUNNER_TEMP/qa180-evidence/wake-behavior.txt"
          for source in tests/map_replace_180_runtime.m tests/chrome_visual_178_runtime.m tests/carplay_app_route_178_runtime.m; do
            binary="$RUNNER_TEMP/$(basename "$source" .m)"
            xcrun --sdk macosx clang -fobjc-arc -fblocks -O1 -Wall -Wextra -Werror -Wno-deprecated-declarations \
              -framework Foundation -o "$binary" "$source"
            "$binary" | tee -a "$RUNNER_TEMP/qa180-evidence/policies.txt"
          done
          echo 'WAKE_TEST_USES_PRODUCTION_GATE_WITH_UIKIT_MODEL_NOT_DEVICE' | tee -a "$RUNNER_TEMP/qa180-evidence/wake-behavior.txt"
      - name: Execute Python integration and protected regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          for source in tests/test_qa180_owned_wake_map_replace.py tests/test_qa178_logo_visual_only.py tests/test_qa178_app_picker_route.py tests/test_qa172w2_wakefix2.py tests/test_qa172w_wakefix.py tests/test_qa172r_logo_recall.py; do
            python3 "$source" -v 2>&1 | tee -a "$RUNNER_TEMP/qa180-evidence/python-tests.txt"
          done
      - name: Compile production Objective-C for iOS16 arm64 without packaging
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cd sideplay/duoface-native-scene-host
          for source in DFOwnedWakeSurface180.m DFSceneHost.m DFNative12Chrome.m DFAppPickerVC.m; do
            xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -fobjc-arc -fblocks -O2 -Wall -Wextra -Werror -Wno-deprecated-declarations \
              -fsyntax-only "$source" 2>&1 | tee -a "$RUNNER_TEMP/qa180-evidence/ios-compile.txt"
            echo "QA180_IOS_COMPILE_PASS $source" | tee -a "$RUNNER_TEMP/qa180-evidence/ios-compile.txt"
          done
      - name: Save tested source and canonical checkpoint without releasing old version
        shell: bash
        run: |
          set -euo pipefail
          DEST=sideplay/audit/qa180-owned-wake-map-replace-20261106
          mkdir -p "$DEST/evidence"
          cp "$RUNNER_TEMP/qa180-evidence/"* "$DEST/evidence/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from datetime import datetime,timezone
          folder='sideplay/audit/qa180-owned-wake-map-replace-20261106/'
          run=os.environ['GITHUB_RUN_ID'];head=os.environ['GITHUB_SHA']
          report='''# QA180 two bounded source fixes - tested, NOT physical acceptance

          Latest user asks to stop repeated analysis and implement the two evidenced defects. Baseline d27298e18c987621090d3e79f246b512a034ddca; four-log evidence pinned to main upload3dc27f7d833709be04fc3406aa3bb7077b023f83. No older log files read.

          Existing owned pane root and DFSceneSurface now use DFOwnedWakeSurface180, choosing the host receiver before descending into app content. Hidden first contact wakes only on delivered touchesBegan and is consumed through Ended/Cancelled; visible contacts pass to the original child. No shield UIWindow/global event hook, nil-event wake side effect or keyboard-state IPC prerequisite. Active child gestures are not seized on expiry. Current Chrome/window ownership is checked; artwork-only recall does not independently activate red border or relayout keyboard/scene.

          Native map selection in an occupied pane starts a selected-pane replacement transaction rather than returning silently. Validate session/host; withdraw only the selected phone host; wait for fresh real physical-empty snapshot; submit EXISTING native Attach. Apply only on validated native ACK. Rejection restores prior app only when native attachment is absent; timeout/cancellation after dispatch sends real Restore and waits for ACK. Unknown ownership leaves pane empty, never overlays another owner. Explicit card-entry/request/replacement/rollback logs added. Other panes and coordinator unchanged.

          Reference: existing logoWakeOnlyTap and MECHANISM_REVIEW_20261106.md establish the user-corrected DuoNavi first-contact contract; OmniCar showPickerForSlot/pickerAppTapped/openApp:slot establishes explicit per-slot launch. The occupied-pane gap comes from the four-log FINDINGS.md. No vendor code/runtime/license copied.

          Actual tests: original source rejected by two new contract regressions; production gate Objective-C executes against a SMALL UIKIT DISPATCH MODEL (20 repeated cycles, second tap, cancellation, multiple contacts, active-child gesture). This is not actual UIKit/remote HID/device acceptance. Foundation empty-pane policy executes13 cases. Six Python suites and iOS16arm64 syntax compilation run in this job; exact results evidence/. Protected DFSceneLifecycle.m, DFNativeMapPaneCoordinator.m and DF154GeneralAppStateRelay.m verified unchanged by Git blob hashes.

          Prior run42166403711 failed an obsolete test requiring DF155PilotAppID in Chrome after pilot-specific wake gating was removed. Corrected the test to actual Chrome owner identity and separately preserved app-side injection allowlist. Run42166800433 then passed all41 Python tests, production-gate model,13 Foundation cases and four iOSarm64 syntax checks, but the final archive step failed because git diff --check interpreted valid blank context lines INSIDE the stored unified patch as trailing whitespace. Only that patch DATA file is excluded from the final whitespace check; all source/tests remain checked and unchanged. Initial transport SHA and final amended patch SHA are in evidence/patch-sha256.txt. No compile failure hidden. Reproduce with this workflow's exact commands from repo root.

          No DEB/sign/Sileo change. Current0.0.174 remains device-rejected; never replace published bytes at the same version. Next: new-version signed packaging and existing official Sileo delivery for physical first/second-tap and occupied-pane map testing. Google Maps standalone scene-ID reconciliation and Home icon publication remain separate OPEN tasks, not claimed repaired by these two fixes. Preserve GOFA, keyboard/media/divider and under-lock/BKS policy. No new log request.
          '''
          report='\n'.join(line[10:] if line.startswith('          ') else line for line in report.splitlines()).strip()+'\n'
          report+='\nRun='+run+'; input='+head+'; UTC='+datetime.now(timezone.utc).isoformat()+'.\n'
          Path(folder+'IMPLEMENTATION.md').write_text(report)
          marker='## CHECKPOINT QA180-OWNED-WAKE-MAP-REPLACE-SOURCE-20261106'
          note=(marker+'\n\n- Active work branch: `fix/qa180-owned-wake-map-replace-20261106`, from verified d27298e18c987621090d3e79f246b512a034ddca.\n'
                '- IMPLEMENTED: owned in-path first hidden contact capture and explicit occupied-pane native-map replacement with actual empty readback, ACK and safe rollback. Evidence/commands/limits: `'+folder+'IMPLEMENTATION.md`, `changes.patch`, `evidence/`, workflow `.github/workflows/duoface-180-owned-wake-map-replace.yml`.\n'
                '- Source-only macOS run '+run+' input '+head+' passed all preceding gate-model/Foundation/Python and iOSarm64 syntax steps; save happens only after those steps pass. Not physical CarPlay acceptance.\n'
                '- Two regressions reject old source; active child gestures, keyboard relay and app-side injection scoping preserved. Lifecycle/native coordinator/general GOFA relay unchanged by hashes.\n'
                '- Run42166403711 failed obsolete pilot-gate assertion; corrected test to actual owner plus separate sender allowlist. Run42166800433 passed code/model tests and compile but archive whitespace check rejected valid unified-patch DATA context lines; corrected archive-only check, source unmodified.\n'
                '- No DEB/Sileo change yet. New-version packaging and official delivery next, then physical first-touch consumed/second-touch passed and map replacement. Google Maps standalone scene identity and Home icon work remain OPEN. Do not ask for the same logs again. Preserve history below.\n\n')
          for name in ('sideplay/tiep tuc du an.md','tiep tuc du an.md'):
              path=Path(name);old=path.read_text()
              if marker not in old:path.write_text(note+old)
              assert marker in path.read_text() and path.read_text().endswith(old)
          PY
          git add -- "$DEST" 'sideplay/tiep tuc du an.md' 'tiep tuc du an.md'
          # Unified diff data legitimately contains space-only context lines.
          # Source/test whitespace was checked before archiving and is checked again.
          git diff --cached --check -- . ':!sideplay/audit/qa180-owned-wake-map-replace-20261106/changes.patch'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(qa180): tested owned wake contact and native map pane replacement; no release [skip ci]'
          git push origin HEAD:refs/heads/fix/qa180-owned-wake-map-replace-20261106
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QA180-source-fix-test-evidence
          path: ${{ runner.temp }}/qa180-evidence/
          retention-days: 14
          if-no-files-found: warn
