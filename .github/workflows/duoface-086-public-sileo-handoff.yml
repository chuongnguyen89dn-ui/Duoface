name: DuoFace .86 verified public Sileo status to existing handoff
on:
  push:
    branches:
      - feature/duoface-jb-embedded-appbridge-20261020
    paths:
      - sideplay/jb-embedded-appbridge/publish-request/086.md
permissions:
  contents: write
jobs:
  verify-and-save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify exactly one public DuoFace APT entry and SHA; update the existing handoff
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-jb-embedded-appbridge-20261020'
          SOURCE_ROOT="$(pwd)"
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$BRANCH"
            TMP="$(mktemp -d)"
            git worktree add --detach "$TMP" FETCH_HEAD
            git -C "$TMP" config user.name 'github-actions[bot]'
            git -C "$TMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            (cd "$TMP" && python3 "$SOURCE_ROOT/sideplay/tools/persist_086_sileo_handoff.py")
            if git -C "$TMP" diff --quiet -- 'sideplay/tiep tuc du an.md'; then
              echo 'PUBLICATION_HANDOFF_ALREADY_SAVED'
              git worktree remove --force "$TMP"
              exit 0
            fi
            git -C "$TMP" add 'sideplay/tiep tuc du an.md'
            git -C "$TMP" commit -m 'handoff: verify .86 public Sileo package and preserve device test boundary [skip ci]'
            if git -C "$TMP" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$TMP"
              echo 'PUBLICATION_HANDOFF_GITHUB_PERSISTED=PASS'
              exit 0
            fi
            git worktree remove --force "$TMP"
            echo "Concurrent branch update, retry $attempt/3"
          done
          echo 'PUBLICATION_HANDOFF_SAVE_FAILED' >&2
          exit 1
