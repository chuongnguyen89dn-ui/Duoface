name: DuoFace 098 four-app memory rotation running state source QA
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - '.github/workflows/duoface-098-workspace-smoke.yml'
      - 'sideplay/duoface-native-scene-host/DFSlotWorkspacePolicy.h'
      - 'sideplay/duoface-native-scene-host/DFNative12Chrome.m'
      - 'sideplay/duoface-native-scene-host/DFAppPickerVC.*'
      - 'sideplay/duoface-native-scene-host/DFNativeHostRootController.m'
      - 'sideplay/duoface-native-scene-host/DFSceneHost.*'
      - 'sideplay/duoface-native-scene-host/tests/workspace_runtime.m'
      - 'sideplay/duoface-native-scene-host/tests/test_workspace_098.py'
      - 'sideplay/duoface-native-scene-host/tests/test_logo_092_exact_regression.py'
      - 'sideplay/duoface-native-scene-host/tests/test_scenehost_safety.py'
      - 'sideplay/duoface-native-scene-host/tests/fixtures/logo92_contact_and_swap_baseline.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-098-workspace
  cancel-in-progress: false
jobs:
  source-only:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Python 098 + previous independent regression contracts
        id: source
        run: |
          set -euo pipefail
          for NAME in test_workspace_098.py test_logo_092_exact_regression.py test_scenehost_safety.py test_picker_display_097.py test_app_habits_096.py test_native12_phone_apps_manager_094.py; do
            python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p "$NAME" -v
          done
      - name: Real Foundation executable policy tests on macOS
        id: runtime
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          for SRC in workspace_runtime.m picker_display_runtime.m enabled_apps_policy_runtime.m app_habits_runtime.m; do
            OUTPUT="$RUNNER_TEMP/${SRC%.m}-qa"
            xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -I . "tests/$SRC" -o "$OUTPUT"
            "$OUTPUT"
          done
      - name: Native iOS16 SDK ObjC syntax for all changed owners
        id: ios
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$SDK"
          cd sideplay/duoface-native-scene-host
          for SRC in DFNative12Chrome.m DFSceneHost.m DFAppPickerVC.m DFNativeHostRootController.m DFAppLibrary.m; do
            echo "SOURCE_CHECK_IOS16=$SRC"
            xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -fblocks -target arm64-apple-ios16.0 -isysroot "$SDK" -Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Wno-deprecated-declarations -I . "$SRC"
          done
      - name: Preserve run evidence and append existing handoff (never a new handoff)
        if: always()
        env:
          PYTHON_OUTCOME: ${{ steps.source.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          IOS_OUTCOME: ${{ steps.ios.outcome }}
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-jb-embedded-appbridge-20261020'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "$BRANCH"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            DEST="$TEMP/sideplay/audit/duoface-workspace-098/ci"
            mkdir -p "$DEST/runs"
            RESULT="$DEST/runs/$GITHUB_RUN_ID.txt"
            test ! -e "$RESULT"
            {
              echo "RUN_ID=$GITHUB_RUN_ID"
              echo "SOURCE_SHA=$GITHUB_SHA"
              echo "WORKFLOW_URL=https://github.com/chuongnguyen89dn-ui/Duoface/actions/runs/$GITHUB_RUN_ID"
              echo "PYTHON_SOURCE=$PYTHON_OUTCOME"
              echo "FOUNDATION_EXECUTABLE=$RUNTIME_OUTCOME"
              echo "IOS16_ARM64_SYNTAX=$IOS_OUTCOME"
              echo "NEW_SIGNED_DEB=false"
              echo "SILEO_PUBLISHED=false"
              echo "DEVICE_TESTED=false"
            } > "$RESULT"
            cp "$RESULT" "$DEST/LATEST_RESULT.txt"
            cmp "$RESULT" "$DEST/LATEST_RESULT.txt"
            python3 - "$TEMP/sideplay/tiep tuc du an.md" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$PYTHON_OUTCOME" "$RUNTIME_OUTCOME" "$IOS_OUTCOME" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1])
          if not path.exists():raise RuntimeError("Existing project handoff missing")
          run,sha,py,foundation,ios=sys.argv[2:]
          status="PASS" if (py,foundation,ios)==("success","success","success") else "FAILED"
          block=f"""## CHECKPOINT 2026-10-29 DuoFace #5 #6 #7 source CI {status} run {run}

          - New user requirements: remember 1..4 physical-window app IDs only after real scene ready; reconnect sequentially restores only still-installed AND explicitly iPhone-approved bundles, after splash, with timeout/stop generation gate and explicit phone opt out/clear. This is independent of iPhone preset-based app assignment (cancelled).
          - 3/4-app reorder: clockwise/counterclockwise repositions PHYSICAL host UIWindow frames through validated permutation, never moves hosted SBAppViewController to another parent or recreates media scenes; only when all actual scenes ready, no pending.
          - Running manager: separate owned LIVE scene state, guarded PID lookup from SBApplication + kill(pid,0) read-only, display PID unknown if absent, Close/Restart only owned scene host operations. No claim of actual app-process termination/foreground state without device evidence.
          - Files: DFSlotWorkspacePolicy.h, DFNative12Chrome.m, DFSceneHost.m/.h, DFAppPickerVC.m/.h, DFNativeHostRootController.m; tests/workspace_runtime.m, tests/test_workspace_098.py and byte-for-byte golden .92 logo contact and swap fixture; report at sideplay/audit/duoface-workspace-098/REPORT.md.
          - GitHub Actions https://github.com/chuongnguyen89dn-ui/Duoface/actions/runs/{run} source SHA {sha}; Python={py}; Foundation runtime={foundation}; iOS16 syntax={ios}. Permanent evidence sideplay/audit/duoface-workspace-098/ci/runs/{run}.txt.
          - NO integrated signed DEB, NO Sileo upload, NO CarPlay physical device test. Do not claim parity in app process exit or dual 3/4 gesture until parked-car QA. Preserve .90 YouTube orientation, original .92 3s logo raw methods, system Dock, Maps native trial and nine presets.
          - Next: resolve any failed CI at exact logged file/line; inspect source before package. On actual car test reconnect, no duplicate host, 3/4 swap media continuity, PID correctness vs process list, Close/Restart app vs scene semantics. Do not publish to Sileo without user request.

          ---

          """
          old=path.read_text(encoding="utf-8")
          if f"run {run}" not in old:
            path.write_text(block+old,encoding="utf-8")
            assert path.read_text(encoding="utf-8").startswith(block)
          print("DF098_HANDOFF_READBACK_PASS")
          PY
            git -C "$TEMP" add sideplay/audit/duoface-workspace-098/ci/ 'sideplay/tiep tuc du an.md'
            git -C "$TEMP" commit -m "ci: preserve DuoFace #5-7 source QA $GITHUB_RUN_ID [skip ci]"
            if git -C "$TEMP" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$TEMP"
              echo "DF098_GITHUB_ARCHIVE_PASS"
              exit 0
            fi
            git worktree remove --force "$TEMP"
            echo "Concurrent checkpoint write; retry $attempt"
          done
          exit 1
