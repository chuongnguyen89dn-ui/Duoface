name: DuoFace native12 license classref instructions static audit - no delete
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - 'migration/full_payload/native_test/audit_native12_license_ref_code_xrefs.py'
      - '.github/workflows/duoface-native12-license-classref-xrefs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disassemble real native12, never mutate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages 'capstone==5.0.6'
          deb=dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb
          printf '%s  %s\n' 85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7 "$deb" | sha256sum -c -
          python3 migration/full_payload/native_test/audit_native12_license_ref_code_xrefs.py --deb "$deb" \
            --out audit/payload-migration/NATIVE12_LICENSE_CLASSREF_CODE_XREFS.json
          python3 - <<'PY'
          import json
          j=json.load(open('audit/payload-migration/NATIVE12_LICENSE_CLASSREF_CODE_XREFS.json'))
          assert j['status']=='NATIVE12_LICENSE_CLASSREF_ARM64_READONLY'
          assert j['candidates']==14 and not j['safe_to_delete_classes']
          assert sum(v['pointer_slots'] for v in j['binaries'].values())==28
          print('ARM64_STATIC_CLASSREF_LOWER_BOUND_READONLY_PASS')
          PY
      - name: Persist read-only report, no publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/NATIVE12_LICENSE_CLASSREF_CODE_XREFS.json
          git diff --cached --quiet && exit 0
          git commit -m 'audit: native12 license-only classref ARM64 callsites [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native12-license-classrefs-readonly
          path: audit/payload-migration/NATIVE12_LICENSE_CLASSREF_CODE_XREFS.json
          if-no-files-found: warn
