name: DuoFace Native12 source-only UIKit and original behavior regression
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - 'sideplay/duoface-native-scene-host/DFNative12PresetPreview.*'
      - 'sideplay/duoface-native-scene-host/DFNative12PreviewGeometry.h'
      - 'sideplay/duoface-native-scene-host/tests/test_preview_geometry.py'
      - 'sideplay/duoface-native-scene-host/DFNative12Chrome.m'
      - 'sideplay/duoface-native-scene-host/DFDividerDrag.h'
      - 'sideplay/duoface-native-scene-host/tests/test_divider_drag.py'
      - 'sideplay/duoface-native-scene-host/DFNative12MediaGeometry.h'
      - 'sideplay/duoface-native-scene-host/DFSceneHost.m'
      - 'sideplay/duoface-native-scene-host/DFYouTube*'
      - 'sideplay/duoface-native-scene-host/tests/*youtube*'
      - 'sideplay/duoface-native-scene-host/DFAppViewportRelay.m'
      - 'sideplay/duoface-native-scene-host/DFAppViewportProtocol.h'
      - 'sideplay/duoface-native-scene-host/DFAppViewportRelay.plist'
      - 'sideplay/duoface-native-scene-host/tests/test_app_viewport_bridge.py'
      - 'sideplay/duoface-native-scene-host/DFDockZoomCoordinator.m'
      - 'sideplay/duoface-native-scene-host/DFCarPlayDockOwner.m'
      - 'sideplay/duoface-native-scene-host/DFTouchOwnerProbe.m'
      - 'sideplay/duoface-native-scene-host/speed8/**'
      - 'sideplay/duoface-native-scene-host/tests/test_speed8_protocol.py'
      - 'sideplay/duoface-native-scene-host/DFAppPickerVC.*'
      - 'sideplay/duoface-native-scene-host/tests/test_app_tile_original_palette.py'
      - 'sideplay/duoface-native-scene-host/tests/test_scenehost_safety.py'
      - '.github/workflows/duoface-native12-source-only-validation.yml'
      - '.github/workflows/duoface-jb-embedded-appbridge-package.yml'
      - 'sideplay/jb-embedded-appbridge/package_integrated.py'
      - 'sideplay/jb-embedded-appbridge/tests/test_integrated_package.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duo-native12-source-only-validation
  cancel-in-progress: true
jobs:
  source-contract-no-deb:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run actual independent Native12 source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_scenehost_safety.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_app_viewport_bridge.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_app_tile_original_palette.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_preview_geometry.py' -v
          python3 -m unittest discover -s sideplay/jb-embedded-appbridge/tests -p 'test_integrated_package.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_speed8_protocol.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_divider_drag.py' -v
          echo NATIVE12_SPEED8_HISTORICAL_OWN_DATA_PROTOCOL_COMPILED_NOT_HUD_ENABLED
          python3 -m py_compile sideplay/jb-embedded-appbridge/package_integrated.py
          echo NATIVE12_ONE_DEB_CURRENT_SOURCE_PIN_POLICY_PASS_NO_PACKAGE_BUILD
          echo NATIVE12_UI_REAL_SCENE_AND_RASTER_SOURCE_CONTRACTS_PASS
      - name: YouTube host/app state and ABI executable tests
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -I . tests/youtube_handshake_runtime.m -o "$RUNNER_TEMP/youtube-handshake"
          "$RUNNER_TEMP/youtube-handshake"
      - name: Real Objective-C iOS16 SDK syntax checks; do not package or publish
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$SDK"
          cd sideplay/duoface-native-scene-host
          for FILE in DFNativeDiagnostics.m DFNativeHostAppDelegate.m DFAppPickerVC.m DFNative12Chrome.m DFNative12PresetPreview.m DFSceneHost.m DFSceneLifecycle.m DFYouTubeOrientationRelay.m DFAppViewportRelay.m DFDockZoomCoordinator.m DFCarPlayDockOwner.m DFTouchOwnerProbe.m; do
            echo "COMPILING_SOURCE_ONLY $FILE"
            xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -fblocks \
              -target arm64-apple-ios16.0 -isysroot "$SDK" \
              -Werror=implicit-function-declaration -Werror=incompatible-pointer-types \
              -Wno-deprecated-declarations -I . "$FILE"
          done
          # Historical OWN Speed8 HUD view has been recovered but is NOT
          # mounted/linked to the live host until real non-intercepting owner QA.
          xcrun --sdk iphoneos clang++ -x objective-c++ -std=c++17 -fsyntax-only \
            -fobjc-arc -fblocks -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -Werror=implicit-function-declaration -Werror=incompatible-pointer-types \
            -Wno-deprecated-declarations -I . -I speed8 \
            speed8/DFNative8SpeedHUDView.mm
          echo SPEED8_FIRSTPARTY_NATIVE_HUD_SOURCE_SYNTAX_PASS_NOT_LINKED_NOT_DEVICE
          echo NATIVE12_SOURCE_ONLY_ARM64_SDK_SYNTAX_PASS_NO_SIGNED_DEB
