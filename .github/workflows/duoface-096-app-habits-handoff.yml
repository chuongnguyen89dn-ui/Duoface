name: DuoFace 096 app habits — append project handoff
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - 'sideplay/audit/duoface-app-habits-096/REPORT.md'
permissions:
  contents: write
concurrency:
  group: duoface-096-app-habits-handoff
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Append idempotently to existing DuoFace handoff, read back and push
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-jb-embedded-appbridge-20261020'
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "$BRANCH"
            TEMP="$(mktemp -d)"
            git worktree add --detach "$TEMP" FETCH_HEAD
            git -C "$TEMP" config user.name 'github-actions[bot]'
            git -C "$TEMP" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            python3 - "$TEMP/sideplay/tiep tuc du an.md" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          if not p.is_file():
              raise RuntimeError("Cannot locate existing project handoff; refuse duplicate")
          old=p.read_text(encoding="utf-8")
          marker="## CHECKPOINT 2026-10-29 DuoFace independent default and habit-based app choices"
          body="""## CHECKPOINT 2026-10-29 DuoFace independent default and habit-based app choices

          - USER SUPERSEDES earlier requirement #2 and prior assistant assumptions about iPhone left/right or slots 1-4 preassignment. Scope is optional default/favorite app selection plus real use-based ordering when the user opens the CarPlay app picker. No automatic app launch and no pane assignment in the iPhone configuration.
          - Branch feature/duoface-jb-embedded-appbridge-20261020; independent first-party code DFAppHabits.h, DFNativeHostRootController.m, DFAppPickerVC.m, DFNative12Chrome.m; provenance in sideplay/audit/duoface-app-habits-096/REPORT.md.
          - Existing iPhone Apps tab adds Mặc định & Ưa dùng manager. The CarPlay app picker retains its per-pane user tap and real eligible installed app allowlist; ordering is default, pinned then successful sceneReady usage count. Preferences saved/read back atomically and notify live refresh; counts updated only after scene-ready callback. No original vendor binaries or license used.
          - Source commits include 7e01d2c (policy), c6b7d82 (iPhone UI), c14c41b (CarPlay picker), 4dcdb2f (ready-only counts), 60508cf/c3ede65f (tests), 4fb4932 (CI). Verify current branch before editing.
          - Source-only macOS Foundation executable and iOS16 SDK CI must be checked; no physical CarPlay result or Sileo release implied. Do not overwrite .90 YouTube rotation, .92 logo, system Dock or experimental native Maps. Current integrated build version is independent and must not be claimed upgraded until successful signed package verification.
          - Next: inspect GitHub Actions source-only validation results; resolve compiler/test failure if any; review preservation of prior .95 source; only prepare a new signed one-DEB QA after CI passes and user explicitly requests Sileo. Test real iPhone preference, picker ordering and no automatic launch on parked CarPlay.

          ---

          """
          if marker in old:
              print("APP_HABITS_HANDOFF_ALREADY_PRESENT")
          else:
              p.write_text(body+old,encoding="utf-8")
              verified=p.read_text(encoding="utf-8")
              assert verified.startswith(body) and verified.endswith(old)
              print("APP_HABITS_HANDOFF_READBACK_PASS")
          checked=p.read_text(encoding="utf-8")
          passed="## VERIFIED 2026-10-29 app habits source-only macOS runtime and iOS16 compile"
          if passed not in checked:
              verification="""## VERIFIED 2026-10-29 app habits source-only macOS runtime and iOS16 compile

          - GitHub Actions run 40795905490 on source c500683170dab9a22f855b496c30643c696d2ade completed SUCCESS; job 123192202265, four Python contracts PASSED, actual macOS clang/Foundation executable emitted APP_HABITS_RUNTIME_PASS, three Objective-C UIKit owners passed iOS16 SDK syntax, run result archived in sideplay/audit/duoface-app-habits-096/ci/LATEST_RESULT.txt and runs/40795905490.txt.
          - Exact new behavior is independent user default and pinned app ranking plus ready-scene selection counts; no fixed left/right or slot 3/4 iPhone assignments. The existing per-pane CarPlay picker stays manual. Code commits and paths in preceding checkpoint/report.
          - No new signed DEB or Sileo publication and NO iPhone/CarPlay device QA yet. Old .90 orientation, .92 logo, Dock and native Maps require on-device regression before release. Continue by reviewing source against current .95 stable and, only on new user request, package a new unique QA version and publish via the Sileo pipeline after SHA verification.

          ---

          """
              p.write_text(verification+checked,encoding="utf-8")
              assert p.read_text(encoding="utf-8").startswith(verification)
              print("APP_HABITS_CI_VERIFIED_HANDOFF_READBACK_PASS")
          PY
            git -C "$TEMP" add 'sideplay/tiep tuc du an.md'
            if git -C "$TEMP" diff --cached --quiet; then
              git worktree remove --force "$TEMP"
              exit 0
            fi
            git -C "$TEMP" commit -m 'handoff: independent app defaults and habits scope [skip ci]'
            if git -C "$TEMP" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$TEMP"
              echo APP_HABITS_HANDOFF_GITHUB_PUSH_VERIFIED
              exit 0
            fi
            git worktree remove --force "$TEMP"
            echo "Concurrent branch update; retry $attempt/5"
          done
          exit 1
