name: DuoFace native12 Lite/Zingalo ghost tile origin, readonly
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duoface-native12-ghost-apps-readonly.yml'
      - 'migration/full_payload/native_test/audit_native12_ghost_app_tiles.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: df-native12-ghost-tiles-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read centrally maintained ZIP skill instructions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dfskills"
          for name in 01-github-continuity 02-ios-deb-ipa-carplay 05-research-debug-testing; do
            url="https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills/$name.zip"
            curl --fail --location --retry 3 --retry-delay 2 "$url" -o "$RUNNER_TEMP/dfskills/$name.zip"
            unzip -t "$RUNNER_TEMP/dfskills/$name.zip" | tail -1
            echo "===== $name contents ====="
            unzip -Z1 "$RUNNER_TEMP/dfskills/$name.zip" | head -30
            unzip -p "$RUNNER_TEMP/dfskills/$name.zip" '*SKILL.md' | head -160 || true
          done
          echo 'CENTRAL_GITHUB_SKILL_ZIPS_READ_PASS'
      - name: Audit exact immutable native12 DEB and app picker owner (NO DEB modified)
        shell: bash
        run: |
          set -euo pipefail
          deb='dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb'
          echo '85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7  '"$deb" | sha256sum -c -
          python3 -m pip install --user --break-system-packages 'capstone==5.0.6'
          python3 migration/full_payload/native_test/audit_native12_ghost_app_tiles.py \
            --deb "$deb" \
            --out audit/payload-migration/NATIVE12_LITE_ZINGALO_GHOST_TILES_READONLY.json
          python3 - <<'PY'
          import json
          p='audit/payload-migration/NATIVE12_LITE_ZINGALO_GHOST_TILES_READONLY.json'
          d=json.load(open(p))
          assert d['status']=='NATIVE12_LITE_ZINGALO_GHOST_TILES_READONLY_AUDIT'
          assert d['device_preferences_read'] is False
          assert d['exact_deb_sha256']=='85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7'
          assert 'CBMultitaskingOverlayView.loadInstalledApps' in d['dashboard_app_list_methods']
          print('GHOST_APPS_NO_DEVICE_PREFERENCES_STATIC_AUDIT_VERIFIED')
          PY
      - name: Save readonly report to the actual DuoFace repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/NATIVE12_LITE_ZINGALO_GHOST_TILES_READONLY.json
          if git diff --cached --quiet; then echo REPORT_UNCHANGED; exit 0; fi
          git commit -m 'audit: exact native12 Lite/Zingalo static origin report [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native12-lite-zingalo-static-audit
          path: audit/payload-migration/NATIVE12_LITE_ZINGALO_GHOST_TILES_READONLY.json
          if-no-files-found: warn
