name: DuoFace independent embedded JB AppBridge — one DEB staging (NO RELEASE)
on:
  # User explicitly ordered one real test DEB on 2026-10-23.  Connector has
  # no workflow_dispatch capability; a dedicated request file is the ONLY
  # push path that can start packaging. Normal source pushes never do.
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - 'sideplay/jb-embedded-appbridge/build-request/REQUEST.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duoface-jb-embedded-standalone
  cancel-in-progress: true
jobs:
  package-candidate:
    # Explicit rollback updates the request record but must NOT build a fresh DEB.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'rollback:') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify and read central iOS/CarPlay and debugging skill ZIPs
        run: |
          python3 - <<'PY'
          import hashlib,io,urllib.request,zipfile
          expected={
            "02-ios-deb-ipa-carplay.zip":"c87b5ed9ef196c13f42dd41df49a032369028742cc8f6d56569637daf76ec7cf",
            "05-research-debug-testing.zip":"fcb1122412a11664c2c6b8666cbc4f76e86ad20f96e697138d96c6425137dc98"
          }
          for name,sha in expected.items():
              url="https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills/"+name
              payload=urllib.request.urlopen(url,timeout=30).read()
              actual=hashlib.sha256(payload).hexdigest()
              if actual!=sha:raise RuntimeError("central ZIP hash mismatch: "+name+" "+actual)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  for member in ("SKILL.md","references/VERIFICATION.md"):
                      text=archive.read(member).decode("utf-8")
                      print("CENTRAL_SKILL_VERIFIED",name,member,sha,len(text))
                      print(text)
          PY
      - name: Fast blocking QA gate - integrated package and newest bounded round
        run: |
          set -euo pipefail
          # These tests plus the following ABI compile harnesses gate a signed release.
          python3 -m unittest discover -s sideplay/jb-embedded-appbridge/tests -p 'test_integrated_package.py' -v
          python3 -m unittest discover -s sideplay/jb-embedded-appbridge/tests -p 'test_integrated_package_144.py' -v
          echo 'QA_FAST_TEST_GATE_PASS'
      - name: Execute scene ownership boundary regression harness
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -Wl,-export_dynamic -I . tests/scene_lifecycle_runtime.m DFSceneLifecycle.m -o "$RUNNER_TEMP/scene-lifecycle-test"
          "$RUNNER_TEMP/scene-lifecycle-test"
      - name: Execute .84 owner-scoped portrait/size hook ABI regression harness
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -framework CoreGraphics -Wl,-export_dynamic -I . tests/scene_orientation_policy_runtime.m DFSceneOrientationPolicy.m -o "$RUNNER_TEMP/orientation-policy-runtime"
          "$RUNNER_TEMP/orientation-policy-runtime"
      - name: Execute shared baseline .85-rejected-map profile geometry regression harness
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -framework CoreGraphics -I . tests/map_render_profile_runtime.m -o "$RUNNER_TEMP/map-render-runtime"
          "$RUNNER_TEMP/map-render-runtime"
      - name: Execute YouTube host/app lease and private rotation ABI regression
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -I . tests/youtube_handshake_runtime.m -o "$RUNNER_TEMP/youtube-handshake"
          "$RUNNER_TEMP/youtube-handshake"
      - name: Cache Theos and iOS SDKs between QA runs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/theos
          key: theos-sdks-macos15-20261106-v1
          restore-keys: |
            theos-sdks-macos15-
      - name: Prepare rootless Theos and toolchain (clone only on cache miss)
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f "$RUNNER_TEMP/theos/makefiles/common.mk"; then
            rm -rf "$RUNNER_TEMP/theos"
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          fi
          if ! test -n "$(find "$RUNNER_TEMP/theos/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit 2>/dev/null)"; then
            rm -rf "$RUNNER_TEMP/theos/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          fi
          brew list --versions ldid >/dev/null 2>&1 || brew install ldid
          brew list --versions dpkg >/dev/null 2>&1 || brew install dpkg
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          test -n "$(find "$RUNNER_TEMP/theos/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"
          echo 'THEOS_CACHE_READY'
      - name: Build independent SpringBoard two-app host (default OFF)
        run: |
          set -euo pipefail
          cd sideplay/mytweak-independent-v1a
          make clean package FINALPACKAGE=1
          test -s 'packages/com.duoface.mytweak.v1a.preflight_0.2.1~divider1_iphoneos-arm64.deb'
      - name: Build native Dashboard receiver (default OFF)
        run: |
          set -euo pipefail
          cd sideplay/mytweak-native-bridgeqa
          make clean package FINALPACKAGE=1
          test -s 'packages/com.duoface.carplay.nativebridgeqa_0.0.8~divider1_iphoneos-arm64.deb'
      - name: Build existing CarPlay-only own-bundle admission candidate
        run: |
          set -euo pipefail
          cd sideplay/firstparty-carplay-admission
          make clean package FINALPACKAGE=1
          test -s 'packages/com.duoface.carplay.firstpartyadmission_0.0.6~sbpair1_iphoneos-arm64.deb'
      - name: Build OWN current-source NativeHost with UIKit Scene and real CarPlay Dock owner (no vendor payload)
        run: |
          set -euo pipefail
          # .47 was archived before the current Native12 App/Recent/Style/video
          # fixes; reusing .47 would silently discard those changes.
          bash sideplay/duoface-native-scene-host/build.sh
          NATIVE="$(find sideplay/duoface-native-scene-host/packages -maxdepth 1 -type f -name 'com.duoface.carplay.nativescenehost_*.deb' -print -quit)"
          test -n "$NATIVE" && test -s "$NATIVE"
          test "$(dpkg-deb -f "$NATIVE" Package)" = 'com.duoface.carplay.nativescenehost'
          test "$(basename "$NATIVE")" = "com.duoface.carplay.nativescenehost_$(dpkg-deb -f "$NATIVE" Version)_iphoneos-arm64.deb"
          # NativeHost's built version must be the one referenced by the integrated builder.
          grep -Fq "$(basename "$NATIVE")" sideplay/jb-embedded-appbridge/package_integrated.py
          NATIVEHOST_SHA="$(shasum -a 256 "$NATIVE" | awk '{print $1}')"
          printf '%s\n' "NATIVEHOST_SHA=$NATIVEHOST_SHA" >> "$GITHUB_ENV"
          echo "SIGNED_NATIVEHOST_CURRENT_SOURCE_SHA256=$NATIVEHOST_SHA"
      - name: Merge into ONE staged rootless package and validate
        run: |
          set -euo pipefail
          python3 sideplay/jb-embedded-appbridge/package_integrated.py --build --expected-nativehost-sha256 "$NATIVEHOST_SHA" --expected-source-sha "$GITHUB_SHA"
          PACKAGE="$(find sideplay/jb-embedded-appbridge/packages -maxdepth 1 -type f -name 'com.duoface.jb.embedded_*.deb' -print -quit)"
          test -n "$PACKAGE" && test -s "$PACKAGE"
          test "$(dpkg-deb -f "$PACKAGE" Package)" = 'com.duoface.jb.embedded'
          EXPECTED_VERSION="$(sed -nE 's/^VERSION="([^"]+)"$/\1/p' sideplay/jb-embedded-appbridge/package_integrated.py)"
          test -n "$EXPECTED_VERSION"
          test "$(dpkg-deb -f "$PACKAGE" Version)" = "$EXPECTED_VERSION"
          test "$(basename "$PACKAGE")" = "com.duoface.jb.embedded_${EXPECTED_VERSION}_iphoneos-arm64.deb"
          test "$(dpkg-deb -f "$PACKAGE" Architecture)" = iphoneos-arm64
          # Verify the new allowlisted app-process dylib actually ships; earlier .71
          # had only SpringBoard/CarPlay filters and could not bridge app UIKit.
          dpkg-deb -c "$PACKAGE" > "$RUNNER_TEMP/duoface-app-scene-package-list.txt"
          ! grep -F 'DFAppViewportRelay.dylib' "$RUNNER_TEMP/duoface-app-scene-package-list.txt"
          ! grep -F 'DFAppViewportRelay.plist' "$RUNNER_TEMP/duoface-app-scene-package-list.txt"
          grep -F 'DFYouTubeOrientationRelay.dylib' "$RUNNER_TEMP/duoface-app-scene-package-list.txt"
          grep -F 'DFYouTubeOrientationRelay.plist' "$RUNNER_TEMP/duoface-app-scene-package-list.txt"
          # Exactly one CarPlay-only opt-in native map scene coordinator.
          grep -F 'DFNativeMapPaneCoordinator.dylib' "$RUNNER_TEMP/duoface-app-scene-package-list.txt"
          grep -F 'DFNativeMapPaneCoordinator.plist' "$RUNNER_TEMP/duoface-app-scene-package-list.txt"
          mkdir -p "$RUNNER_TEMP/duoface-package-control"
          dpkg-deb -e "$PACKAGE" "$RUNNER_TEMP/duoface-package-control"
          test -x "$RUNNER_TEMP/duoface-package-control/postinst"
          test -x "$RUNNER_TEMP/duoface-package-control/postrm"
          grep -q 'DuoFaceNativeHost.app' "$RUNNER_TEMP/duoface-package-control/postinst"
          ! grep -q 'DuoFaceQA.app' "$RUNNER_TEMP/duoface-package-control/postinst"
          ! grep -E 'killall|sbreload|ldrestart|launchctl' "$RUNNER_TEMP/duoface-package-control/"post*

          ! dpkg-deb -f "$PACKAGE" Depends | grep -i -E 'carbridge|carplayenable|sideplay|duonavi|duodash'
          python3 - <<'PY'
          import json
          p='sideplay/jb-embedded-appbridge/packages/PACKAGING_PROVENANCE.json'
          d=json.load(open(p))
          assert len(d['source_packages'])==4
          assert len(d['source_packages'])==len(set(x['package'] for x in d['source_packages']))
          assert all(x['package']!='com.duoface.qa.controlapp' for x in d['source_packages'])
          assert not d['contains_third_party_carbridge']
          assert d['separate_carbridge_dependency'] is False
          assert d['sileo_published'] is False and d['device_carplay_icon_tested'] is False
          assert d['requires_replacing_old_qa_packages'] is True
          assert d['native_content_receiver_compiled'] is True
          assert d['native_map_optin_controller_coordinator_compiled'] is True
          assert d['native_map_tiles_device_verified'] is False
          assert d['native_map_navigation_continuity_verified'] is False
          assert d['native_content_receiver_device_verified'] is False
          assert d['uicache_registration_scripts_included'] is True
          assert d['source_git_commit']==__import__('os').environ['GITHUB_SHA']
          assert d['nativehost_build_sha256']==__import__('os').environ['NATIVEHOST_SHA']
          assert d['native12_speed8_hud_independent_parity_proven'] is False
          assert d['auto_respring_on_install'] is False
          print('JB_EMBEDDED_SINGLE_DEB_SOURCE_PACKAGE_PASS sha=',d['sha256'])
          PY
          mkdir -p sideplay/jb-embedded-appbridge/evidence
          cp sideplay/jb-embedded-appbridge/packages/PACKAGING_PROVENANCE.json sideplay/jb-embedded-appbridge/evidence/PACKAGING_PROVENANCE.json
          (cd sideplay/jb-embedded-appbridge/packages && shasum -a 256 "$(basename "$PACKAGE")" > SHA256SUMS.txt)
          {
            echo 'SOURCE_BUNDLE_CANDIDATE=PASS_NO_DEVICE_PARITY'
            echo 'SILEO_PUBLISHED=false'
            echo 'UICACHE_POSTINST_INCLUDED=true'
            echo 'UICACHE_ON_DEVICE_CONFIRMED=false'
            echo 'DEVICE_NATIVE_CARPLAY_ICON_VERIFIED=false'
            echo 'DEVICE_TWO_APP_BRIDGE_VERIFIED=false'
            echo 'NEEDS_PREVIOUS_QA_MIGRATION_REVIEW=true'
            echo 'NO_SEPARATE_CARBRIDGE_PACKAGE=true'
            echo 'NATIVE12_SPEED8_HUD_PARITY_VERIFIED=false'
            echo 'NATIVE_CONTENT_RECEIVER_DEVICE_VERIFIED=false'
          echo 'NATIVE_MAP_PANE_USER_OPTIN_COMPILED=true'
          echo 'NATIVE_MAP_TILES_RENDERED_ON_CAR=false'
          echo 'NATIVE_NAVIGATION_CONTINUITY_TESTED=false'
            echo 'SYSTEM_ISSUED_CARPLAY_SCENE_VERIFIED=false'
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "SOURCE_SHA=$GITHUB_SHA"
          } > sideplay/jb-embedded-appbridge/packages/CI_RESULT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: duoface-jb-embedded-carbridge-candidate-${{ github.run_id }}
          path: |
            sideplay/jb-embedded-appbridge/packages/com.duoface.jb.embedded_*.deb
            sideplay/jb-embedded-appbridge/packages/SHA256SUMS.txt
            sideplay/jb-embedded-appbridge/packages/CI_RESULT.txt
            sideplay/jb-embedded-appbridge/evidence/PACKAGING_PROVENANCE.json
          if-no-files-found: error
      - name: Archive signed QA DEB directly to duoface-debs- (no source Git DEB commits)
        shell: bash
        env:
          DUOFACE_DEBS_WRITE_TOKEN: ${{ secrets.DUOFACE_DEBS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if test -z "${DUOFACE_DEBS_WRITE_TOKEN:-}"; then
            echo "::error::Configure DUOFACE_DEBS_WRITE_TOKEN with contents:write on duoface-debs-; source GITHUB_TOKEN cannot write another repo"
            exit 1
          fi
          SRC="$(find sideplay/jb-embedded-appbridge/packages -maxdepth 1 -type f -name 'com.duoface.jb.embedded_*.deb' -print -quit)"
          test -n "$SRC" && test -s "$SRC"
          FILE="${SRC##*/}"
          test "$(dpkg-deb -f "$SRC" Package)" = 'com.duoface.jb.embedded'
          test "$(dpkg-deb -f "$SRC" Architecture)" = iphoneos-arm64
          SHA="$(shasum -a 256 "$SRC" | awk '{print $1}')"
          REPO='chuongnguyen89dn-ui/duoface-debs-'
          ARCHIVE="$RUNNER_TEMP/duoface-debs-archive"
          # Sparse partial clone avoids pulling 440 MB of historical DEBs.
          git clone --depth=1 --filter=blob:none --sparse \
            "https://x-access-token:${DUOFACE_DEBS_WRITE_TOKEN}@github.com/${REPO}.git" "$ARCHIVE"
          git -C "$ARCHIVE" sparse-checkout set debs
          git -C "$ARCHIVE" config user.name 'github-actions[bot]'
          git -C "$ARCHIVE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p "$ARCHIVE/debs"
          DEST="$ARCHIVE/debs/$FILE"
          if test -f "$DEST"; then
            cmp -s "$SRC" "$DEST" || { echo "::error::Immutable DEB filename collision"; exit 1; }
            echo 'ARCHIVE_ALREADY_MATCHES_SIGNED_BYTES'
          else
            cp "$SRC" "$DEST"
            git -C "$ARCHIVE" add -- "debs/$FILE"
            git -C "$ARCHIVE" commit -m "qa: archive signed ${FILE} from DuoFace ${GITHUB_SHA} [skip ci]"
            git -C "$ARCHIVE" push origin HEAD:main
          fi
          ARCHIVE_COMMIT="$(git -C "$ARCHIVE" rev-parse HEAD)"
          test "$(git ls-remote "https://x-access-token:${DUOFACE_DEBS_WRITE_TOKEN}@github.com/${REPO}.git" refs/heads/main | cut -f1)" = "$ARCHIVE_COMMIT"
          RAW="https://raw.githubusercontent.com/${REPO}/${ARCHIVE_COMMIT}/debs/${FILE}"
          curl -fLsS --retry 4 --max-time 140 "$RAW" -o "$RUNNER_TEMP/archive-readback.deb"
          printf '%s  %s\n' "$SHA" "$RUNNER_TEMP/archive-readback.deb" | shasum -a 256 -c -
          {
            echo "ARCHIVE_REPO=$REPO"
            echo "ARCHIVE_COMMIT=$ARCHIVE_COMMIT"
            echo "QA_DEB_URL=$RAW"
            echo "QA_DEB_SHA256=$SHA"
            echo "SOURCE_SHA=$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SIGNED_QA_ARCHIVE_PINNED_READBACK_PASS $RAW"
  full-regression-matrix:
    name: Full nonblocking QA / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    # The quick package gate alone decides archive/publication readiness.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        component:
          - jb-embedded-appbridge
          - duoface-native-scene-host
          - firstparty-carplay-admission
          - mytweak-independent-v1a
          - mytweak-native-bridgeqa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Complete Python test suite (advisory)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s "sideplay/${{ matrix.component }}/tests" -p 'test_*.py' -v
