name: QA146 verify signed real DEB embeds first-party CarBridge-equivalent NO DEPLOY
on:
  push:
    branches: [feature/duoface-qa146-native-home-exit-20261031]
    paths:
      - '.github/workflows/duoface-qa146-signed-carbridge-embedded-binary-inventory.yml'
      - 'sideplay/audit/qa146-native-home-dock-parity-20261031/inspect_shipped_qa146_embedded_carbridge_binary.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa146-signed-carbridge-payload-readonly
  cancel-in-progress: false
jobs:
  verify-shipped-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate actual public signed QA146 integrated DEB and inspect only in disposable directory
        shell: bash
        run: |
          set -euo pipefail
          DEB='sideplay/jb-embedded-appbridge/evidence/runs/41185002153/com.duoface.jb.embedded_0.0.146~native-home-release1_iphoneos-arm64.deb'
          echo '1785d5d6bef53337033f5664d5acfc573dabe20892bd629649fab5730b04e078  ' "$DEB" | sed 's/  /  /' >/dev/null
          printf '%s  %s\n' 1785d5d6bef53337033f5664d5acfc573dabe20892bd629649fab5730b04e078 "$DEB" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qa146-embedded"
          python3 -m py_compile sideplay/audit/qa146-native-home-dock-parity-20261031/inspect_shipped_qa146_embedded_carbridge_binary.py
          python3 sideplay/audit/qa146-native-home-dock-parity-20261031/inspect_shipped_qa146_embedded_carbridge_binary.py \
             --deb "$DEB" --out "$RUNNER_TEMP/qa146-embedded/ACTUAL_SIGNED_QA146_APPBRIDGE_FILTER_INVENTORY.json"
          python3 - "$RUNNER_TEMP/qa146-embedded/ACTUAL_SIGNED_QA146_APPBRIDGE_FILTER_INVENTORY.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['dpkg_control']['Package']=='com.duoface.jb.embedded'
          assert d['third_party_carbridge_files_detected_by_name']==[]
          assert len(d['filters']['named_app_only'])>=2
          print('QA146_SIGNED_PACKAGE_BINARY_APPBRIDGE_PROVENANCE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: QA146-actual-signed-compiled-AppBridge-package-filter-and-control
          path: ${{ runner.temp }}/qa146-embedded/ACTUAL_SIGNED_QA146_APPBRIDGE_FILTER_INVENTORY.json
          if-no-files-found: error
      - name: Persist only sanitized signed DEB inventory in DuoFace repository, read back
        shell: bash
        run: |
          set -euo pipefail
          B=feature/duoface-qa146-native-home-exit-20261031
          P="sideplay/audit/qa146-native-home-dock-parity-20261031/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$B"
            T="$(mktemp -d)"
            git worktree add --detach "$T" FETCH_HEAD
            mkdir -p "$T/$P"
            cp "$RUNNER_TEMP/qa146-embedded/ACTUAL_SIGNED_QA146_APPBRIDGE_FILTER_INVENTORY.json" "$T/$P/"
            printf 'RUN=%s\nSOURCE_SHA=%s\nSIGNED_QA146_SHA_CHECKED=true\nNO_VENDOR_BINARY_EXTRACTED_TO_REPO=true\nNO_NEW_RELEASE=true\nNO_DEVICE_QA=true\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$T/$P/CI_RESULT.txt"
            git -C "$T" config user.name github-actions[bot]
            git -C "$T" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$T" add "$P"
            git -C "$T" commit -m 'audit(qa146): actual signed integrated AppBridge filter/control manifest, no vendor payload [skip ci]'
            if git -C "$T" push origin "HEAD:refs/heads/$B"; then
              git worktree remove --force "$T"
              git fetch --no-tags origin "$B"
              git cat-file -e "FETCH_HEAD:$P/ACTUAL_SIGNED_QA146_APPBRIDGE_FILTER_INVENTORY.json"
              echo QA146_SIGNED_CARBRIDGE_EQUIVALENT_PACKAGE_INVENTORY_SAVED
              exit 0
            fi
            git worktree remove --force "$T"
          done
          exit 1
