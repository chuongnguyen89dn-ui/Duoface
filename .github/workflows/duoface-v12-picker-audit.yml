name: DuoFace v12 picker UI static audit
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/v12_host_recovery.py
      - scripts/v12_picker_text_probe.py
      - scripts/v12_picker_style_probe.py
      - .github/workflows/duoface-v12-picker-audit.yml
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract and verify unmodified v12 Dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, subprocess, tarfile
          from pathlib import Path
          source=Path('dist/visual-1.0.3-12/com.duoface.app_1.0.3-12_visualtest_iphoneos-arm64.deb')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='8b7dedf77b9ec05465b83fdb6e2d7127800eac232a34ecf12f2c08b3983a481a'
          command=subprocess.Popen(['dpkg-deb','--fsys-tarfile',str(source)],stdout=subprocess.PIPE)
          extracted=False
          print('=== ORIGINAL V12 PAYLOAD (filtered UI resources) ===')
          with tarfile.open(fileobj=command.stdout,mode='r|') as tar:
              for member in tar:
                  name=member.name
                  if ('DuoFace' in name or 'DuoNavi' in name or '.lproj' in name) and not name.endswith(('.png','.jpg','.jpeg')):
                      print(name)
                  if name.endswith('/DuoFaceDashboard.dylib'):
                      binary=tar.extractfile(member).read()
                      assert hashlib.sha256(binary).hexdigest()=='bc1df854ec7a2ddfeec4cb81b080ead34b54df80143d4a8f6254bb8b618003ce'
                      dest=Path(os.environ['RUNNER_TEMP'])/'DuoFaceDashboard.dylib'
                      dest.write_bytes(binary)
                      extracted=True
          assert command.wait()==0
          assert extracted, 'v12 Dashboard not found'
          print('DuoFaceDashboard hash verified')
          PY
      - name: Scan literal Vietnamese labels, app resources, and Mach-O CFStrings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/v12_picker_text_probe.py > audit/v12-picker-text-probe-20261014.txt
          python3 scripts/v12_picker_style_probe.py > audit/v12-picker-style-20261014.txt
          grep -E '^0x|^GLOBAL_POINTER|^VERDICT|^NO DEB' audit/v12-picker-style-20261014.txt | head -40 || true
          grep -E 'Ứng dụng|Bố cục|Đang mở|CFSTRING|DASHBOARD_SHA256|COUNTS' audit/v12-picker-text-probe-20261014.txt | head -100 || true
      - name: Trace real picker entrypoints and probable header owners (NO DEB BUILD)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/picker-venv"
          "$RUNNER_TEMP/picker-venv/bin/python" -m pip install capstone==5.0.7
          "$RUNNER_TEMP/picker-venv/bin/python" scripts/v12_host_recovery.py "$RUNNER_TEMP/DuoFaceDashboard.dylib" --picker 0xb25e4:0xb273c 0x27fee4:0x280208 > audit/v12-picker-route-20261014.txt
          "$RUNNER_TEMP/picker-venv/bin/python" scripts/v12_host_recovery.py "$RUNNER_TEMP/DuoFaceDashboard.dylib" 0xa0420:0xa0aec 0xa0b64:0xa0c48 0xa28e8:0xa2a58 0xa2a58:0xa3e5c 0xa9a88:0xa9ce0 > audit/v12-picker-header-20261014.txt
          wc -l audit/v12-picker-route-20261014.txt audit/v12-picker-header-20261014.txt
          grep -E 'showAppPickerForSlot|OWNER .*Picker|PICKER-SPECIFIC|DISASSEMBLY' audit/v12-picker-route-20261014.txt | head -80 || true
      - name: Trace sheetCard geometry from original v12 (read only)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picker-venv/bin/python" scripts/v12_host_recovery.py "$RUNNER_TEMP/DuoFaceDashboard.dylib" 0xa0420:0xa0aec 0xa28e8:0xa2a58 0xa2a58:0xa2c40 > audit/v12-picker-sheet-geometry-20261014.txt
          grep -E 'DISASSEMBLY|SEL (setFrame:|setBounds:|bounds|frame|addSubview:|contentView|setCenter:|setTransform:)' audit/v12-picker-sheet-geometry-20261014.txt | head -100 || true
      - name: Trace picker access and dismiss path in fullscreen host (read only)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picker-venv/bin/python" scripts/v12_host_recovery.py "$RUNNER_TEMP/DuoFaceDashboard.dylib" 0xaa800:0xaacf0 0xab1d4:0xab70c 0xab70c:0xab8c0 0xa9ce0:0xa9d1c > audit/v12-picker-fullscreen-access-20261014.txt
          wc -l audit/v12-picker-fullscreen-access-20261014.txt
          grep -E 'DISASSEMBLY|SEL addSubview:|SEL removeFromSuperview|SEL setHidden:|SEL dismissOverlay|SEL showAppPicker' audit/v12-picker-fullscreen-access-20261014.txt | head -75 || true
      - name: Trace original per-pane Expand and Restore controls from v12 (NO DEB)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picker-venv/bin/python" scripts/v12_host_recovery.py "$RUNNER_TEMP/DuoFaceDashboard.dylib" 0x841c0:0x84c30 0x84c30:0x85348 0x85348:0x85904 > audit/v12-split-pill-button-chain-20261014.txt
          "$RUNNER_TEMP/picker-venv/bin/python" scripts/v12_host_recovery.py "$RUNNER_TEMP/DuoFaceDashboard.dylib" 0x105890:0x105e2c 0x105e2c:0x106518 0x106518:0x106560 0x1067a4:0x106f00 0x27fee4:0x280014 > audit/v12-split-focus-restore-chain-20261014.txt
          wc -l audit/v12-split-pill-button-chain-20261014.txt audit/v12-split-focus-restore-chain-20261014.txt
          grep -E "DISASSEMBLY|SEL (setOnExpandTapped:|setOnRestoreTapped:|setFocusedMode:|setShowsExpandButton:|toggleFocusForSlot:|restoreSplitAnimated:|focusSlot:animated:|showAppPickerForSlot:)" audit/v12-split-pill-button-chain-20261014.txt audit/v12-split-focus-restore-chain-20261014.txt | head -120 || true
      - name: Trace slot-pill callback binding and split focus layout (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picker-venv/bin/python" scripts/v12_host_recovery.py "$RUNNER_TEMP/DuoFaceDashboard.dylib" 0x1025e4:0x103ee0 0x103ee0:0x1044f8 0x1044f8:0x105890 0x106f00:0x108dd8 > audit/v12-split-slot-wiring-full-20261014.txt
          grep -C 16 -E 'SEL (setOnExpandTapped:|setOnRestoreTapped:|setOnPillTapped:|setFocusedMode:|setShowsExpandButton:|toggleFocusForSlot:|restoreSplitAnimated:|focusSlot:animated:|onExpandTapped|onRestoreTapped|setSlotIndex:|layoutSplitViews)' audit/v12-split-slot-wiring-full-20261014.txt > audit/v12-split-slot-wiring-extract-20261014.txt
          wc -l audit/v12-split-slot-wiring-full-20261014.txt audit/v12-split-slot-wiring-extract-20261014.txt
      - name: Trace native Close App handlers and active split deactivation (READ ONLY)
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/picker-venv/bin/python" scripts/v12_host_recovery.py "$RUNNER_TEMP/DuoFaceDashboard.dylib" 0xa91ec:0xa9a88 0x19d458:0x19d700 > audit/v12-picker-close-app-chain-20261014.txt
          wc -l audit/v12-picker-close-app-chain-20261014.txt
          grep -E 'DISASSEMBLY|SEL (deactivateCurrentApp|closeSingleAppTapped:|closeAllBridgedAppsTapped:|removeFromSuperview|dismissOverlay|terminate|stop|kill|close|setHidden:)' audit/v12-picker-close-app-chain-20261014.txt | head -120 || true
      - name: Save static audit evidence to this repo (no installation)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/v12-picker-close-app-chain-20261014.txt audit/v12-picker-sheet-geometry-20261014.txt audit/v12-picker-route-20261014.txt audit/v12-picker-text-probe-20261014.txt audit/v12-picker-header-20261014.txt audit/v12-picker-style-20261014.txt audit/v12-picker-fullscreen-access-20261014.txt audit/v12-split-pill-button-chain-20261014.txt audit/v12-split-focus-restore-chain-20261014.txt audit/v12-split-slot-wiring-full-20261014.txt audit/v12-split-slot-wiring-extract-20261014.txt
          git commit -m "audit: retain exact v12 picker call graph [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
