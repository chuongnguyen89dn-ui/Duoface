name: DuoFace Actions status snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  actions: read
  contents: write
concurrency:
  group: duoface-actions-status
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Collect all Actions runs and latest failures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, datetime
          repo=os.environ['GH_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          summary=get('/actions/runs?per_page=1')
          total=summary['total_count']
          runs=get('/actions/runs?per_page=100')['workflow_runs']
          by_workflow={}
          for r in runs:
              name=r['name']
              x=by_workflow.setdefault(name,{'recent_runs':0,'success':0,'failure':0,'other':0})
              x['recent_runs']+=1
              c=r['conclusion']
              x[c if c in ('success','failure') else 'other']+=1
          output={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'repository':repo,'total_actions_runs':total,'counts_scope':'by_workflow counts are for latest 100 runs only','by_workflow_recent':by_workflow,'latest_runs':[{'id':r['id'],'name':r['name'],'run_number':r['run_number'],'status':r['status'],'conclusion':r['conclusion'],'url':r['html_url'],'created_at':r['created_at'],'head_sha':r['head_sha']} for r in runs[:30]]}
          dest=pathlib.Path('status/duoface-actions.json');dest.parent.mkdir(exist_ok=True)
          dest.write_text(json.dumps(output,indent=2,ensure_ascii=False)+'\n')
          print('Total Actions runs:',total)
          PY
      - name: Commit snapshot for cross-chat access
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/duoface-actions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: snapshot DuoFace Actions run status [skip ci]"
            git push
          fi
