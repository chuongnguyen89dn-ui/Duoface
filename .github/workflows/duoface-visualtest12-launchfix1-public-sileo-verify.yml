name: DuoFace VisualTest12 Launchfix1 public Sileo download verification
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duoface-visualtest12-launchfix1-public-sileo-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-visualtest12-launchfix1-public-download
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check live Sileo index and download actual VisualTest12 candidate and Hub separately
        shell: bash
        run: |
          set -euo pipefail
          root='https://chuongnguyen89dn-ui.github.io/carplaydsp'
          dir="$RUNNER_TEMP/sileo-public-visual12"
          mkdir -p "$dir"
          ok=0
          for i in $(seq 1 25); do
            if curl --fail --silent --show-error --location --retry 2 \
              -H 'Cache-Control: no-cache' "$root/Packages?fresh=$i" -o "$dir/Packages"; then
              if grep -Fxq 'Version: 1.0.3-12~visualtest12launch1' "$dir/Packages"; then
                ok=1; break
              fi
            fi
            echo "WAIT_FOR_PAGES_PROPAGATION_$i"
            sleep 20
          done
          test "$ok" = 1
          curl --fail --silent --show-error --location --retry 3 \
            -H 'Cache-Control: no-cache' "$root/Release?fresh=verified" -o "$dir/Release"
          app='com.duonavi.app_1.0.3-12~visualtest12launch1_iphoneos-arm64.deb'
          curl --fail --silent --show-error --location --retry 3 \
            "$root/debs/$app" -o "$dir/$app"
          echo "e30148affc767ce039040f0e0cccd9a0ecbd40e523ee66409ca96e6ef2085f02  $dir/$app" | sha256sum -c -
          test "$(dpkg-deb -f "$dir/$app" Package)" = com.duonavi.app
          test "$(dpkg-deb -f "$dir/$app" Version)" = '1.0.3-12~visualtest12launch1'
          test "$(dpkg-deb -f "$dir/$app" Architecture)" = iphoneos-arm64
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'sileo-public-visual12'
          packages=(root/'Packages').read_text()
          blocks=[b for b in packages.split('\n\n') if b.strip()]
          def field(block,key):
              return next((line[len(key)+2:] for line in block.splitlines()
                           if line.startswith(key+': ')),None)
          v=[b for b in blocks if field(b,'Package')=='com.duonavi.app']
          hub=[b for b in blocks if field(b,'Package')=='com.duoface.independent']
          assert len(v)==len(hub)==1,(len(v),len(hub))
          assert field(v[0],'Version')=='1.0.3-12~visualtest12launch1'
          assert field(hub[0],'Version')=='0.1.0~native12+speed8compact'
          expected_app='com.duonavi.app_1.0.3-12~visualtest12launch1_iphoneos-arm64.deb'
          assert field(v[0],'Filename')=='debs/'+expected_app
          expected_sha='e30148affc767ce039040f0e0cccd9a0ecbd40e523ee66409ca96e6ef2085f02'
          assert field(v[0],'SHA256')==expected_sha
          assert field(hub[0],'SHA256')=='2fe8892c5ef8762e1e83b0fd6c4a029e25fc11758cc98fdbbb851bf6637e68ad'
          assert 'Date:' in (root/'Release').read_text()
          assert 'SHA256:' in (root/'Release').read_text()
          f=root/expected_app
          assert hashlib.sha256(f.read_bytes()).hexdigest()==expected_sha
          report={'status':'VISUALTEST12_LAUNCHFIX1_PUBLIC_SILEO_EXACT_DOWNLOAD_PASS',
                  'package':'com.duonavi.app',
                  'version':field(v[0],'Version'),
                  'sha256':expected_sha,
                  'url':'https://chuongnguyen89dn-ui.github.io/carplaydsp/debs/'+expected_app,
                  'hub_version_unchanged':field(hub[0],'Version'),
                  'hub_sha256_unchanged':field(hub[0],'SHA256'),
                  'launch_on_expired_iphone_verified':False,
                  'carplay_runtime_tested':False,
                  'source_modified_by_this_run':False}
          output=Path('audit/payload-migration/VISUALTEST12_LAUNCHFIX1_PUBLIC_SILEO.json')
          output.parent.mkdir(parents=True,exist_ok=True)
          output.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('VISUALTEST12_PUBLIC_SILEO_SHA256_AND_HUB_UNCHANGED_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-visualtest12-launchfix1-public-Sileo-verification
          path: audit/payload-migration/VISUALTEST12_LAUNCHFIX1_PUBLIC_SILEO.json
          if-no-files-found: warn
      - name: Preserve exact public download evidence in DuoFace repository
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/VISUALTEST12_LAUNCHFIX1_PUBLIC_SILEO.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: VisualTest12 launchfix1 exact live Sileo SHA and unchanged Hub [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
