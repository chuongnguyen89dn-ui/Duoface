name: DuoDash FPS/encoder performance deep readonly trace
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duodash-fps-encoder-thermal-deep-audit.yml'
      - 'migration/full_payload/native_test/trace_duodash_carplay_fps_113.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duodash-fps-encoder-static-deep
  cancel-in-progress: false
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin and verify archived DuoDash (not original 1.1.3 uploaded package)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duodash"
          curl -fsSL --retry 4 --retry-delay 2 \
            'https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/5f683ad16a2c4f2b37e333e891cfb8f7ba3e0d6b/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb' \
            -o "$RUNNER_TEMP/duodash/archived-duodash.deb"
          test "$(git hash-object "$RUNNER_TEMP/duodash/archived-duodash.deb")" = "6f3e7a4543a01358b3c1e24653aec5bdb3975206"
          echo EXACT_DUODASH_ARCHIVED_DEB_GIT_SHA1_VERIFIED
      - name: CPU/thermal relevant symbol/stub and codec/frame config audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages capstone==5.0.6
          python3 migration/full_payload/native_test/trace_duodash_carplay_fps_113.py \
            --deb "$RUNNER_TEMP/duodash/archived-duodash.deb" \
            --out audit/duodash-1.1.3/DUODASH_FPS_ENCODER_SYMBOL_TRACE.json
          python3 - <<'PY'
          import json
          path='audit/duodash-1.1.3/DUODASH_FPS_ENCODER_SYMBOL_TRACE.json'
          d=json.load(open(path))
          assert d['status']=='DUODASH_FPS_ARCHIVED_DEB_INSTRUMENTED_STATIC_TRACE'
          assert 'arm64' in d['arch_data']
          assert not d['deb_mutated'] and not d['runtime_tested']
          print('DUODASH_FPS_IMPORT_AND_CODE_XREF_PASS')
          PY
      - name: Save readonly evidence in DuoFace GitHub branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/duodash-1.1.3/DUODASH_FPS_ENCODER_SYMBOL_TRACE.json
          if git diff --cached --quiet; then echo DUODASH_FPS_REPORT_UNCHANGED; exit 0; fi
          git commit -m 'audit: DuoDash CarPlay FPS and encoder symbols trace [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            if git push origin HEAD:feature/duoface-exact-payload-migration; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duodash-fps-encoder-symbol-evidence
          path: audit/duodash-1.1.3/DUODASH_FPS_ENCODER_SYMBOL_TRACE.json
          if-no-files-found: warn
