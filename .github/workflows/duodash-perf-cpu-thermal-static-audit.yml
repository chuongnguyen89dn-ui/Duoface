name: DuoDash CPU and thermal read-only binary trace
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duodash-perf-cpu-thermal-static-audit.yml'
      - 'migration/full_payload/native_test/audit_duodash_perf_thermal_113.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duodash-static-cpu-thermal-analysis
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and read relevant central skill ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duodash-skills"
          for name in 01-github-continuity 02-ios-deb-ipa-carplay 05-research-debug-testing; do
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills/$name.zip" \
              -o "$RUNNER_TEMP/duodash-skills/$name.zip"
            unzip -t "$RUNNER_TEMP/duodash-skills/$name.zip" | tail -1
            echo "SKILL_READ_BEGIN:$name"
            unzip -Z1 "$RUNNER_TEMP/duodash-skills/$name.zip"
            unzip -p "$RUNNER_TEMP/duodash-skills/$name.zip" SKILL.md | head -150
            echo "SKILL_READ_END:$name"
          done
          echo CENTRAL_SKILL_ZIPS_VALID_AND_READ_PASS
      - name: Download EXACT archived DuoDash reference from its owner repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/duodash"
          url='https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/5f683ad16a2c4f2b37e333e891cfb8f7ba3e0d6b/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb'
          dest="$RUNNER_TEMP/duodash/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb"
          curl -fL --retry 4 --retry-delay 3 "$url" -o "$dest"
          test "$(git hash-object "$dest")" = '6f3e7a4543a01358b3c1e24653aec5bdb3975206'
          sha256sum "$dest"
          dpkg-deb -f "$dest" Package Version Architecture
          echo PINNED_DAUDAT_DUODASH_REF_BLOB_VERIFIED
      - name: Static MachO references and settings ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages 'capstone==5.0.6'
          python3 migration/full_payload/native_test/audit_duodash_perf_thermal_113.py \
            --deb "$RUNNER_TEMP/duodash/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb" \
            --out audit/duodash-1.1.3/DUODASH_PERF_CPU_THERMAL_RAW_TRACE.json
          python3 - <<'PY'
          import json
          path='audit/duodash-1.1.3/DUODASH_PERF_CPU_THERMAL_RAW_TRACE.json'
          j=json.load(open(path))
          assert j['status']=='DUODASH_PERF_THERMAL_STATIC_PINNED_BINARY_AUDIT'
          assert j['source_git_blob_sha1']=='6f3e7a4543a01358b3c1e24653aec5bdb3975206'
          assert not j['modified'] and not j['device_tested']
          print('DUODASH_PERF_THERMAL_READONLY_REPORT_VALID_PASS')
          PY
      - name: Save binary analysis source report in DuoFace repo only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/duodash-1.1.3/DUODASH_PERF_CPU_THERMAL_RAW_TRACE.json
          if git diff --cached --quiet; then echo REPORT_UNCHANGED; exit 0; fi
          git commit -m 'audit: DuoDash Optimize CPU and Thermal readonly binary trace [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            if git push origin HEAD:feature/duoface-exact-payload-migration; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duodash-perf-thermal-static-forensic
          path: audit/duodash-1.1.3/DUODASH_PERF_CPU_THERMAL_RAW_TRACE.json
          if-no-files-found: warn
