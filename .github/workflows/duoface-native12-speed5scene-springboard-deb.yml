name: DuoFace Native12 Speed5Scene GOFA-style SpringBoard overlay candidate NO Sileo
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - '.github/workflows/duoface-native12-speed5scene-springboard-deb.yml'
      - 'Makefile.speedhud-scene-stage'
      - 'DuoFaceSpeedHUDScene.plist'
      - 'runtime/speedbubble/DFSpeedSceneOverlay.mm'
      - 'runtime/speedbubble/DFSpeedBubbleBridge.mm'
      - 'migration/full_payload/native_test/build_native12_speed5scene_candidate.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: df-native12-speed5scene-isolation
  cancel-in-progress: false
jobs:
  isolate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable Native12, SpringBoard only filter and strict split-active gates
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg ldid
          base=dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb
          echo "85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7  $base" | shasum -a 256 -c -
          python3 -m py_compile migration/full_payload/native_test/build_native12_speed5scene_candidate.py
          plutil -lint DuoFaceSpeedHUDScene.plist
          grep -Fq '"SpringBoard"' DuoFaceSpeedHUDScene.plist
          ! grep -Ei 'CarPlayApp|CarPlayTemplateUIHost|com.waze|com.lumi.GOFA' DuoFaceSpeedHUDScene.plist
          grep -Fq 'DFSceneStartInSpringBoard' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'CBBridgeManager.window unavailable' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'DFSceneValidBridge' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'bridge.isVisible' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'rootWindow' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'initWithWindowScene:' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'w.windowLevel=10000000' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'local.gofahud.carplay.gofa-active' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'DFSceneWrappedHide' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'DFSceneWrappedDestroy' runtime/speedbubble/DFSpeedSceneOverlay.mm
          grep -Fq 'return nil; // Never show on iPhone or generic Home.' runtime/speedbubble/DFSpeedSceneOverlay.mm || true
          ! grep -Fi 'DFSpeedAppObserver' Makefile.speedhud-scene-stage
          ! grep -Ei 'GMapReader|GofaCarplay|Waze' Makefile.speedhud-scene-stage
          dpkg --compare-versions '0.1.0~native12+speed5scene' gt '0.1.0~native12+speed4split'
      - name: Theos compile one GOFA scene overlay module
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          cp Makefile.speedhud-scene-stage Makefile
          THEOS="$RUNNER_TEMP/theos" make clean all FINALPACKAGE=1
          dylib="$(find .theos -type f -name 'DuoFaceSpeedHUD.dylib' -print -quit)"
          test -s "$dylib"
          cp "$dylib" "$RUNNER_TEMP/DuoFaceSpeedHUD.dylib"
          xcrun lipo "$RUNNER_TEMP/DuoFaceSpeedHUD.dylib" -verify_arch arm64
      - name: Package pinned Native12 plus isolated SpringBoard-only overlay
        shell: bash
        run: |
          set -euo pipefail
          target=dist/payload-migration/native12-speed5scene
          mkdir -p "$target"
          deb="$target/com.duoface.independent_0.1.0~native12+speed5scene_iphoneos-arm64.deb"
          test ! -e "$deb"
          python3 migration/full_payload/native_test/build_native12_speed5scene_candidate.py \
              --hud "$RUNNER_TEMP/DuoFaceSpeedHUD.dylib" \
              --output "$deb" \
              --report "$target/BAO_CAO.json"
          test "$(dpkg-deb -f "$deb" Version)" = '0.1.0~native12+speed5scene'
          test "$(dpkg-deb -f "$deb" Package)" = 'com.duoface.independent'
          dpkg-deb -c "$deb" > "$target/CONTENTS.txt"
          grep -F 'DuoFaceSpeedHUD.dylib' "$target/CONTENTS.txt"
          ! grep -Ei 'WazeGMapHUDSource|GofaGMapHUDSource|GoogleMapsVietMap|GMapHUDPlacementRelay' "$target/CONTENTS.txt"
          shasum -a 256 "$deb" > "$target/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-native12-speed5scene-isolation-deb
          path: dist/payload-migration/native12-speed5scene/
          if-no-files-found: warn
      - name: Persist QA candidate only to DuoFace feature branch; NO Sileo
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/payload-migration/native12-speed5scene/
          git diff --cached --quiet && exit 0
          git commit -m 'artifact: Native12 Speed5Scene SpringBoard candidate, NOT device verified [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
