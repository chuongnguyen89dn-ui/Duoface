name: Build DuoFace 1.0.3-12 uploaded artwork (no Sileo publish)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/duoface-main-deb.yml'
      - '.github/workflows/duoface-hook-check.yml'
      - 'src/DuoFaceVisualHook.m'
      - 'scripts/build_visual_release.py'
      - 'DuoFace_5_images_REVIEW_before_upload.zip'
permissions:
  contents: write
concurrency:
  group: duoface-main-visual-build
  cancel-in-progress: false
jobs:
  compile:
    uses: ./.github/workflows/duoface-hook-check.yml
  package:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and package inspection dependencies
        run: |
          python -m pip install Pillow==11.3.0
          command -v dpkg-deb
      - uses: actions/download-artifact@v4
        with:
          name: duoface-current-hook-${{ github.sha }}
          path: current-hook
      - name: Verify same-commit hook and build complete DEB
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat current-hook/SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          python scripts/build_visual_release.py --hook current-hook/DuoFaceVisualHook.dylib --output dist/visual-1.0.3-12
          python - <<'PY'
          import json, os, pathlib
          out=pathlib.Path('dist/visual-1.0.3-12')
          record={k:os.environ[k] for k in ('GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_REPOSITORY')}
          record['run_url']='https://github.com/'+record['GITHUB_REPOSITORY']+'/actions/runs/'+record['GITHUB_RUN_ID']
          (out/'SOURCE.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          cp current-hook/SHA256SUMS dist/visual-1.0.3-12/HOOK_SHA256SUMS
          cp current-hook/entitlements.plist dist/visual-1.0.3-12/HOOK_ENTITLEMENTS.plist
      - uses: actions/upload-artifact@v4
        with:
          name: duoface-full-1.0.3-12-visualtest
          path: dist/visual-1.0.3-12/
          if-no-files-found: error
      - name: Persist DEB and verification to this project repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          git add dist/visual-1.0.3-12/
          git diff --cached --quiet || git commit -m "build: persist DuoFace 1.0.3-12 DEB and exact artwork verification"
          git push origin HEAD:main
      - name: State verification boundary
        run: echo 'Compile, signing and package checks passed. iPhone/CarPlay runtime test pending. No Sileo publication.' >> "$GITHUB_STEP_SUMMARY"
