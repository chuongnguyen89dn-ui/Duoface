name: DuoFace native12 connection full ObjC owner audit readonly
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - 'migration/full_payload/native_test/audit_native12_connection_hooks_full.py'
      - '.github/workflows/duoface-native12-connection-full-owners-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-native12-connection-full-owners
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read original connection owner classes from exact native12 DEB
        run: |
          set -euo pipefail
          DEB=dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb
          printf '%s  %s\n' 85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7 "$DEB" | sha256sum -c -
          python3 migration/full_payload/native_test/audit_native12_connection_hooks_full.py --deb "$DEB" --out audit/payload-migration/NATIVE12_CONNECTION_FULL_OWNERS_READONLY.json
          python3 - <<'PY'
          import json
          j=json.load(open("audit/payload-migration/NATIVE12_CONNECTION_FULL_OWNERS_READONLY.json"))
          assert j["status"]=="NATIVE12_CONNECTION_HOOK_OWNERS_FULL_OBJC_READONLY"
          assert len(j["binaries"]["DuoFaceDashboard"]["CBBridgeManager"])>40
          print("ACTUAL_CONNECTION_OWNER_CLASSES_VERIFIED")
          PY
      - name: Persist audit result to feature branch, no build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/NATIVE12_CONNECTION_FULL_OWNERS_READONLY.json
          git diff --cached --quiet && exit 0
          git commit -m 'audit: native12 full connection owner selector and ABI inventory [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-connection-owner-methods
          path: audit/payload-migration/NATIVE12_CONNECTION_FULL_OWNERS_READONLY.json
          if-no-files-found: warn
