name: DuoFace active source continuation pointer - documentation only
on:
  push:
    branches: [fix/qa173-logo-map-touch-recall-20261106]
    paths: ['.github/workflows/duoface-174-device-verdict-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa174-device-verdict-docs
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tiep tuc du an.md
            /sideplay/tiep tuc du an.md
      - name: Link existing canonical handoffs to source-tested QA180 branch
        env:
          BRANCH: fix/qa173-logo-map-touch-recall-20261106
          NEXT_BRANCH: fix/qa180-owned-wake-map-replace-20261106
          SOURCE: ca7ebdad2129594087b5c9acd0bff73b11dc33e0
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'chuongnguyen89dn-ui/Duoface'
          test "$GITHUB_REF_NAME" = "$BRANCH"
          git fetch --no-tags origin "$NEXT_BRANCH"
          git show "$SOURCE:sideplay/tiep tuc du an.md" > "$RUNNER_TEMP/qa180-checkpoint.txt"
          grep -Fq QA180-OWNED-WAKE-MAP-REPLACE-SOURCE-20261106 "$RUNNER_TEMP/qa180-checkpoint.txt"
          git cat-file -e "$SOURCE:sideplay/duoface-native-scene-host/DFOwnedWakeSurface180.m"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin "$BRANCH"
            git checkout --detach FETCH_HEAD
            python3 - <<'PY'
          import os
          from pathlib import Path
          marker='## CHECKPOINT QA180-ACTIVE-WORK-BRANCH-20261106'
          branch=os.environ['NEXT_BRANCH'];source=os.environ['SOURCE']
          note=(marker+'\n\n'
            '- ACTIVE IMPLEMENTATION HAS MOVED to `'+branch+'` in this SAME repository. Do not resume coding on the old QA173 branch or rebuild published0.0.174 with new bytes. Read `sideplay/tiep tuc du an.md` and `tiep tuc du an.md` on the new branch first.\n'
            '- Verified source and handoff commit: `'+source+'`; source-only CI run42167040381 completed successfully. Implemented actual owned in-path hidden-contact wake capture plus selected occupied-pane native-map replacement, with actual empty-pane readback and ACK/restore/rollback.\n'
            '- Evidence: new branch `sideplay/audit/qa180-owned-wake-map-replace-20261106/IMPLEMENTATION.md`, `changes.patch`, `evidence/`; workflow `.github/workflows/duoface-180-owned-wake-map-replace.yml` contains exact executed commands. Two original-source regressions rejected,41 Python tests passed, production gate tested using UIKit MODEL through20 hide/wake cycles,13 Foundation policy cases passed,4 production files passed iOSarm64 syntax compilation. These are NOT physical CarPlay acceptance.\n'
            '- Under-lock/lifecycle, native coordinator and GOFA general relay unchanged by blob checks. New-version packaging and official-source delivery are next. Existing Sileo0.0.174 is unchanged and remains user-rejected; separate Google Maps standalone scene identity and Home publication remain OPEN. No additional device logs needed for these two repairs.\n'
            '- This pointer update changes documentation ONLY, preserving all earlier findings below. Pointer job '+os.environ['GITHUB_RUN_ID']+'.\n\n')
          for filename in ('sideplay/tiep tuc du an.md','tiep tuc du an.md'):
              path=Path(filename);old=path.read_text()
              if marker not in old:path.write_text(note+old)
              assert marker in path.read_text() and path.read_text().endswith(old)
          PY
            git add -- 'sideplay/tiep tuc du an.md' 'tiep tuc du an.md'
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'docs: continue on source-tested QA180 branch ca7ebdad; old release unchanged [skip ci]'
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              git show -s --format='%H %s'
              exit 0
            fi
          done
          echo 'Handoff pointer conflicted; no force-push' >&2
          exit 1
