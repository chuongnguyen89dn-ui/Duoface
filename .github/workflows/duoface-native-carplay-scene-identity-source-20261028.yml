name: DuoFace original-verified native CarPlay Maps scene identity only
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - 'sideplay/native-carplay-scene-v1/DFCarPlayNativeSceneIdentity.h'
      - 'sideplay/native-carplay-scene-v1/DFCarPlayNativeSceneTimeline.h'
      - 'sideplay/native-carplay-scene-v1/DFCarPlayNativeMapPaneAssessment.h'
      - 'sideplay/native-carplay-scene-v1/DFCarPlayNativeMapViewportPlan.h'
      - 'sideplay/native-carplay-scene-v1/DFNativeMapPaneAdapter.h'
      - 'sideplay/native-carplay-scene-v1/DFNativeMapPaneAdapter.m'
      - 'sideplay/native-carplay-scene-v1/DFNativeMapPaneCoordinator.m'
      - 'sideplay/native-carplay-scene-v1/DFNativeMapPaneCoordinator.plist'
      - 'sideplay/duoface-native-scene-host/DFNativeHostRootController.m'
      - 'sideplay/duoface-native-scene-host/build.sh'
      - 'sideplay/native-carplay-scene-v1/tests/native_carplay_map_viewport_runtime.m'
      - 'sideplay/native-carplay-scene-v1/tests/native_carplay_map_pane_assessment_runtime.m'
      - 'sideplay/native-carplay-scene-v1/tests/native_carplay_scene_timeline_runtime.m'
      - 'sideplay/native-carplay-scene-v1/DFCarPlayLiveOwnerSnapshot.m'
      - 'sideplay/native-carplay-scene-v1/tests/native_carplay_scene_identity_runtime.m'
      - '.github/workflows/duoface-native-carplay-scene-identity-source-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-party-native-owner-gate:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exercise live observed Google Maps and DuoFace scene identity (Foundation runtime)
        shell: bash
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            sideplay/native-carplay-scene-v1/tests/native_carplay_scene_identity_runtime.m \
            -o "$RUNNER_TEMP/native-carplay-scene-identity"
          "$RUNNER_TEMP/native-carplay-scene-identity"
          echo DUOFACE_REAL_NATIVE_GOOGLE_MAPS_SCENE_CLASSIFIER_EXECUTABLE_PASS
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            sideplay/native-carplay-scene-v1/tests/native_carplay_scene_timeline_runtime.m \
            -o "$RUNNER_TEMP/native-carplay-scene-timeline"
          "$RUNNER_TEMP/native-carplay-scene-timeline"
          echo DUOFACE_NATIVE_MAPS_OWNER_REBIND_GENERATION_TIMELINE_PASS
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -framework Foundation \
            sideplay/native-carplay-scene-v1/tests/native_carplay_map_pane_assessment_runtime.m \
            -o "$RUNNER_TEMP/native-map-phone-scene-join"
          "$RUNNER_TEMP/native-map-phone-scene-join"
          echo DUOFACE_ONE_NATIVE_MAP_PLUS_PHONE_SCENE_READONLY_RUNTIME_PASS
          xcrun clang -fobjc-arc -Wall -Wextra -Werror \
            -framework Foundation -framework CoreGraphics \
            sideplay/native-carplay-scene-v1/tests/native_carplay_map_viewport_runtime.m \
            -o "$RUNNER_TEMP/native-map-measured-viewport"
          "$RUNNER_TEMP/native-map-measured-viewport"
          echo DUOFACE_NATIVE_MAPS_MEASURED_DOCK_VIEWPORT_RUNTIME_PASS
      - name: iOS16 ARM64 compile-only + preserve known-good .90 source byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -fblocks \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -Werror=implicit-function-declaration -Werror=incompatible-pointer-types \
            -Wno-deprecated-declarations \
            sideplay/native-carplay-scene-v1/DFCarPlayLiveOwnerSnapshot.m
          # Staged same-process UIKit controller binder; no current runtime caller.
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -fblocks \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -Werror=implicit-function-declaration -Werror=incompatible-pointer-types \
            -Wno-deprecated-declarations \
            sideplay/native-carplay-scene-v1/DFNativeMapPaneAdapter.m
          # New explicit user-action wiring: CarPlay-only process coordinator
          # and iPhone QA control are separately syntax checked for iOS16.
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -fblocks \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -Werror=implicit-function-declaration -Werror=incompatible-pointer-types \
            -Wall -Wextra -Werror -Wno-deprecated-declarations \
            sideplay/native-carplay-scene-v1/DFNativeMapPaneCoordinator.m
          xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -fblocks \
            -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -Werror=implicit-function-declaration -Werror=incompatible-pointer-types \
            -Wall -Wextra -Werror -Wno-deprecated-declarations \
            sideplay/duoface-native-scene-host/DFNativeHostRootController.m
          echo DUOFACE_NATIVE_MAPS_OPTIN_APP_CARPLAY_COORDINATOR_IOS16_SYNTAX_PASS_NO_DEVICE_TEST
          echo DUOFACE_NATIVE_MAPS_STAGED_SAME_PROCESS_CONTAINMENT_SYNTAX_PASS_NO_DEVICE_TEST
          SOURCE='53781cca1ca9285975394754ac9080ca35b57cda'
          git diff --exit-code "$SOURCE" HEAD -- \
            sideplay/duoface-native-scene-host/DFYouTubeOrientationVirtualization.m \
            sideplay/duoface-native-scene-host/DFYouTubeOrientationRelay.m \
            sideplay/duoface-native-scene-host/DFSceneHost.m \
            sideplay/duoface-native-scene-host/DFSceneLifecycle.m \
            sideplay/duoface-native-scene-host/DFNative12Chrome.m \
            sideplay/duoface-native-scene-host/DFCarPlayDockOwner.m
          grep -Fq 'DFCarPlayNativeSceneRoute(entry)' sideplay/native-carplay-scene-v1/DFCarPlayLiveOwnerSnapshot.m
          grep -Fq 'DFCarPlayNativeSceneTimelineAdvance(' sideplay/native-carplay-scene-v1/DFCarPlayLiveOwnerSnapshot.m
          grep -Fq 'DFCarPlayNativeMapPaneAssessment(' sideplay/native-carplay-scene-v1/DFCarPlayLiveOwnerSnapshot.m
          grep -Fq 'DFCarPlayNativeMapViewportPlan(scenes,phoneLayout)' sideplay/native-carplay-scene-v1/DFCarPlayLiveOwnerSnapshot.m
          grep -Fq '"mapSceneSizedForPane":@NO' sideplay/native-carplay-scene-v1/DFCarPlayNativeMapViewportPlan.h
          grep -Fq '"canAttachPane":@NO' sideplay/native-carplay-scene-v1/DFCarPlayNativeMapViewportPlan.h
          grep -Fq '"canAttachPane":@NO' sideplay/native-carplay-scene-v1/DFCarPlayNativeMapPaneAssessment.h
          grep -Fq '"nativeMapTilesRendered":@NO' sideplay/native-carplay-scene-v1/DFCarPlayNativeMapPaneAssessment.h
          if grep -E 'foregroundSceneWithSettings|backgroundSceneWithCompletion|requestStateChange:|makeKeyAndVisible|MSHookMessageEx' sideplay/native-carplay-scene-v1/DFCarPlayNativeMapPaneAssessment.h; then exit 1; fi
          grep -Fq '"canAttachPane":@NO' sideplay/native-carplay-scene-v1/DFCarPlayNativeSceneTimeline.h
          if grep -E 'foregroundSceneWithSettings|backgroundSceneWithCompletion|requestStateChange:|makeKeyAndVisible|MSHookMessageEx' sideplay/native-carplay-scene-v1/DFCarPlayNativeSceneTimeline.h; then exit 1; fi
          grep -Fq 'DFIntegratedCarPlayCaptureLiveOwnerSnapshot' sideplay/duoface-native-scene-host/build.sh
          echo DUOFACE_090_WORKING_ORIENTATION_CHROME_MAPS_DOCK_BASELINE_UNCHANGED_PASS
          echo DUOFACE_CARPLAY_APP_REAL_NATIVE_SCENE_IDENTITY_SOURCE_ONLY_PASS_NO_RELEASE
