name: QA146 actual DuoNavi vs DuoDash REPACK deep bridge ABI READ ONLY
on:
  push:
    branches: [feature/duoface-qa146-native-home-exit-20261031]
    paths:
      - '.github/workflows/duoface-qa146-duonavi-duodash-deep-native-bridge-20261031.yml'
      - 'sideplay/audit/qa146-native-home-dock-parity-20261031/scan_duonavi_duodash_native_bridge_deep_20261031.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa146-duonavi-duodash-repacked-sha-pinned-deep
  cancel-in-progress: false
jobs:
  forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch and hash-verify 3 ZIP skills; actually read SKILL.md
        shell: bash
        run: |
          set -euo pipefail
          for item in \
            '01-github-continuity.zip 80efec9a6cbbb49135eabeafb339bf13f74ff6ddef9706659871b30a2c020d7e' \
            '02-ios-deb-ipa-carplay.zip c87b5ed9ef196c13f42dd41df49a032369028742cc8f6d56569637daf76ec7cf' \
            '05-research-debug-testing.zip fcb1122412a11664c2c6b8666cbc4f76e86ad20f96e697138d96c6425137dc98'; do
            read -r name hash <<< "$item"
            curl -fLsS --retry 3 "https://raw.githubusercontent.com/chuongnguyen89dn-ui/Gpt-training-/main/skills/$name" -o "$RUNNER_TEMP/$name"
            printf '%s  %s\n' "$hash" "$RUNNER_TEMP/$name" | sha256sum -c -
            unzip -t "$RUNNER_TEMP/$name" >/dev/null
            unzip -p "$RUNNER_TEMP/$name" SKILL.md | head -30
          done
      - name: Load verified existing first-party tagged MachO and capstone parsers
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages capstone==5.0.7
          mkdir -p "$RUNNER_TEMP/parsers"
          git fetch --no-tags --depth 1 origin feature/visual12-duodash-recovery
          git show FETCH_HEAD:migration/full_payload/native_test/audit_native12_license_class_xrefs.py > "$RUNNER_TEMP/parsers/audit_native12_license_class_xrefs.py"
          git show FETCH_HEAD:migration/full_payload/native_test/audit_native12_carplay_add_app_chain.py > "$RUNNER_TEMP/parsers/audit_native12_carplay_add_app_chain.py"
          python3 -m py_compile "$RUNNER_TEMP"/parsers/*.py \
            sideplay/audit/carplay-home-icons-20261030/trace_original_home_semantic_selectors.py \
            sideplay/audit/qa146-native-home-dock-parity-20261031/scan_duonavi_duodash_native_bridge_deep_20261031.py
      - name: Fetch exact authentic DuoNavi and separately identified DuoDash REPACK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debs"
          cp dist/com.duonavi.app_1.0.4_iphoneos-arm64.deb "$RUNNER_TEMP/debs/duonavi.deb"
          curl -fLsS --retry 3 'https://raw.githubusercontent.com/chuongnguyen89dn-ui/DauDat-CarPlay/main/DuoDash_1.1.3_Fullscreen427_iphoneos-arm64.deb' -o "$RUNNER_TEMP/debs/duodash-repack.deb"
          printf '%s  %s\n' \
             f3f911de5db461d487ce91249aed1bb25d44f076e7ff5fb89e54b658569328dd "$RUNNER_TEMP/debs/duonavi.deb" \
             ea0d3bb8c8b9da2b45c3f158f390a7966419e84899f820d06f45cd51401fa465 "$RUNNER_TEMP/debs/duodash-repack.deb" | sha256sum -c -
          dpkg-deb -f "$RUNNER_TEMP/debs/duonavi.deb" Package Version Architecture Depends Conflicts Provides
          dpkg-deb -f "$RUNNER_TEMP/debs/duodash-repack.deb" Package Version Architecture Depends Conflicts Provides
      - name: Reanalyze BOTH class metadata and method-local xrefs with tagged original parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reports"
          PYTHONPATH="$RUNNER_TEMP/parsers:sideplay/audit/carplay-home-icons-20261030" \
          python3 sideplay/audit/qa146-native-home-dock-parity-20261031/scan_duonavi_duodash_native_bridge_deep_20261031.py \
            --duonavi "$RUNNER_TEMP/debs/duonavi.deb" \
            --duodash-repack "$RUNNER_TEMP/debs/duodash-repack.deb" \
            --out "$RUNNER_TEMP/reports/DUONAVI_DUODASH_REPACK_NATIVE_APPBRIDGE_METHOD_CROSSWALK.json"
          python3 - "$RUNNER_TEMP/reports/DUONAVI_DUODASH_REPACK_NATIVE_APPBRIDGE_METHOD_CROSSWALK.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          a=d["images"]["duonavi_original"]
          b=d["images"]["duodash_113_fullscreen427_REPACK_NOT_STOCK"]
          assert a["classes_parsed"]>30 and b["classes_parsed"]>30
          assert a["method_count"]>=40 and b["method_count"]>=10
          assert b["tagged_macho_pointer_normalizations"]>0
          assert not d["native_device_runtime_verified"]
          print("DEEP_DUONAVI_DUODASH_REPACK_NATIVE_APP_SCENE_ABI_SUCCESS",
                a["method_count"],b["method_count"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DuoFace-QA146-both-real-DEBs-original-DuoNavi-and-DuoDash-REPACK
          path: ${{ runner.temp }}/reports/DUONAVI_DUODASH_REPACK_NATIVE_APPBRIDGE_METHOD_CROSSWALK.json
          if-no-files-found: error
      - name: Save sanitized evidence to DuoFace branch, then read it back
        shell: bash
        run: |
          set -euo pipefail
          BRANCH=feature/duoface-qa146-native-home-exit-20261031
          REL="sideplay/audit/qa146-native-home-dock-parity-20261031/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$BRANCH"
            T="$(mktemp -d)"
            git worktree add --detach "$T" FETCH_HEAD
            mkdir -p "$T/$REL"
            cp "$RUNNER_TEMP/reports/DUONAVI_DUODASH_REPACK_NATIVE_APPBRIDGE_METHOD_CROSSWALK.json" "$T/$REL/"
            printf 'RUN=%s\nCHECKOUT=%s\nSKILLS_SHA_CHECKED_AND_READ=true\nDUONAVI_ORIGINAL_SHA_CHECKED=true\nDUODASH_IS_REPACK_NOT_STOCK=true\nDUODASH_TAGGED_OBJC_FIXUPS_HANDLED=true\nNO_LICENSE_SOURCE_EXTRACTED=true\nNO_VENDOR_CODE_COPIED=true\nNO_DEVICE_TEST_OR_SILEO=true\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$T/$REL/CI_RESULT.txt"
            git -C "$T" config user.name 'github-actions[bot]'
            git -C "$T" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$T" add "$REL"
            git -C "$T" commit -m 'audit(qa146): exact original DuoNavi vs DuoDash REPACK deep method ABI [skip ci]'
            if git -C "$T" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$T"
              git fetch --no-tags origin "$BRANCH"
              git cat-file -e "FETCH_HEAD:$REL/DUONAVI_DUODASH_REPACK_NATIVE_APPBRIDGE_METHOD_CROSSWALK.json"
              echo EXACT_DUONAVI_DUODASH_REPACK_DEEP_RESULTS_SAVED_AND_READBACK
              exit 0
            fi
            git worktree remove --force "$T"
          done
          exit 1
