name: DuoFace ratio drag, disconnect and reconnect restore source QA (NO DEB)
on:
  push:
    branches: [feature/duoface-jb-embedded-appbridge-20261020]
    paths:
      - '.github/workflows/duoface-ratio-disconnect-restore-source-qa.yml'
      - 'sideplay/duoface-native-scene-host/DFNative12Chrome.m'
      - 'sideplay/duoface-native-scene-host/DFDividerDrag.h'
      - 'sideplay/duoface-native-scene-host/DFDisconnectCloseCoordinator.m'
      - 'sideplay/duoface-native-scene-host/DFSlotWorkspacePolicy.h'
      - 'sideplay/duoface-native-scene-host/tests/test_disconnect_close_106.py'
      - 'sideplay/duoface-native-scene-host/tests/test_workspace_098.py'
      - 'sideplay/duoface-native-scene-host/tests/test_scenehost_safety.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duoface-ratio-disconnect-restore-source-qa
  cancel-in-progress: true
jobs:
  ios16-regression:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: C ratio-drag + source contracts
        shell: bash
        run: |
          set -euo pipefail
          for case in test_divider_drag.py test_logo_hold_gate.py test_disconnect_close_106.py test_workspace_098.py test_scenehost_safety.py test_iphone_only_picker_and_divider_107.py; do
            python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p "$case" -v
          done
      - name: Compile actual iOS16 ARM64 Objective-C sources
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cd sideplay/duoface-native-scene-host
          for src in DFNative12Chrome.m DFDisconnectCloseCoordinator.m DFTouchOwnerProbe.m DFSceneHost.m DFNativeHostRootController.m; do
            xcrun --sdk iphoneos clang -fsyntax-only -fobjc-arc -fblocks -target arm64-apple-ios16.0 -isysroot "$SDK" -Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Wno-deprecated-declarations -I . "$src"
          done
      - name: Execute macOS Foundation disconnect and restore policy tests
        run: |
          set -euo pipefail
          cd sideplay/duoface-native-scene-host
          for name in disconnect_close_runtime workspace_runtime; do
            xcrun clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -I . "tests/$name.m" -o "$RUNNER_TEMP/$name"
            "$RUNNER_TEMP/$name"
          done
