concurrency:
  group: qa178-apptouch-hudhand-kbdiag-private-no-sileo
  cancel-in-progress: true
jobs:
  stage-only:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify independent selected Home and preserved scene-host contracts
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/darwin_mailbox_156.c -o "$RUNNER_TEMP/mailbox156"
          "$RUNNER_TEMP/mailbox156"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-deprecated-declarations -framework Foundation sideplay/duoface-native-scene-host/tests/app_state_ipc_156_runtime.m -o "$RUNNER_TEMP/ipc156"
          "$RUNNER_TEMP/ipc156"
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/dock_lifecycle_147.c -o "$RUNNER_TEMP/dock147"
          "$RUNNER_TEMP/dock147"
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/manager_lifecycle_149.c -o "$RUNNER_TEMP/manager149"
          "$RUNNER_TEMP/manager149"
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa144_no_split_home_redirect.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa145_controlled_home.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa146_native_home_exit.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa147_mount_ack_reentrancy.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa148_real_pid_and_stop_identity.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa149_manager_live_scene.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa150_workspace_preflight.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa151_workspace_owner_capture.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa152_workspace_prepare.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa153_phone_foreground_eviction.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa157_solo_owned_pill.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa158_home_only.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa159_native_home.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa160_homegrid_latency.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa161_first_solo_geometry.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa162_gofa_speed8_integration.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa163_global_speed8_owner.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa164_speed8_fullscreen_drag.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa165_native_gofa_standalone_roster.py' -v
          # QA166 original-specific symbols on main: do not copy proprietary audit to branch
          git fetch --depth=1 origin main
          git show FETCH_HEAD:sideplay/audit/carplaypro-0.9.97/macho/007-SpeedAlerts.dylib-arm64.section-strings.json > "$RUNNER_TEMP/qa166-original-symbols.json"
          test "$(git hash-object "$RUNNER_TEMP/qa166-original-symbols.json")" = b8db68f5314b386dad24835f32f74cdf4086e35e
          DF166_ORIGINAL_SYMBOL_FILE="$RUNNER_TEMP/qa166-original-symbols.json" python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa166_traffic_nav_evidence.py' -v
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/gofa_notification_167_runtime.c -o "$RUNNER_TEMP/gofa167"
          "$RUNNER_TEMP/gofa167"
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/native_maneuver_168_runtime.c -o "$RUNNER_TEMP/nav168"
          "$RUNNER_TEMP/nav168"
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa168_native_maneuver.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa169_bubble_visibility.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa170_transparent_x_real_gps.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa167_gofa_event_schema.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa175_touch_reliability.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa178_kbdiag_hudhold.py' -v
          clang++ -std=c++17 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/speed8/test_speed_protocol.cpp -o "$RUNNER_TEMP/gofa-speed8-protocol"
          "$RUNNER_TEMP/gofa-speed8-protocol"
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa154_staged_app_state.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa155_integrated_relay.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_bridged_content_window.py' -v
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/native_workspace_once_152.c -o "$RUNNER_TEMP/workspace152"
          "$RUNNER_TEMP/workspace152"
          python3 -m unittest discover -s sideplay/jb-embedded-appbridge/tests -p 'test_integrated_package_144.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_qa141_map_layout.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_scoped_bks_132.py' -v
          python3 -m unittest discover -s sideplay/duoface-native-scene-host/tests -p 'test_native_owner_contract.py' -v
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation sideplay/duoface-native-scene-host/tests/home_admission_141_forwarding_runtime.m -o "$RUNNER_TEMP/home141"
          "$RUNNER_TEMP/home141"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation sideplay/duoface-native-scene-host/tests/safari_home_roster_runtime.m -o "$RUNNER_TEMP/safari-roster"
          "$RUNNER_TEMP/safari-roster"
          clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-deprecated-declarations -framework Foundation sideplay/duoface-native-scene-host/tests/native_dashboard_context_runtime.m -o "$RUNNER_TEMP/dashboard-context"
          "$RUNNER_TEMP/dashboard-context"
          cc -std=c11 -Wall -Wextra -Werror sideplay/duoface-native-scene-host/tests/gofa_resize_141.c -o "$RUNNER_TEMP/gofa141"
          "$RUNNER_TEMP/gofa141"
      - name: Compile-check QA154 app-only relay source without packaging it
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -fsyntax-only \
            sideplay/duoface-native-scene-host/DF154GeneralAppStateRelay.m
      - name: Syntax-check independent Apple CarPlay maneuver adapter (iOS16)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios16.0 -isysroot "$SDK" -fobjc-arc -fblocks -Wall -Wextra -Werror -fsyntax-only sideplay/duoface-native-scene-host/DF168NativeManeuver.m sideplay/duoface-native-scene-host/DF168PublicCarPlayManeuverAdapter.m sideplay/duoface-native-scene-host/DFSpeedVisibility169.m
      - name: Prepare previous verified macOS iOS16 rootless toolchain
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          command -v ldid >/dev/null || brew install ldid
          command -v dpkg-deb >/dev/null || brew install dpkg
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build baseline first-party modules without runtime source changes
        run: |
          set -euo pipefail
          ( cd sideplay/mytweak-independent-v1a && make clean package FINALPACKAGE=1 )
          ( cd sideplay/mytweak-native-bridgeqa && make clean package FINALPACKAGE=1 )
          ( cd sideplay/firstparty-carplay-admission && make clean package FINALPACKAGE=1 )
      - name: Recompile signed QA147 standalone native owner and independent Home handler
        run: |
          set -euo pipefail
          bash sideplay/duoface-native-scene-host/build.sh
          HOST='sideplay/duoface-native-scene-host/packages/com.duoface.carplay.nativescenehost_0.1.178~kbhud1_iphoneos-arm64.deb'
          test -s "$HOST"
          grep -Fq '<key>CFBundleVersion</key><string>178</string>' sideplay/duoface-native-scene-host/Info.plist
          test "$(dpkg-deb -f "$HOST" Version)" = '0.1.178~kbhud1'
          mkdir -p "$RUNNER_TEMP/qa178-host"
          dpkg-deb -x "$HOST" "$RUNNER_TEMP/qa178-host"
          ldid -e "$RUNNER_TEMP/qa178-host/var/jb/Library/MobileSubstrate/DynamicLibraries/DFTouchOwnerProbe.dylib" >/dev/null
          ldid -e "$RUNNER_TEMP/qa178-host/var/jb/Library/MobileSubstrate/DynamicLibraries/DFCarPlayDockOwner.dylib" >/dev/null
          ! strings -a "$RUNNER_TEMP/qa178-host/var/jb/Library/MobileSubstrate/DynamicLibraries/DFCarPlayDockOwner.dylib" | grep -F 'selected-tap-redirect-to-existing-duoface-icon' >/dev/null
          echo "NATIVEHOST_SHA=$(shasum -a 256 "$HOST" | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Assemble signed independent merged QA147 private candidate, NOT public APT
        run: |
          set -euo pipefail
          python3 sideplay/jb-embedded-appbridge/package_integrated.py --build --expected-nativehost-sha256 "$NATIVEHOST_SHA" --expected-source-sha "$GITHUB_SHA"
          OUT='sideplay/jb-embedded-appbridge/packages/com.duoface.jb.embedded_0.0.178~kbhud1_iphoneos-arm64.deb'
          test -s "$OUT"
          test "$(dpkg-deb -f "$OUT" Package)" = 'com.duoface.jb.embedded'
          test "$(dpkg-deb -f "$OUT" Version)" = '0.0.178~kbhud1'
          mkdir -p "$RUNNER_TEMP/qa178-merged"
          dpkg-deb -x "$OUT" "$RUNNER_TEMP/qa178-merged"
          for mod in DFTouchOwnerProbe DFCarPlayDockOwner DFGofaMapResize141 DFGofaSpeedSource162 DFYouTubeOrientationRelay DFNativeMapPaneCoordinator DF155GeneralAppStateRelay; do
            ldid -e "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/$mod.dylib" >/dev/null
          done
          test -s "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFGofaSpeedSource162.plist"
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFGofaSpeedSource162.dylib" | grep -F 'QA170 fallback real GOFA GPS started' >/dev/null
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFGofaSpeedSource162.dylib" | grep -F 'QA165 GOFA native location CALLBACK' >/dev/null

          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFGofaSpeedSource162.dylib" | grep -F 'GOFA-process-only structural probe installed; alerts/nav NOT connected'
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Applications/DuoFaceNativeHost.app/DuoFaceNativeHost" | grep -F 'DuoFaceTrafficNav166.log'
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Applications/DuoFaceNativeHost.app/DuoFaceNativeHost" | grep -F 'com.duoface.trafficnav.v1.gofa.discovery'
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFGofaSpeedSource162.dylib" | grep -F 'com.duoface.trafficnav.v1.gofa.discovery'
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFGofaSpeedSource162.dylib" | grep -F '[DuoFaceDecoder172]' >/dev/null
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFGofaSpeedSource162.dylib" | grep -F 'com.duoface.trafficnav.v2.gofa.decoder' >/dev/null
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFTouchOwnerProbe.dylib" | grep -F 'com.duoface.speedhud.v1.gofa' >/dev/null
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFTouchOwnerProbe.dylib" | grep -F 'qa175-divider-visibility' >/dev/null
          strings -a "$RUNNER_TEMP/qa178-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFTouchOwnerProbe.dylib" | grep -F 'df175NoteGeometrySkip' >/dev/null
