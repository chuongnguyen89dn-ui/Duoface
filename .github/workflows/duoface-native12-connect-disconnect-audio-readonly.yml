name: DuoFace native12 autostart and disconnect audio read-only audit
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - 'migration/full_payload/native_test/audit_native12_connection_audio_readonly.py'
      - '.github/workflows/duoface-native12-connect-disconnect-audio-readonly.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-native12-connect-disconnect-audio-audit
  cancel-in-progress: false
jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify DEB baseline and syntax
        run: |
          set -euo pipefail
          DEB=dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb
          echo '85d754ea887eb8dd0659f65a5b2e3425564f617983937579753bad1a69433bf7' " $DEB" | sha256sum -c -
          python3 -m py_compile migration/full_payload/native_test/audit_native12_connection_audio_readonly.py
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.duoface.independent'
          test "$(dpkg-deb -f "$DEB" Version)" = '0.1.0~native12'
      - name: Analyze actual native12 connection and audio indicators only
        run: |
          set -euo pipefail
          python3 migration/full_payload/native_test/audit_native12_connection_audio_readonly.py \
            --deb dist/payload-migration/native12/com.duoface.independent_0.1.0~native12_iphoneos-arm64.deb \
            --out audit/payload-migration/NATIVE12_CONNECT_DISCONNECT_AUDIO_READONLY.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('audit/payload-migration/NATIVE12_CONNECT_DISCONNECT_AUDIO_READONLY.json').read_text())
          assert j["status"]=="DUOFACE_NATIVE12_CONNECTION_AUDIO_STATIC_READONLY"
          assert not j["package_modified"]
          assert not j["feature_implemented"]
          assert set(j["binaries"])=={"DuoFaceUI","DuoFaceDashboard"}
          print("NATIVE12_CONNECTION_AUDIO_STATIC_READONLY_REPORT_PASS")
          PY
      - name: Commit report only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/NATIVE12_CONNECT_DISCONNECT_AUDIO_READONLY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit: native12 connection and audio selector inventory [skip ci]'
          for i in 1 2 3 4 5; do
            git fetch origin feature/duoface-exact-payload-migration
            git rebase origin/feature/duoface-exact-payload-migration
            git push origin HEAD:feature/duoface-exact-payload-migration && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duoface-native12-connect-disconnect-audio-readonly
          path: audit/payload-migration/NATIVE12_CONNECT_DISCONNECT_AUDIO_READONLY.json
          if-no-files-found: warn
