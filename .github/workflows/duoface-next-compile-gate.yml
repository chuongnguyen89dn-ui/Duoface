name: DuoFace NEXT UI and border compile-only gate
# No DEB, no package/export and no Sileo. Compile evidence in target repo.
on:
  push:
    paths:
      - 'src/DuoFaceBorderRunner.m'
      - 'src/DuoFaceVisualHook.m'
      - 'runtime/fullscreen/**'
      - '.github/workflows/duoface-next-compile-gate.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  compile-source:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare latest Theos and iOS SDK
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          rm -rf "$RUNNER_TEMP/theos/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos/sdks"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          brew install ldid
      - name: Compile latest 40pt picker and fullscreen functions
        run: |
          set -euo pipefail
          grep -q 'menuHeight=40.0' runtime/fullscreen/DFPickerZoomMenu.xm
          # On actual red2 device photo width/4 made an oversized header; cap it at approved compact 40pt row.
          grep -q 'logoHeight=MIN(width/4.0,menuHeight)' runtime/fullscreen/DFPickerZoomMenu.xm
          grep -q 'sheetWidth-2.0\*sideInset' runtime/fullscreen/DFPickerZoomMenu.xm
          grep -q 'DFApprovedLogoRed' runtime/fullscreen/DFPickerZoomMenu.xm
          grep -q 'DFInstallPickerZoomMenuHooks' runtime/fullscreen/DFFullscreenCoordinator.mm
          cp Makefile.fullscreen Makefile
          make clean all FINALPACKAGE=1
          find .theos -type f -name 'DuoFaceFullscreenBridge.dylib' -print -quit | grep -q .
      - name: Compile latest red white border/hidden-focus visual hook
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 -isysroot "$SDK" -fno-objc-arc -fblocks -Wall -Wextra -Werror -fsyntax-only src/DuoFaceVisualHook.m
          xcrun --sdk iphoneos clang -target arm64-apple-ios15.0 -isysroot "$SDK" -fno-objc-arc -fblocks -dynamiclib -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -Wl,-install_name,@rpath/DuoFaceVisualHook.dylib -o "$RUNNER_TEMP/DuoFaceVisualHook.dylib" src/DuoFaceVisualHook.m
          xcrun lipo "$RUNNER_TEMP/DuoFaceVisualHook.dylib" -verify_arch arm64
          grep -q 'DFBorderLogoRed' src/DuoFaceBorderRunner.m
          grep -q 'DFHideBorderForFocus' src/DuoFaceBorderRunner.m
      - name: Save exact compile results, source checks and hook markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,hashlib,subprocess,json,os
          root=pathlib.Path('.')
          bridge=next(root.glob('.theos/**/DuoFaceFullscreenBridge.dylib'))
          hook=pathlib.Path(os.environ['RUNNER_TEMP'])/'DuoFaceVisualHook.dylib'
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          def hints(p,terms):
            s=subprocess.run(['strings',str(p)],capture_output=True,text=True,check=True).stdout
            return {t:t in s for t in terms}
          bm=hints(bridge,['Zoom In','Zoom Out','Close App','CBMultitaskingOverlayView','com.duoface.fullscreen.picker.v1'])
          hm=hints(hook,['[DuoFaceBorder] RED ON user activity','[DuoFaceBorder] RED OFF native idle','[DuoFaceBorder] install','borderPulse','CBBridgedSplitApp'])
          assert all(bm.values()),bm
          assert all(hm.values()),hm
          # Old red-white runner animations are explicitly forbidden by user.
          assert not any(t in hook.read_bytes().decode('latin1') for t in ('dfStart','dfEnd'))
          visual=pathlib.Path('src/DuoFaceBorderRunner.m').read_text()
          assert 'DFRunnerAnimation' not in visual
          assert 'DFSetBorderVisible(view,NO)' in visual
          assert 'DFSetBorderVisible(view,!DFFocusHidden(self))' in visual
          out={'source_commit':os.environ['GITHUB_SHA'],'status':'COMPILE_ONLY_SUCCESS_NOT_DEVICE_PASS',
            'bridge_sha256':sha(bridge),'visual_hook_sha256':sha(hook),
            'menu_markers':bm,'border_markers':hm,
            'approved_menu_height_pt':40,'border_logo_red':'#E3020F','border_behavior':'red_on_native_activity_clear_on_native_idle',
            'deb_built':False,'sileo_published':False}
          p=root/'audit/duoface-next-compile-20261014.json'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,indent=2)+'\n')
          print(p.read_text())
          PY
      - name: Persist compile-only evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/duoface-next-compile-20261014.json
          git diff --cached --quiet && exit 0
          git commit -m 'ci: persist DuoFace next compile-only evidence [skip ci]'
          for try in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && exit 0
          done
          exit 1
