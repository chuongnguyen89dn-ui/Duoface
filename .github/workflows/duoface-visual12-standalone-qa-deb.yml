name: DuoFace Native12 shell visual acceptance QA - not Sileo yet
# Native12 UI shell6 has a pinned, CI-built, Sileo-published QA artifact.
# Future release builds are manual-only until the user evaluates visual parity.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: visual12-qa-deb
  cancel-in-progress: true
jobs:
  build-qa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify template commit and staging source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'd5227b4cb42bb0143e63840c95eff8d776b73068^{commit}'
          test -s replacement/visual12/engine/runtime/DFIRuntime.m
          test -s replacement/visual12/fullscreen/DFVisual12HostGeometry.m
          test -s replacement/cb-compat/DFCBCompat.m
          test -s dist/visual-1.0.3-12/assets/duoface-icon.png
          test ! -e replacement/visual12/engine/runtime/DuoFaceDashboard.dylib
          test -s replacement/visual12/engine/runtime/DFV12NativeHUD8.inc
      - name: Validate original104 scene geometry and lifecycle source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 replacement/visual12/tests/test_scene_contract.py
          python3 replacement/visual12/tests/test_native_shell_structure.py
      - name: Install iOS rootless DEB build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid dpkg
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build and verify isolated source-only QA DEB
        shell: bash
        run: |
          set -euo pipefail
          bash replacement/visual12/build_qa.sh
          p='dist/visual12-native-shell6-visual-qa/com.duoface.visual12_1.0.3-12~ui8native6_iphoneos-arm64.deb'
          test -s "$p"
          test "$(dpkg-deb -f "$p" Package)" = 'com.duoface.visual12'
          test "$(dpkg-deb -f "$p" Version)" = '1.0.3-12~ui8native6'
          python3 replacement/visual12/verify_qa.py "$p"
          cat dist/visual12-native-shell6-visual-qa/BAO_CAO.json
          cat dist/visual12-native-shell6-visual-qa/SHA256SUMS
      - name: Upload verified DEB as CI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DuoFaceVisual12-Native12-Shell6-VISUAL-PREVIEW-QA
          path: |
            dist/visual12-native-shell6-visual-qa/*.deb
            dist/visual12-native-shell6-visual-qa/BAO_CAO.json
            dist/visual12-native-shell6-visual-qa/CONTENTS.txt
            dist/visual12-native-shell6-visual-qa/SHA256SUMS
          if-no-files-found: error
      - name: Save exact DEB and QA checkpoint in project branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/visual12-native-shell6-visual-qa
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'artifact(native-ui): preserve isolated visual shell QA DEB and SHA256 [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin feature/visual12-duodash-recovery
            git rebase origin/feature/visual12-duodash-recovery
            if git push origin HEAD:feature/visual12-duodash-recovery; then exit 0; fi
            sleep 2
          done
          echo '::error::QA DEB built but persistent GitHub push failed'
          exit 1
