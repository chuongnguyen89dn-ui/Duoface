          strings -a "$RUNNER_TEMP/qa172r-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFTouchOwnerProbe.dylib" | grep -F 'com.duoface.speedhud.visibility.v1.plist' >/dev/null
          strings -a "$RUNNER_TEMP/qa172r-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFCarPlayDockOwner.dylib" | grep -F 'com.duoface.speedhud.visibility.v1.plist' >/dev/null
          strings -a "$RUNNER_TEMP/qa172r-merged/var/jb/Applications/DuoFaceNativeHost.app/DuoFaceNativeHost" | grep -F 'com.duoface.speedhud.visibility.v1.plist' >/dev/null
          strings -a "$RUNNER_TEMP/qa172r-merged/var/jb/Library/MobileSubstrate/DynamicLibraries/DFTouchOwnerProbe.dylib" | grep -F 'Bong bóng tốc độ' >/dev/null || true

