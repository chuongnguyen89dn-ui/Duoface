name: QA146 original DuoNavi DuoDash native Dock and app process contract verification
on:
  push:
    branches: [feature/duoface-qa146-native-home-exit-20261031]
    paths:
      - '.github/workflows/duoface-qa146-duonavi-duodash-verified-native-dock-appstate.yml'
      - 'sideplay/audit/qa146-native-home-dock-parity-20261031/verify_duonavi_duodash_runtime_contract_gaps.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: duoface-qa146-original-duonavi-duodash-verified-contract
  cancel-in-progress: false
jobs:
  prove-static-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate actual deep original DuoNavi and REPACK DuoDash against signed QA146, no execution
        shell: bash
        run: |
          set -euo pipefail
          P='sideplay/audit/qa146-native-home-dock-parity-20261031'
          mkdir -p "$RUNNER_TEMP/crosswalk"
          python3 -m py_compile "$P/verify_duonavi_duodash_runtime_contract_gaps.py"
          python3 "$P/verify_duonavi_duodash_runtime_contract_gaps.py" \
            --original "$P/runs/41189165129/DUONAVI_DUODASH_REPACK_NATIVE_APPBRIDGE_METHOD_CROSSWALK.json" \
            --signed "$P/runs/41188441830/ACTUAL_SIGNED_QA146_APPBRIDGE_FILTER_INVENTORY.json" \
            --out "$RUNNER_TEMP/crosswalk/DUONAVI_DUODASH_NATIVE_DOCK_APP_STATE_VS_QA146.json"
          python3 - "$RUNNER_TEMP/crosswalk/DUONAVI_DUODASH_NATIVE_DOCK_APP_STATE_VS_QA146.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert len(d["static_method_contracts_verified"])==11
          assert d["duodash_original_packaged_filter_any_uikit"]
          assert d["qa146_original_signed_per_app_filters_only"]==["com.google.ios.youtube","com.lumi.GOFA"]
          assert not d["no_runtime_test"] is False
          print("EXACT_ORIGINAL_DUONAVI_DUODASH_AND_SIGNED_QA146_STATIC_CONTRACT_CROSSCHECK_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: duonavi-duodash-Dock-bridge-orientation-proven-source-contracts
          path: ${{ runner.temp }}/crosswalk/DUONAVI_DUODASH_NATIVE_DOCK_APP_STATE_VS_QA146.json
          if-no-files-found: error
      - name: Save crosswalk and CI receipt in correct project branch, refetch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='feature/duoface-qa146-native-home-exit-20261031'
          REL="sideplay/audit/qa146-native-home-dock-parity-20261031/runs/$GITHUB_RUN_ID"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin "$BRANCH"
            T="$(mktemp -d)"
            git worktree add --detach "$T" FETCH_HEAD
            mkdir -p "$T/$REL"
            cp "$RUNNER_TEMP/crosswalk/DUONAVI_DUODASH_NATIVE_DOCK_APP_STATE_VS_QA146.json" "$T/$REL/"
            printf 'RUN_ID=%s\nCHECKOUT_SHA=%s\nORIGINAL_INPUTS_PINNED_AND_ALREADY_ARCHIVED=true\nNATIVE_DOCK_AND_APP_STATE_11_METHOD_CHECKS_PASS=true\nDUODASH_IS_REPACK_NOT_STOCK=true\nNO_DEVICE_QA_OR_SILEO=true\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$T/$REL/CI_RESULT.txt"
            git -C "$T" config user.name 'github-actions[bot]'
            git -C "$T" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$T" add "$REL"
            git -C "$T" commit -m 'audit(qa146): verify both original Dock lifecycles and DuoDash app-side scene protocol [skip ci]'
            if git -C "$T" push origin "HEAD:refs/heads/$BRANCH"; then
              git worktree remove --force "$T"
              git fetch --no-tags origin "$BRANCH"
              git cat-file -e "FETCH_HEAD:$REL/DUONAVI_DUODASH_NATIVE_DOCK_APP_STATE_VS_QA146.json"
              echo DUONAVI_DUODASH_REAL_NATIVE_DOCK_APPSTATE_SOURCE_CONTRACT_SAVED
              exit 0
            fi
            git worktree remove --force "$T"
          done
          exit 1
