name: DuoFace native4 runtime code inventory
on:
  push:
    branches: [feature/duoface-exact-payload-migration]
    paths:
      - 'migration/full_payload/native_test/audit_native4_license_code.py'
      - '.github/workflows/duoface-native4-inventory.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read Objective-C code boundaries in pinned binary
        run: |
          set -euo pipefail
          python3 migration/full_payload/native_test/audit_native4_license_code.py \
            --deb dist/payload-migration/native3/com.duoface.independent_0.1.0~native3_iphoneos-arm64.deb \
            --out audit/payload-migration/NATIVE3_RUNTIME_METHODS.json
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("audit/payload-migration/NATIVE3_RUNTIME_METHODS.json")
          data=json.loads(p.read_text())
          assert data["code_modified"] is False
          assert data["binaries"]["DuoFaceDashboard"]["slices"]
          print("READ_ONLY_NATIVE3_METHOD_INVENTORY_PASS")
          PY
      - name: Save inventory to project branch
        env:
          BRANCH: feature/duoface-exact-payload-migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/payload-migration/NATIVE3_RUNTIME_METHODS.json
          git commit -m 'audit: native3 runtime method and ABI inventory [skip ci]'
          for n in 1 2 3 4; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            git push origin "HEAD:$BRANCH" && exit 0
            sleep 2
          done
          exit 1
      - name: Retain audit as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duoface-native4-runtime-inventory-${{github.run_id}}
          path: audit/payload-migration/NATIVE3_RUNTIME_METHODS.json
          if-no-files-found: warn
